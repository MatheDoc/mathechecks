worum_geht_es: >
  In diesem Abschnitt wird der Produktlebenszyklus als ökonomische Anwendung der
  Analysis untersucht. Funktionen der Form $a(t)=p(t)\cdot e^{-ct}+d$ beschreiben
  den monatlichen Absatz (oder den jährlichen Umsatz) eines Produkts seit der
  Markteinführung. Aus Graph und Funktionsterm werden Kennzahlen wie der höchste
  Absatz, der stärkste Anstieg und Rückgang, der Marktaustritt oder der langfristige
  Absatz bestimmt. Im zweiten Teil wird der Gesamtabsatz als Fläche unter dem Graphen
  gedeutet, abgeschätzt und mit Integralen berechnet.

vorkenntnisse_extern:
  - "Differentialrechnung (Extremstellen, Wendestellen)"
  - "Integralrechnung (bestimmtes Integral)"
  - "Eigenschaften der $e$-Funktion"
