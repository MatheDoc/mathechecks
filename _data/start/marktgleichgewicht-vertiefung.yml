worum_geht_es: >
  Wir bestimmen das Marktgleichgewicht bei nichtlinearen Angebots- und
  Nachfragefunktionen graphisch und rechnerisch. Anschließend deuten und berechnen wir
  die Konsumenten- und Produzentenrente und untersuchen, wie ein Anbieter durch einen
  Teilmarkt einen Teil der Konsumentenrente abschöpfen kann.

