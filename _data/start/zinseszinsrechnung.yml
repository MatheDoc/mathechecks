worum_geht_es: >
  Wie wächst ein einmal angelegter Betrag, wenn die Zinsen Jahr für Jahr
  mitverzinst werden? In diesem Lernbereich arbeitest du mit der
  Zinseszinsformel: Du bestimmst Endkapital, Anfangskapital, Zinssatz oder
  Laufzeit, löst Sachaufgaben, rechnest mit wechselnden Zinssätzen und
  vergleichst Zahlungsangebote über ihre Barwerte.

