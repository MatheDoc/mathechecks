worum_geht_es: >
  Was sind regelmäßige Zahlungen heute oder am Ende der Laufzeit wert? In
  diesem Lernbereich unterscheidest du vor- und nachschüssige Renten,
  arbeitest mit Rentenendwert und Rentenbarwert, bestimmst Rate und
  Laufzeit, kombinierst Renten- und Zinseszinsformel zum Kapitalauf- und
  -abbau und vergleichst Angebote über ihre Barwerte.

