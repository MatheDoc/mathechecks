worum_geht_es: >
  Wie findet man zu Datenpunkten eine Funktion, die sie möglichst gut
  beschreibt? In diesem Lernbereich lernst du die Idee der Regression
  kennen: von der Minimierung der quadratischen Abweichungen über die
  rechnerische Bestimmung von Regressionsfunktionen bis zur Regression
  mit dem Taschenrechner.

