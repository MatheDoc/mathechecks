worum_geht_es: >
  Wie wird ein Darlehen mit gleichbleibenden Jahresraten zurückgezahlt? In
  diesem Lernbereich stellst du Tilgungspläne auf, berechnest Annuität,
  Laufzeit und Restschuld mit den Formeln der Annuitätentilgung,
  vervollständigst lückenhafte Pläne und untersuchst Zinssatzwechsel,
  Sondertilgungen und Tilgungspausen.

