# ──────────────────────────────────────────────────────────
# Lernbereiche
# ──────────────────────────────────────────────────────────
# Felder pro Lernbereich:
#   gebiet            – Fachgebiet (analysis, lineare-algebra, stochastik, finanzmathematik)
#   slug              – URL-Slug / Schlüssel
#   name              – Anzeigename
#   bild              – Dateiname des charakteristischen Bilds (in assets/img/start/), z. B. für die Materialkarte
#   didactic_order    – Didaktische Reihenfolge innerhalb des Gebiets (1, 2, 3 …);
#                       gleiche Werte starten gleichzeitig; fehlt der Eintrag → 0 (kein Sequencing)
#
# Anwendungsszenarien leben direkt im Skript (Einführungsbeispiel oder Leitbeispiel),
# siehe .github/datenmodell.md. Übungsaufgaben sind bewusst NICHT an ein Szenario gebunden,
# um kontextunabhängigen Transfer zu sichern.
# ──────────────────────────────────────────────────────────

