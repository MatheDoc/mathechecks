# ──────────────────────────────────────────────────────────
# Themen
# ──────────────────────────────────────────────────────────
# Plattformunabhängige Themenliste (kontrolliertes Vokabular), v. a. für die
# Verschlagwortung der Musterprüfungen und die Klausur-Config (`themen`).
#
# Ein Thema ist auf MatheChecks umgesetzt (= Lernbereich), wenn in
# _data/lernbereiche.yml ein Lernbereich mit gleichem Slug existiert.
# Jeder Lernbereich MUSS hier mit gleichem Slug und Gebiet stehen.
#
# Felder pro Thema:
#   gebiet – Fachgebiet (wie in _data/gebiete.yml)
#   slug   – eindeutiger Schlüssel (bei umgesetzten Themen = Lernbereich-Slug)
#   name   – Anzeigename
#
# Neue Themen nur ergänzen, wenn ein Prüfungsinhalt keinem bestehenden Thema
# sinnvoll zugeordnet werden kann. Zuschnitt etwa in Lernbereichsgröße.
# ──────────────────────────────────────────────────────────

