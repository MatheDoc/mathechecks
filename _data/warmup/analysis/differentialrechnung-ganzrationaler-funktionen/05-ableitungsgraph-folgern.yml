# Warm-Up zu Check 05 „Aus f' folgern“ (Differentialrechnung ganzrationaler Funktionen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: analysis__differentialrechnung-ganzrationaler-funktionen__05
abschluss: '<p>Im Training bekommst du den Graphen von $f''$ und gibst die $x$-Werte aller Hochpunkte, Tiefpunkte und beider Arten von Wendestellen von $f$ in aufsteigender Reihenfolge an. Gibt es keine, wählst du „keine Lösung“. Denk an die Fallen: Berührt $f''$ die $x$-Achse nur, ohne das Vorzeichen zu wechseln, hat $f$ dort <strong>keinen</strong> Extrempunkt. Hat $f''$ keine Extremstelle (z. B. bei einer Geraden), hat $f$ <strong>keine</strong> Wendestelle. Und nicht jede Stelle liegt genau auf einem Gitterpunkt: Lies dann so genau ab, wie es geht.</p>'
karten:

  # ── Phase A: Idee ─────────────────────────────────────────
  - phase: orientierung
    titel: 'Aus f′ wird f'
    text: '<p>Im Training siehst du nur den Graphen der <strong>Ableitung</strong> $f''$ und liest daraus Hoch-, Tief- und Wendestellen von $f$ ab. Das klappt, weil $f''(x)$ die <strong>Steigung</strong> von $f$ an der Stelle $x$ angibt.</p><p>Damit du den Zusammenhang siehst, ist hier ausnahmsweise auch $f$ eingezeichnet.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '0.5*x^2-2', name: 'f′(x)' }
        - { term: 'x^3/6-2*x', name: 'f(x)' }
      xMin: -3.5
      xMax: 3.5
      yMin: -4.5
      yMax: 4.5
      xSchritt: 1
      ySchritt: 1
      flaechen:
        - { id: plus_l, term: '0.5*x^2-2', von: -3.5, bis: -2, farbe: 'rgba(44,160,44,0.3)' }
        - { id: minus, term: '0.5*x^2-2', von: -2, bis: 2, farbe: 'rgba(214,39,40,0.25)' }
        - { id: plus_r, term: '0.5*x^2-2', von: 2, bis: 3.5, farbe: 'rgba(44,160,44,0.3)' }
      punkte:
        - { id: n1, x: -2, y: 0 }
        - { id: n2, x: 2, y: 0 }
        - { id: hp, x: -2, y: 2.6667, label: 'Hochpunkt von f', ax: -20, ay: -30 }
        - { id: tp, x: 2, y: -2.6667, label: 'Tiefpunkt von f', ax: -10, ay: 38 }
        - { id: tf, x: 0, y: -2, label: 'Tiefpunkt von f′', ax: -60, ay: 28 }
        - { id: wp, x: 0, y: 0, label: 'Wendepunkt von f', ax: 60, ay: -35 }
    schritte:
      - typ: aufdecken
        frage: 'Wo ist $f''$ positiv, wo negativ?'
        knopf: 'Vorzeichen zeigen'
        text: '<p><strong>Grün:</strong> $f''$ liegt über der $x$-Achse. Die Steigung von $f$ ist positiv, $f$ <strong>steigt</strong>.</p><p><strong>Rot:</strong> $f''$ liegt unter der $x$-Achse, $f$ <strong>fällt</strong>.</p>'
        zeige: { flaechen: [plus_l, minus, plus_r], punkte: [n1, n2] }
      - typ: auswahl
        frage: 'Bei $x=-2$ und $x=2$ wechselt $f''$ das Vorzeichen. Schau dir den Graphen von $f$ an diesen Stellen an. Was siehst du?'
        optionen:
          - 'Bei $x=-2$ einen Hochpunkt, bei $x=2$ einen Tiefpunkt.'
          - 'Bei $x=-2$ einen Tiefpunkt, bei $x=2$ einen Hochpunkt.'
          - 'An beiden Stellen eine Nullstelle.'
        korrekt: 0
        hinweis: 'Folge dem Graphen von $f$ von links nach rechts: Wo ist ein Gipfel, wo ein Tal?'
        danach: '<p>Genau. Bei $x=-2$ wechselt $f''$ von $+$ nach $-$: $f$ steigt erst und fällt dann, also ein <strong>Hochpunkt</strong>. Bei $x=2$ wechselt $f''$ von $-$ nach $+$, also ein <strong>Tiefpunkt</strong>.</p>'
        zeige: { punkte: [hp, tp] }
      - typ: aufdecken
        frage: 'Und wo ist die Wendestelle von $f$?'
        knopf: 'Wendestelle zeigen'
        text: '<p>Bei $x=0$ hat $f''$ seinen <strong>Tiefpunkt</strong>: Dort fällt $f$ am steilsten. Bis dahin wird die Steigung von $f$ kleiner, danach wieder größer. $f$ wechselt von rechtsgekrümmt nach linksgekrümmt, also eine <strong>Wendestelle</strong>.</p><p><strong>Merke:</strong></p><ul><li>Nullstelle von $f''$ mit Vorzeichenwechsel → Hoch- oder Tiefpunkt von $f$</li><li>Hoch- oder Tiefpunkt von $f''$ → Wendestelle von $f$</li></ul>'
        zeige: { flaechen: [], punkte: [tf, wp] }

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Jetzt nur mit f′'
    text: '<p>Wie im Training ist nur der Graph von</p>$$f''(x)=-x^2+2x+3$$<p>gegeben. Gesucht sind die Hoch-, Tief- und Wendestellen von $f$.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-x^2+2*x+3', name: 'f′(x)' }
      xMin: -3
      xMax: 5
      yMin: -3
      yMax: 5
      xSchritt: 1
      ySchritt: 1
      xAchse: 'x'
      yAchse: 'f′(x)'
      punkte:
        - { id: n1, x: -1, y: 0, label: 'x = −1', ax: -40, ay: -30 }
        - { id: n2, x: 3, y: 0, label: 'x = 3', ax: 40, ay: -30 }
        - { id: w, x: 1, y: 4, label: 'Hochpunkt von f′', ax: 70, ay: -10, hilfslinie: true }
    schritte:
      - typ: aufdecken
        frage: '<strong>Schritt 1:</strong> Nullstellen von $f''$ ablesen und das Vorzeichen prüfen.'
        knopf: 'Zeigen'
        text: '<p>$f''$ schneidet die $x$-Achse bei $x=-1$ und $x=3$. Links von $-1$ liegt der Graph <strong>unter</strong> der Achse ($-$), zwischen $-1$ und $3$ <strong>darüber</strong> ($+$), rechts von $3$ wieder <strong>darunter</strong> ($-$).</p>'
        zeige: { punkte: [n1, n2] }
      - typ: auswahl
        frage: 'Was hat $f$ bei $x=-1$ und bei $x=3$?'
        optionen:
          - 'Bei $x=-1$ einen Tiefpunkt, bei $x=3$ einen Hochpunkt.'
          - 'Bei $x=-1$ einen Hochpunkt, bei $x=3$ einen Tiefpunkt.'
          - 'An beiden Stellen einen Hochpunkt.'
        korrekt: 0
        hinweis: 'Bei $x=-1$ wechselt $f''$ von $-$ nach $+$: Erst fällt $f$, dann steigt $f$.'
        danach: '<p>Bei $x=-1$ von $-$ nach $+$: <strong>Tiefpunkt</strong>. Bei $x=3$ von $+$ nach $-$: <strong>Hochpunkt</strong>.</p>'
      - typ: eingabe
        frage: '<strong>Schritt 2:</strong> Wendestellen von $f$ sind Extremstellen von $f''$. Wo hat $f''$ seinen Hochpunkt?'
        felder:
          - { label: '$x=$', loesung: 1, zeige: { punkte: [w] } }
        hinweis: 'Suche den höchsten Punkt der Kurve und lies seinen $x$-Wert ab.'
      - typ: auswahl
        frage: 'Bis $x=1$ steigt $f''$, danach fällt $f''$. Wie wechselt die Krümmung von $f$?'
        optionen:
          - 'Von linksgekrümmt nach rechtsgekrümmt.'
          - 'Von rechtsgekrümmt nach linksgekrümmt.'
        korrekt: 0
        mischen: false
        hinweis: 'Wächst die Steigung, ist $f$ linksgekrümmt. Nimmt sie ab, ist $f$ rechtsgekrümmt.'
        danach: '<p>Ergebnis: Tiefpunkt bei $x=-1$, Hochpunkt bei $x=3$, Wendestelle bei $x=1$ (links → rechts).</p><p>Ein <strong>Hochpunkt</strong> von $f''$ gibt links → rechts, ein <strong>Tiefpunkt</strong> von $f''$ gibt rechts → links.</p>'

  # ── Phase C: Mitmachen ────────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Ableitung – mit Hilfe'
    text: '<p>Jetzt ist der Graph von</p>$$f''(x)=0{,}5x^2+x-1{,}5$$<p>gegeben. Du gehst dieselben Schritte durch.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '0.5*x^2+x-1.5', name: 'f′(x)' }
      xMin: -5
      xMax: 3
      xSchritt: 1
      yMin: -3
      yMax: 6
      xAchse: 'x'
      yAchse: 'f′(x)'
      punkte:
        - { id: n1, x: -3, y: 0, label: 'x = −3', ax: -40, ay: -30 }
        - { id: n2, x: 1, y: 0, label: 'x = 1', ax: 40, ay: -30 }
        - { id: w, x: -1, y: -2, label: 'Tiefpunkt von f′', ax: 70, ay: 25, hilfslinie: true }
    schritte:
      - typ: eingabe
        frage: '<strong>Nullstellen von $f''$:</strong> Lies sie am Graphen ab.'
        layout: zeile
        felder:
          - { label: '$x_1=$', loesung: -3, einheit: '$\quad x_2=$', zeige: { punkte: [n1] } }
          - { loesung: 1, zeige: { punkte: [n2] } }
        hinweis: 'Suche die Stellen, an denen die Kurve die $x$-Achse schneidet.'
      - typ: zuordnen
        frage: '<strong>Vorzeichenwechsel deuten:</strong> Was hat $f$ an diesen Stellen?'
        titel_links: 'Vorzeichenwechsel von $f''$'
        titel_rechts: 'Punkt von $f$'
        paare:
          - { links: 'Bei $x=-3$: von $+$ nach $-$', rechts: 'Hochpunkt' }
          - { links: 'Bei $x=1$: von $-$ nach $+$', rechts: 'Tiefpunkt' }
        hilfe: 'Tippe erst links, dann rechts.'
        danach: '<p>Hochpunkt bei $x=-3$, Tiefpunkt bei $x=1$.</p>'
      - typ: eingabe
        frage: '<strong>Wendestelle:</strong> $f''$ hat einen Tiefpunkt. Wo liegt er?'
        felder:
          - { label: '$x=$', loesung: -1, zeige: { punkte: [w] } }
        hinweis: 'Der Tiefpunkt der Parabel liegt genau in der Mitte zwischen den Nullstellen.'
      - typ: auswahl
        frage: 'Ein <strong>Tiefpunkt</strong> von $f''$ bei $x=-1$: Wie ändert sich die Krümmung von $f$?'
        optionen:
          - 'Von linksgekrümmt nach rechtsgekrümmt.'
          - 'Von rechtsgekrümmt nach linksgekrümmt.'
        korrekt: 1
        mischen: false
        hinweis: 'Bis $x=-1$ fällt $f''$, danach steigt $f''$. Die Steigung von $f$ nimmt also erst ab und wächst dann.'
        danach: '<p>Wendestelle bei $x=-1$ mit Wechsel von rechts- nach linksgekrümmt.</p>'

  - phase: mitmachen
    titel: 'Eine knifflige Ableitung'
    text: '<p>Diesmal ist $f''$ eine Funktion dritten Grades. Eine ihrer Nullstellen hat es in sich.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '0.5*x^3-1.5*x+1', name: 'f′(x)' }
      xMin: -3.2
      xMax: 2.5
      xSchritt: 1
      yMin: -9
      yMax: 6
      xAchse: 'x'
      yAchse: 'f′(x)'
      punkte:
        - { id: n1, x: -2, y: 0, label: 'x = −2', ax: -40, ay: -30 }
        - { id: n2, x: 1, y: 0, label: 'x = 1', ax: 40, ay: -40 }
        - { id: w1, x: -1, y: 2, label: 'Hochpunkt von f′', ax: 80, ay: -20, hilfslinie: true }
        - { id: w2, x: 1, y: 0, label: 'Tiefpunkt von f′', ax: 40, ay: 40, hilfslinie: true }
    schritte:
      - typ: eingabe
        frage: '<strong>Nullstellen von $f''$:</strong> An welchen Stellen berührt oder schneidet der Graph die $x$-Achse?'
        layout: zeile
        felder:
          - { label: '$x_1=$', loesung: -2, einheit: '$\quad x_2=$', zeige: { punkte: [n1] } }
          - { loesung: 1, zeige: { punkte: [n2] } }
        hinweis: 'Eine Stelle liegt links, eine rechts vom Ursprung.'
      - typ: auswahl
        frage: 'Bei welcher dieser Nullstellen hat $f$ einen Hoch- oder Tiefpunkt?'
        optionen:
          - 'Nur bei $x=-2$.'
          - 'Nur bei $x=1$.'
          - 'Bei beiden.'
        korrekt: 0
        hinweis: 'Ein Extrempunkt braucht einen Vorzeichenwechsel von $f''$. Schau dir den Graphen bei $x=1$ genau an.'
        danach: '<p>Bei $x=-2$ wechselt $f''$ von $-$ nach $+$: <strong>Tiefpunkt</strong>. Bei $x=1$ <strong>berührt</strong> $f''$ die Achse nur und bleibt positiv. Es gibt keinen Vorzeichenwechsel, also <strong>keinen</strong> Extrempunkt.</p>'
      - typ: eingabe
        frage: '<strong>Wendestellen:</strong> Wo hat $f''$ einen Hochpunkt, wo einen Tiefpunkt?'
        layout: zeile
        felder:
          - { label: 'Hochpunkt bei $x=$', loesung: -1, einheit: '$\quad$ Tiefpunkt bei $x=$', zeige: { punkte: [w1] } }
          - { loesung: 1, zeige: { punkte: [w2] } }
        hinweis: 'Der Hochpunkt liegt links, der Tiefpunkt genau auf der Nullstelle, die nur berührt wird.'
      - typ: auswahl
        frage: 'Was bedeutet das für die Wendestellen von $f$?'
        optionen:
          - 'Bei $x=-1$ von links nach rechts gekrümmt, bei $x=1$ von rechts nach links gekrümmt.'
          - 'Bei $x=-1$ von rechts nach links gekrümmt, bei $x=1$ von links nach rechts gekrümmt.'
        korrekt: 0
        mischen: false
        hinweis: 'Hochpunkt von $f''$: links → rechts. Tiefpunkt von $f''$: rechts → links.'
        danach: '<p>Damit ist alles beisammen: Tiefpunkt bei $x=-2$, Wendestellen bei $x=-1$ und $x=1$. Bei $x=1$ ist die Wendestelle zugleich ein Punkt mit waagrechter Tangente (Sattelpunkt).</p>'
