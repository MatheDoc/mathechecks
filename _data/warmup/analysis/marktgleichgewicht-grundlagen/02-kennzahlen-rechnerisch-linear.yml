# Warm-Up zu Check 02 „MGG berechnen (linear)“ (Marktgleichgewicht - Grundlagen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: analysis__marktgleichgewicht-grundlagen__02
abschluss: '<p>Im Training sind die Zahlen krummer – die Rechenmuster bleiben dieselben. Nimm den Taschenrechner dazu und prüfe jede Teilaufgabe einzeln.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Zwei Geraden – ein Markt'
    text: '<p>Die <strong>Nachfragefunktion</strong> $p_N$ fällt: Je höher der Preis, desto weniger wird nachgefragt. Die <strong>Angebotsfunktion</strong> $p_A$ steigt: Je höher der Preis, desto mehr wird angeboten.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-2x+42', name: 'p<sub>N</sub>(x) = −2x + 42', xmin: 0, xmax: 21 }
        - { term: '1.5x+14', name: 'p<sub>A</sub>(x) = 1,5x + 14', xmin: 0, xmax: 22 }
      xMin: -1
      xMax: 24
      yMin: -2
      yMax: 48
      xAchse: 'x in ME'
      yAchse: 'p in GE'
      punkte:
        - { id: hp, x: 0, y: 42, label: 'Höchstpreis', ax: 64, ay: -6 }
        - { id: map, x: 0, y: 14, label: 'Mindestangebotspreis', ax: 84, ay: 18 }
        - { id: sm, x: 21, y: 0, label: 'Sättigungsmenge', ax: -20, ay: -34 }
        - { id: mg, x: 8, y: 26, label: 'Marktgleichgewicht', hilfslinie: true, ax: 60, ay: -34 }
    schritte:
      - typ: aufdecken
        knopf: 'Zeig mir die besonderen Punkte'
        text: '<p>Vier Punkte sind besonders: wo die Geraden die Achsen treffen und wo sie sich schneiden. Jeder dieser Punkte liefert eine <strong>Kennzahl</strong>.</p>'
        zeige: { punkte: [hp, map, sm, mg] }
      - typ: auswahl
        frage: 'Wo liegt das Marktgleichgewicht?'
        optionen:
          - 'Wo die Nachfragegerade die $x$-Achse trifft'
          - 'Im Schnittpunkt von Angebots- und Nachfragegerade'
          - 'Wo die Angebotsgerade die $y$-Achse trifft'
        korrekt: 1
        hinweis: 'Nicht ganz. Im Gleichgewicht passen Angebot und Nachfrage zusammen – beide Geraden haben dort denselben Punkt.'
        danach: '<p>Genau. Dort ist der Preis für Anbieter und Nachfrager gleich – hier bei $8$ ME und $26$ GE.</p>'

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Kennzahlen an den Achsen'
    text: '<p>Gleiche Funktionen wie eben: $p_N(x)=-2x+42$ und $p_A(x)=1{,}5x+14$. Alles, was an einer Achse liegt, ist schnell berechnet.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-2x+42', name: 'p<sub>N</sub>', xmin: 0, xmax: 21 }
        - { term: '1.5x+14', name: 'p<sub>A</sub>', xmin: 0, xmax: 22 }
      xMin: -1
      xMax: 24
      yMin: -2
      yMax: 48
      xAchse: 'x in ME'
      yAchse: 'p in GE'
      punkte:
        - { id: hp, x: 0, y: 42, label: 'Höchstpreis', ax: 64, ay: -6 }
        - { id: map, x: 0, y: 14, label: 'Mindestangebotspreis', ax: 84, ay: 18 }
        - { id: sm, x: 21, y: 0, label: 'Sättigungsmenge', ax: -20, ay: -34 }
    schritte:
      - typ: aufdecken
        frage: '<strong>Höchstpreis</strong> – dort trifft $p_N$ die $y$-Achse, also bei $x=0$.'
        knopf: 'Rechnung zeigen'
        text: '$$p_N(0)=-2\cdot 0+42=42$$<p>Der Höchstpreis beträgt $42$ GE.</p>'
        zeige: { punkte: [hp] }
      - typ: auswahl
        frage: '<strong>Mindestangebotspreis</strong> – wie berechnet man ihn?'
        optionen:
          - '$p_N(0)$ berechnen'
          - '$p_A(0)$ berechnen'
          - '$p_A(x)=0$ lösen'
        korrekt: 1
        hinweis: 'Es geht um das Angebot – und um die $y$-Achse.'
        danach: '$$p_A(0)=1{,}5\cdot 0+14=14$$<p>Der Mindestangebotspreis beträgt $14$ GE.</p>'
        zeige: { punkte: [map] }
      - typ: aufdecken
        frage: '<strong>Sättigungsmenge</strong> – dort trifft $p_N$ die $x$-Achse, also $p_N(x)=0$.'
        knopf: 'Rechnung zeigen'
        text: '$$\begin{align*}-2x+42&=0 \quad|-42\\ -2x&=-42 \quad|:(-2)\\ x&=21\end{align*}$$<p>Die Sättigungsmenge beträgt $21$ ME.</p>'
        zeige: { punkte: [sm] }

  - phase: vormachen
    titel: 'Das Marktgleichgewicht'
    text: '<p>Im Gleichgewicht haben beide Funktionen denselben Wert. Das führt auf eine Gleichung.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-2x+42', name: 'p<sub>N</sub>', xmin: 0, xmax: 21 }
        - { term: '1.5x+14', name: 'p<sub>A</sub>', xmin: 0, xmax: 22 }
      xMin: -1
      xMax: 24
      yMin: -2
      yMax: 48
      xAchse: 'x in ME'
      yAchse: 'p in GE'
      punkte:
        - { id: mg, x: 8, y: 26, label: 'Marktgleichgewicht', hilfslinie: true, ax: 60, ay: -34 }
    schritte:
      - typ: auswahl
        frage: '<strong>Gleichgewichtsmenge</strong> – welcher Ansatz passt?'
        optionen:
          - '$p_N(x)=0$ lösen'
          - '$p_N(x)=p_A(x)$ lösen'
          - '$p_A(0)$ berechnen'
        korrekt: 1
        hinweis: 'Gesucht ist der Schnittpunkt der beiden Geraden.'
      - typ: aufdecken
        knopf: 'Gleichung lösen'
        text: '$$\begin{align*}-2x+42&=1{,}5x+14 \quad|+2x-14\\ 28&=3{,}5x \quad|:3{,}5\\ x_G&=8\end{align*}$$<p>Die Gleichgewichtsmenge beträgt $8$ ME.</p>'
      - typ: aufdecken
        frage: '<strong>Gleichgewichtspreis</strong> – $x_G=8$ in eine der beiden Funktionen einsetzen.'
        knopf: 'Einsetzen'
        text: '$$p_N(8)=-2\cdot 8+42=26$$<p>Zur Kontrolle: $p_A(8)=1{,}5\cdot 8+14=26$ ✓. Der Gleichgewichtspreis beträgt $26$ GE.</p>'
        zeige: { punkte: [mg] }

  # ── Phase C: Mitmachen (Fading nach Rechenmuster) ──────────
  - phase: mitmachen
    titel: 'Welches Rechenmuster gehört wozu?'
    text: '<p>Fünf Kennzahlen, vier Rechenmuster. Wer die Zuordnung kennt, hat den Check im Griff.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Kennzahl'
        titel_rechts: 'Rechenmuster'
        paare:
          - { links: 'Höchstpreis', rechts: '$p_N(0)$' }
          - { links: 'Mindestangebotspreis', rechts: '$p_A(0)$' }
          - { links: 'Sättigungsmenge', rechts: '$p_N(x)=0$ lösen' }
          - { links: 'Gleichgewichtsmenge', rechts: '$p_N(x)=p_A(x)$ lösen' }
          - { links: 'Gleichgewichtspreis', rechts: '$x_G$ in $p_N$ oder $p_A$ einsetzen' }
        danach: '<p>Höchst- und Mindestangebotspreis folgen demselben Muster. Deshalb rechnest du gleich den einen mit Hilfe und den anderen allein.</p>'

  - phase: mitmachen
    titel: 'Neue Zahlen – du rechnest mit'
    text: '<p>Jetzt gilt $p_N(x)=-3x+60$ und $p_A(x)=2x+10$. Ein Teil ist vorgerechnet, den Rest übernimmst du.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-3x+60', name: 'p<sub>N</sub>', xmin: 0, xmax: 20 }
        - { term: '2x+10', name: 'p<sub>A</sub>', xmin: 0, xmax: 24 }
      xMin: -1
      xMax: 24
      yMin: -2
      yMax: 66
      xAchse: 'x in ME'
      yAchse: 'p in GE'
      punkte:
        - { id: hp, x: 0, y: 60, label: 'Höchstpreis', ax: 64, ay: -4 }
        - { id: map, x: 0, y: 10, label: 'Mindestangebotspreis', ax: 84, ay: 16 }
        - { id: sm, x: 20, y: 0, label: 'Sättigungsmenge', ax: -20, ay: -34 }
    schritte:
      - typ: eingabe
        frage: '<strong>Höchstpreis</strong> – der Ansatz steht schon da: $p_N(0)=-3\cdot 0+60$'
        felder:
          - { label: '$p_N(0)=$', loesung: 60, einheit: 'GE', zeige: { punkte: [hp] } }
        hinweis: 'Setze $x=0$ ein: Es bleibt nur die Zahl ohne $x$ übrig.'
      - typ: eingabe
        frage: '<strong>Mindestangebotspreis</strong> – gleiches Muster, jetzt ohne Vorgabe.'
        felder:
          - { label: '$p_A(0)=$', loesung: 10, einheit: 'GE', zeige: { punkte: [map] } }
        hinweis: 'Wie beim Höchstpreis – nur mit $p_A$.'
      - typ: eingabe
        frage: '<strong>Sättigungsmenge</strong> – die Umformung ist schon fast fertig: $$\begin{align*}-3x+60&=0 \quad|-60\\ -3x&=-60 \quad|:(-3)\end{align*}$$'
        felder:
          - { label: '$x=$', loesung: 20, einheit: 'ME', zeige: { punkte: [sm] } }
        hinweis: 'Teile $-60$ durch $-3$.'

  - phase: mitmachen
    titel: 'Das Gleichgewicht – mit weniger Hilfe'
    text: '<p>Weiter mit $p_N(x)=-3x+60$ und $p_A(x)=2x+10$.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-3x+60', name: 'p<sub>N</sub>', xmin: 0, xmax: 20 }
        - { term: '2x+10', name: 'p<sub>A</sub>', xmin: 0, xmax: 24 }
      xMin: -1
      xMax: 24
      yMin: -2
      yMax: 66
      xAchse: 'x in ME'
      yAchse: 'p in GE'
      punkte:
        - { id: mg, x: 10, y: 30, label: 'Marktgleichgewicht', hilfslinie: true, ax: 60, ay: -34 }
    schritte:
      - typ: eingabe
        frage: '<strong>Gleichgewichtsmenge</strong> – den Ansatz kennst du: $$-3x+60=2x+10$$'
        felder:
          - { label: '$x_G=$', loesung: 10, einheit: 'ME' }
        hinweis: 'Bring alle $x$ auf eine Seite: Mit $+3x-10$ erhältst du $50=5x$.'
      - typ: eingabe
        frage: '<strong>Gleichgewichtspreis</strong> – jetzt ganz ohne Vorgabe.'
        felder:
          - { label: '$p_G=$', loesung: 30, einheit: 'GE', zeige: { punkte: [mg] } }
        hinweis: 'Setze $x_G$ in $p_N$ oder $p_A$ ein.'
        danach: '<p>Stark – das waren alle Kennzahlen.</p>'
