# Warm-Up zu Check 05 „Gewinnsituationen analysieren“ (Ganzrationale ökonomische Funktionen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: analysis__ganzrationale-oekonomische-funktionen__05
abschluss: '<p>Jede Trainingsaufgabe beginnt mit dem Cournotschen Punkt: erst $x_{Gmax}$ über $G''(x)=0$, dann der Preis $p(x_{Gmax})$. Für die übrigen Fragen übersetzt du die Frage in eine Gleichung mit $G$ oder $G''$.</p>'
karten:

  # ── Phase A: Idee ─────────────────────────────────────────
  - phase: orientierung
    titel: 'Erst die Menge, dann der Preis'
    text: '<p>Als Monopolist kann Velotec Menge und Preis nicht getrennt festlegen: Zu jeder Menge gehört über $p(x)=-6x+84$ genau ein Preis. Das Diagramm zeigt $p$ und die Gewinnfunktion $G$.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-6x+84', name: 'p(x)', xmin: 0, xmax: 14, color: '#ff7f0e' }
        - { term: '-0.5x^3+54x-48', name: 'G(x)', xmin: 0, xmax: 10.5, color: '#1f77b4' }
      xMin: -0.3
      xMax: 14.5
      yMin: -60
      yMax: 200
      xSchritt: 1
      ySchritt: 20
      xAchse: 'x in ME'
      yAchse: 'GE bzw. GE/ME'
      punkte:
        - { id: hp, x: 6, y: 168, label: 'Hochpunkt von G', hilfslinie: true, ax: 60, ay: -10 }
        - { id: c, x: 6, y: 48, label: 'C(6 | 48)', hilfslinie: true, ax: 50, ay: -30 }
    schritte:
      - typ: aufdecken
        knopf: 'Welche Menge wählt Velotec?'
        text: '<p>Die Menge mit dem größten Gewinn: den $x$-Wert des Hochpunkts von $G$, also die <strong>gewinnmaximale Menge</strong> $x_{Gmax}=6$ ME.</p>'
        zeige: { punkte: [hp] }
      - typ: auswahl
        frage: 'Welchen Preis kann Velotec für diese $6$ ME verlangen? Schau im Diagramm nach.'
        optionen:
          - '$48$ GE/ME'
          - '$168$ GE/ME'
          - '$84$ GE/ME'
        korrekt: 0
        hinweis: 'Der Preis steht nicht an $G$, sondern an der Preis-Absatz-Funktion $p$.'
        danach: '<p>Richtig: $p(6)=48$ ist der <strong>gewinnmaximale Preis</strong>. Menge und Preis zusammen bilden den <strong>Cournotschen Punkt</strong> $C(6\mid 48)$: 600 Anhänger zu je 480 €.</p><p><strong>Merke:</strong> $C\bigl(x_{Gmax}\mid p(x_{Gmax})\bigr)$ liegt auf dem Graphen von $p$, nicht auf dem von $G$.</p>'
        zeige: { punkte: [c] }

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Cournotscher Punkt berechnen'
    text: '<p>Rechnerisch für Velotec mit</p>$$\begin{align*}p(x)&=-6x+84\\ G(x)&=-0{,}5x^3+54x-48\end{align*}$$'
    schritte:
      - typ: aufdecken
        frage: '<strong>1. Gewinnmaximale Menge</strong>'
        knopf: 'Rechnung zeigen'
        text: '<p>$G''(x)=0$:</p>$$\begin{align*}-1{,}5x^2+54&=0\\ x_1=-6,\ x_2&=6\\ G^{\prime\prime}(6)&=-18&lt;0\end{align*}$$<p>$x_1$ fällt weg, also $x_{Gmax}=6$ ME.</p>'
      - typ: eingabe
        frage: '<strong>2. Gewinnmaximaler Preis:</strong> $p(6)=-6\cdot 6+84$'
        felder:
          - { label: '$p_{max}=$', loesung: 48, einheit: 'GE/ME' }
        hinweis: 'Rechne $-36+84$.'
        danach: '<p>Cournotscher Punkt: $C(6\mid 48)$.</p>'

  - phase: vormachen
    titel: 'Was ändert sich, wenn die Fixkosten steigen?'
    text: '<p>Die Hallenmiete steigt, die Fixkosten wachsen von $48$ auf $100$ GE. Dann gilt $G_{neu}(x)=G(x)-52$.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '-6x+84', name: 'p(x)', xmin: 0, xmax: 14, color: '#ff7f0e' }
        - { term: '-0.5x^3+54x-48', name: 'G(x)', xmin: 0, xmax: 10.5, color: '#1f77b4' }
        - { term: '-0.5x^3+54x-100', name: 'G<sub>neu</sub>(x)', xmin: 0, xmax: 10.5, color: '#9467bd' }
      xMin: -0.3
      xMax: 14.5
      yMin: -110
      yMax: 200
      xSchritt: 1
      ySchritt: 40
      xAchse: 'x in ME'
      yAchse: 'GE bzw. GE/ME'
      punkte:
        - { id: hp, x: 6, y: 168, ax: 50, ay: -10, sichtbar: true }
        - { id: hpn, x: 6, y: 116, label: 'Hochpunkt von G<sub>neu</sub>', hilfslinie: true, ax: -80, ay: -70 }
        - { id: c, x: 6, y: 48, label: 'C(6 | 48)', ax: 60, ay: 40 }
    schritte:
      - typ: auswahl
        frage: 'Schau dir $G_{neu}$ an. Wo liegt jetzt das Gewinnmaximum?'
        optionen:
          - 'wieder bei $6$ ME, aber $52$ GE tiefer'
          - 'weiter links, bei weniger als $6$ ME'
          - 'weiter rechts, bei mehr als $6$ ME'
        korrekt: 0
        hinweis: 'Der Graph wird nur nach unten verschoben.'
        danach: '<p>Beim Ableiten fällt die Konstante weg, $G''$ bleibt gleich. Also bleiben $x_{Gmax}=6$ ME und $p(6)=48$: <strong>Der Cournotsche Punkt ändert sich nicht.</strong> Nur der maximale Gewinn sinkt auf $116$ GE, und die Gewinnzone wird kleiner.</p>'
        zeige: { punkte: [hpn, c] }
      - typ: aufdecken
        frage: 'Weitere Fragen an die Gewinnfunktion'
        knopf: 'Ansätze zeigen'
        text: '<ul><li><strong>Gewinn mindestens $c$ GE:</strong> $G(x)=c$ lösen</li><li><strong>Gewinnzone vor oder nach dem Maximum:</strong> Vorzeichen von $G''(x_0)$</li><li><strong>höchstens tragbare Fixkosten:</strong> bisherige Fixkosten $+\,G_{max}$</li><li><strong>Lohnt sich eine Maßnahme?</strong> $G(x_2)-G(x_1)$ mit ihren Kosten vergleichen</li><li><strong>Patent läuft aus:</strong> mit dem Marktpreis wie im Polypol rechnen</li></ul>'

  # ── Phase C: Mitmachen ────────────────────────────────────
  - phase: mitmachen
    titel: 'Welcher Ansatz passt?'
    text: '<p>Ordne jeder Frage den Ansatz zu.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Frage'
        titel_rechts: 'Ansatz'
        paare:
          - { links: 'gewinnmaximale Menge', rechts: '$G''(x)=0$' }
          - { links: 'gewinnmaximaler Preis', rechts: '$p(x_{Gmax})$' }
          - { links: 'Mengen mit Gewinn mindestens $100$ GE', rechts: '$G(x)=100$' }
          - { links: 'Gewinn steigt bei $x_0$ noch?', rechts: '$G''(x_0)>0$' }
          - { links: 'Gewinnzuwachs von $x_1$ auf $x_2$', rechts: '$G(x_2)-G(x_1)$' }

  - phase: mitmachen
    titel: 'Neuer Monopolist – jetzt rechnest du'
    text: '<p>Ein anderer Monopolist hat</p>$$\begin{align*}p(x)&=-4x+104\\ G(x)&=-0{,}5x^3+x^2+80x-88\end{align*}$$'
    schritte:
      - typ: eingabe
        frage: '<strong>Gewinnmaximale Menge</strong> – der Ansatz steht da: $G''(x)=-1{,}5x^2+2x+80=0$'
        felder:
          - { label: '$x_{Gmax}=$', loesung: 8, einheit: 'ME' }
        hinweis: 'Löse mit dem Taschenrechner. Die negative Lösung fällt weg.'
        danach: '<p>$x_1\approx-6{,}67$ fällt weg, $G^{\prime\prime}(8)=-22&lt;0$ bestätigt das Maximum.</p>'
      - typ: eingabe
        frage: '<strong>Cournotscher Punkt</strong> – jetzt ohne Vorgabe.'
        layout: zeile
        felder:
          - { label: '$C($', einheit: '$\mid$', loesung: 8, aria: 'Menge' }
          - { einheit: '$)$', loesung: 72, aria: 'Preis' }
        hinweis: 'Der Preis gehört zur Preis-Absatz-Funktion: $p(8)=-4\cdot 8+104$.'
      - typ: eingabe
        frage: '<strong>Höchstens tragbare Fixkosten:</strong> Die Fixkosten betragen $88$ GE, der maximale Gewinn $G(8)=360$ GE.'
        felder:
          - { label: '$K_{f,max}=$', loesung: 448, einheit: 'GE' }
        hinweis: 'Die Fixkosten dürfen um den maximalen Gewinn steigen.'
        danach: '<p>$88+360=448$ GE. Bei noch höheren Fixkosten liegt $G$ überall unter der $x$-Achse.</p>'
