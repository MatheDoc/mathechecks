# Warm-Up zu Check 06 „Kostenfunktion aufstellen“ (Ertragsgesetzliche Kostenfunktionen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: analysis__ertragsgesetzliche-kostenfunktionen__06
abschluss: '<p>Im Training bekommst du vier Informationen und bestimmst $a$, $b$, $c$ und $d$. Der Plan bleibt immer gleich: Jede Information wird zu einer Gleichung, dann löst du das Gleichungssystem mit dem Taschenrechner.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Einmal andersherum'
    text: '<p>Bisher war die Kostenfunktion gegeben, und du hast Kennzahlen wie Fixkosten oder Betriebsminimum berechnet. Jetzt ist es umgekehrt: Die Kennzahlen sind bekannt, die Funktion $K(x)=ax^3+bx^2+cx+d$ ist gesucht.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '0.5x^3-6x^2+30x+48', name: 'K(x)', xmin: 0, xmax: 9 }
      xMin: -0.5
      xMax: 9.5
      yMin: 0
      yMax: 220
      xAchse: 'x in ME'
      yAchse: 'K in GE'
      punkte:
        - { id: fix, x: 0, y: 48, label: 'Fixkosten: K(0) = 48', ax: 70, ay: 24 }
        - { id: k2, x: 2, y: 88, label: 'K(2) = 88', ax: 30, ay: -40 }
    schritte:
      - typ: auswahl
        frage: 'Was ist bei einer solchen Steckbriefaufgabe gesucht?'
        optionen:
          - 'Die Kennzahlen einer gegebenen Kostenfunktion'
          - 'Die Gleichung der Kostenfunktion'
          - 'Die Menge mit den geringsten Kosten'
        korrekt: 1
        hinweis: 'Die Kennzahlen stehen schon im Aufgabentext.'
        danach: '<p>Genau. Gesucht sind die vier Zahlen $a$, $b$, $c$ und $d$.</p>'
      - typ: auswahl
        frage: 'Wie viele Informationen brauchst du, um $a$, $b$, $c$ und $d$ festzulegen?'
        optionen:
          - 'Zwei'
          - 'Drei'
          - 'Vier'
        korrekt: 2
        hinweis: 'Zähle die Unbekannten.'
        danach: '<p>Richtig: vier Unbekannte, also vier Gleichungen. Zwei Informationen kannst du sogar direkt im Graphen sehen.</p>'
        zeige: { punkte: [fix, k2] }

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Jede Information wird zu einer Gleichung'
    text: '<p>Rechts steht der Steckbrief. Gesucht ist $K(x)=ax^3+bx^2+cx+d$.</p>'
    visual:
      typ: liste
      titel: 'Steckbrief'
      eintraege:
        - { id: fix, text: 'Die Fixkosten betragen 48 GE.', gleichung: '$d=48$' }
        - { id: k2, text: 'Die Kosten bei 2 ME betragen 88 GE.', gleichung: '$8a+4b+2c+d=88$' }
        - { id: gk, text: 'Die Grenzkosten bei 1 ME betragen 19,5 GE/ME.', gleichung: '$3a+2b+c=19{,}5$' }
        - { id: bm, text: 'Das Betriebsminimum liegt bei 6 ME.', gleichung: '$12a+b=0$' }
    schritte:
      - typ: aufdecken
        frage: 'Zuerst die Werkzeuge: Neben $K$ brauchst du oft weitere Funktionen.'
        knopf: 'Werkzeuge zeigen'
        text: '<p>Grenzkosten:</p>$$K''(x)=3ax^2+2bx+c$$<p>Variable Stückkosten und ihre Ableitung:</p>$$\begin{align*}k_v(x)&=ax^2+bx+c\\ k_v''(x)&=2ax+b\end{align*}$$'
      - typ: aufdecken
        frage: '<strong>Fixkosten</strong> – das sind die Kosten bei $0$ ME.'
        knopf: 'Gleichung zeigen'
        text: '$$\begin{align*}K(0)&=48\\ a\cdot 0^3+b\cdot 0^2+c\cdot 0+d&=48\\ d&=48\end{align*}$$'
        zeige: { eintraege: [fix] }
      - typ: aufdecken
        frage: '<strong>Kosten bei 2 ME</strong> – setze $x=2$ in $K$ ein.'
        knopf: 'Gleichung zeigen'
        text: '$$\begin{align*}K(2)&=88\\ a\cdot 2^3+b\cdot 2^2+c\cdot 2+d&=88\\ 8a+4b+2c+d&=88\end{align*}$$'
        zeige: { eintraege: [k2] }
      - typ: auswahl
        frage: '<strong>Grenzkosten bei 1 ME</strong> – welche Funktion brauchst du?'
        optionen:
          - '$K(1)=19{,}5$'
          - '$K''(1)=19{,}5$'
          - '$k_v(1)=19{,}5$'
        korrekt: 1
        hinweis: 'Grenzkosten sind die Ableitung der Kosten.'
        danach: '$$\begin{align*}K''(1)&=19{,}5\\ 3a\cdot 1^2+2b\cdot 1+c&=19{,}5\\ 3a+2b+c&=19{,}5\end{align*}$$'
        zeige: { eintraege: [gk] }
      - typ: auswahl
        frage: '<strong>Betriebsminimum bei 6 ME</strong> – dort sind die variablen Stückkosten minimal. Welche Gleichung passt?'
        optionen:
          - '$k_v(6)=0$'
          - '$k_v''(6)=0$'
          - '$K(6)=0$'
        korrekt: 1
        hinweis: 'An einer Minimalstelle ist die Ableitung null.'
        danach: '$$\begin{align*}k_v''(6)&=0\\ 2a\cdot 6+b&=0\\ 12a+b&=0\end{align*}$$<p>Das ist der Trick dieser Aufgaben: Eine Stelle wie das Betriebsminimum wird zu „Ableitung $=0$“.</p>'
        zeige: { eintraege: [bm] }

  - phase: vormachen
    titel: 'Gleichungssystem lösen'
    text: '<p>Die vier Gleichungen bilden ein lineares Gleichungssystem mit vier Unbekannten.</p>'
    visual:
      typ: graph
      funktionen:
        - { term: '0.5x^3-6x^2+30x+48', name: 'K(x) = 0,5x³ − 6x² + 30x + 48', xmin: 0, xmax: 9 }
      xMin: -0.5
      xMax: 9.5
      yMin: 0
      yMax: 220
      xAchse: 'x in ME'
      yAchse: 'K in GE'
      punkte:
        - { id: fix, x: 0, y: 48, label: 'K(0) = 48', ax: 50, ay: 20 }
        - { id: k2, x: 2, y: 88, label: 'K(2) = 88', ax: 30, ay: -40 }
    schritte:
      - typ: aufdecken
        knopf: 'Lösen'
        text: '$$\begin{align*}8a+4b+2c+d&=88\\ 12a+b&=0\\ d&=48\\ 3a+2b+c&=19{,}5\end{align*}$$<p>Mit dem Taschenrechner oder dem Gauß-Algorithmus erhältst du $a=0{,}5$, $b=-6$, $c=30$, $d=48$, also</p>$$K(x)=0{,}5x^3-6x^2+30x+48$$'
      - typ: eingabe
        frage: '<strong>Probe</strong> – stimmen die Kosten bei 2 ME? $$K(2)=0{,}5\cdot 8-6\cdot 4+30\cdot 2+48$$'
        felder:
          - { label: '$K(2)=$', loesung: 88, einheit: 'GE', zeige: { punkte: [fix, k2] } }
        hinweis: 'Rechne Summand für Summand: $4-24+60+48$.'
        danach: '<p>Passt – der Graph geht durch die gegebenen Punkte.</p>'

  - phase: vormachen
    titel: 'Stückkosten und Betriebsoptimum'
    text: '<p>Außerdem kommen die Stückkosten $k(x)=\frac{K(x)}{x}$ vor.</p>'
    schritte:
      - typ: aufdecken
        knopf: 'Funktionen zeigen'
        text: '$$\begin{align*}k(x)&=ax^2+bx+c+\frac{d}{x}\\ k''(x)&=2ax+b-\frac{d}{x^2}\end{align*}$$'
      - typ: aufdecken
        frage: '<strong>Die Stückkosten bei 2 ME betragen 30 GE/ME.</strong>'
        knopf: 'Gleichung zeigen'
        text: '$$\begin{align*}k(2)&=30\\ 4a+2b+c+\frac{d}{2}&=30 \quad|\cdot 2\\ 8a+4b+2c+d&=60\end{align*}$$<p>Man kann mit $2$ multiplizieren, damit kein Bruch übrig bleibt. Das ist dasselbe wie $K(2)=2\cdot 30=60$.</p>'
      - typ: auswahl
        frage: '<strong>Das Betriebsoptimum liegt bei 4 ME.</strong> Dort sind die Stückkosten minimal. Welche Gleichung passt?'
        optionen:
          - '$k(4)=0$'
          - '$k''(4)=0\quad$ oder $\quadk(4)=K''(4)$'
          - '$k_v''(4)=0$'
        korrekt: 1
        hinweis: 'Betriebsoptimum gehört zu den Stückkosten $k$, Betriebsminimum zu $k_v$.'
        danach: '$$\begin{align*}k''(4)&=0\\ 8a+b-\frac{d}{16}&=0 \quad|\cdot 16\\ 128a+16b-d&=0\end{align*}$$ oder $$\begin{align*}k(4)&=K''(4)\\ 16a+4b+c+\frac{d}{4}&=48a+8b+c\end{align*}$$ (Man kann zeigen, dass beide Gleichungen äquivalent sind.)'
      - typ: auswahl
        frage: '<strong>Die langfristige Preisuntergrenze beträgt 25 GE/ME.</strong> Das ist der Wert der Stückkosten im Betriebsoptimum. Welche Gleichung passt?'
        optionen:
          - '$k(4)=25$'
          - '$k''(25)=0$'
          - '$k_v(4)=25$'
        korrekt: 0
        hinweis: 'Erst die Stelle (Betriebsoptimum bei 4 ME), dann der Funktionswert dort.'
        danach: '<p>Analog funktioniert es mit dem Betriebsminimum und der kurzfristigen Preisuntergrenze: $k_v(x_{\text{BM}})=KPU$.</p>'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Welche Bedingung gehört wozu?'
    text: '<p>Typische Informationen aus den Trainingsaufgaben – ordne jeder ihre Gleichung zu.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Information'
        titel_rechts: 'Bedingung'
        paare:
          - { links: 'Fixkosten 100 GE', rechts: '$K(0)=100$' }
          - { links: 'Kosten bei 5 ME: 300 GE', rechts: '$K(5)=300$' }
          - { links: 'Stückkosten bei 5 ME: 60 GE/ME', rechts: '$k(5)=60$' }
          - { links: 'variable Stückkosten bei 5 ME: 40 GE/ME', rechts: '$k_v(5)=40$' }
          - { links: 'Betriebsminimum bei 4 ME', rechts: '$k_v''(4)=0$' }
          - { links: 'Betriebsoptimum bei 6 ME', rechts: '$k''(6)=0$' }
        danach: '<p>Faustregel: Kosten → $K$, Stückkosten → $k$, variable Stückkosten → $k_v$. Bei einer Minimalstelle ist die Ableitung null.</p>'

  - phase: mitmachen
    titel: 'Neuer Steckbrief – du übersetzt'
    text: '<p>Gesucht ist wieder $K(x)=ax^3+bx^2+cx+d$, mit $k_v(x)=ax^2+bx+c$ und $k_v''(x)=2ax+b$.</p>'
    visual:
      typ: liste
      titel: 'Steckbrief'
      eintraege:
        - { id: fix, text: 'Die Fixkosten betragen 100 GE.', gleichung: '$d=100$' }
        - { id: kv, text: 'Die variablen Stückkosten bei 4 ME betragen 21 GE/ME.', gleichung: '$16a+4b+c=21$' }
        - { id: bm, text: 'Das Betriebsminimum liegt bei 8 ME.', gleichung: '$16a+b=0$' }
        - { id: kpu, text: 'Die kurzfristige Preisuntergrenze beträgt 13 GE/ME.', gleichung: '$64a+8b+c=13$' }
    schritte:
      - typ: eingabe
        frage: '<strong>Fixkosten</strong> – der Ansatz steht da: $K(0)=100$.'
        felder:
          - { label: '$d=$', loesung: 100, zeige: { eintraege: [fix] } }
        hinweis: 'Bei $x=0$ fallen alle Summanden außer $d$ weg.'
      - typ: auswahl
        frage: '<strong>Variable Stückkosten bei 4 ME: 21 GE/ME</strong> – welche Bedingung?'
        optionen:
          - '$K(4)=21$'
          - '$k_v(4)=21$'
          - '$k(4)=21$'
        korrekt: 1
        hinweis: 'Variable Stückkosten haben eine eigene Funktion.'
      - typ: eingabe
        frage: 'Setze $x=4$ in $k_v(x)=ax^2+bx+c$ ein und trag die Vorfaktoren ein.'
        layout: zeile
        felder:
          - { einheit: '$a\;+$', loesung: 16 }
          - { einheit: '$b\;+$', loesung: 4 }
          - { einheit: '$c\;=\;21$', loesung: 1, zeige: { eintraege: [kv] } }
        hinweis: '$a\cdot 4^2=16a$ und $b\cdot 4=4b$. Vor $c$ steht eine $1$.'

  - phase: mitmachen
    titel: 'Betriebsminimum und Preisuntergrenze'
    text: '<p>Gleicher Steckbrief, jetzt mit weniger Hilfe.</p>'
    visual:
      typ: liste
      titel: 'Steckbrief'
      eintraege:
        - { id: fix, text: 'Die Fixkosten betragen 100 GE.', gleichung: '$d=100$', erledigt: true }
        - { id: kv, text: 'Die variablen Stückkosten bei 4 ME betragen 21 GE/ME.', gleichung: '$16a+4b+c=21$', erledigt: true }
        - { id: bm, text: 'Das Betriebsminimum liegt bei 8 ME.', gleichung: '$16a+b=0$' }
        - { id: kpu, text: 'Die kurzfristige Preisuntergrenze beträgt 13 GE/ME.', gleichung: '$64a+8b+c=13$' }
    schritte:
      - typ: auswahl
        frage: '<strong>Betriebsminimum bei 8 ME</strong> – welche Bedingung?'
        optionen:
          - '$k_v(8)=0$'
          - '$k''(8)=0$'
          - '$k_v''(8)=0$'
        korrekt: 2
        hinweis: 'Minimalstelle der variablen Stückkosten.'
      - typ: eingabe
        layout: zeile
        felder:
          - { einheit: '$a\;+$', loesung: 16 }
          - { einheit: '$b\;=\;0$', loesung: 1, zeige: { eintraege: [bm] } }
        hinweis: '$k_v''(8)=2a\cdot 8+b$.'
      - typ: auswahl
        frage: '<strong>Kurzfristige Preisuntergrenze 13 GE/ME</strong> – welche Bedingung?'
        optionen:
          - '$k_v(8)=13$'
          - '$k_v(13)=8$'
          - '$k_v''(13)=0$'
        korrekt: 0
        hinweis: 'Die KPU ist der Wert von $k_v$ an der Stelle des Betriebsminimums.'
      - typ: eingabe
        layout: zeile
        felder:
          - { einheit: '$a\;+$', loesung: 64 }
          - { einheit: '$b\;+$', loesung: 8 }
          - { einheit: '$c\;=\;13$', loesung: 1, zeige: { eintraege: [kpu] } }
        hinweis: 'Setze $x=8$ in $k_v(x)=ax^2+bx+c$ ein.'

  - phase: mitmachen
    titel: 'Jetzt lösen'
    text: '<p>Löse das Gleichungssystem aus dem Steckbrief, am besten mit dem Taschenrechner.</p>'
    visual:
      typ: liste
      titel: 'Steckbrief'
      eintraege:
        - { id: fix, text: 'Fixkosten 100 GE', gleichung: '$d=100$', erledigt: true }
        - { id: kv, text: 'variable Stückkosten bei 4 ME: 21 GE/ME', gleichung: '$16a+4b+c=21$', erledigt: true }
        - { id: bm, text: 'Betriebsminimum bei 8 ME', gleichung: '$16a+b=0$', erledigt: true }
        - { id: kpu, text: 'kurzfristige Preisuntergrenze 13 GE/ME', gleichung: '$64a+8b+c=13$', erledigt: true }
    schritte:
      - typ: eingabe
        frage: 'Bestimme die Koeffizienten der Kostenfunktion.'
        layout: zeile
        felder:
          - { label: '$K(x)=$', einheit: '$x^3\;+$', loesung: 0.5 }
          - { einheit: '$x^2\;+$', loesung: -8 }
          - { einheit: '$x\;+$', loesung: 45 }
          - { loesung: 100 }
        hinweis: '$d=100$ kennst du schon. Aus $16a+b=0$ folgt $b=-16a$ – oder du gibst die drei übrigen Gleichungen in den Taschenrechner ein.'
        danach: '$$K(x)=0{,}5x^3-8x^2+45x+100$$<p>Probe: $k_v(8)=0{,}5\cdot 64-8\cdot 8+45=13$ ✓</p>'
