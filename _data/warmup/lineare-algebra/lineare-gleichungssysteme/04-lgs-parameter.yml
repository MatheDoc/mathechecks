# Warm-Up zu Check 04 „LGS mit Parameter“ (Lineare Gleichungssysteme)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: lineare-algebra__lineare-gleichungssysteme__04
abschluss: '<p>Im Training bringst du das LGS mit dem Gauß-Algorithmus auf Stufenform, bis eine Nullzeile entsteht. Dann setzt du $x_3=t$, löst rückwärts und schreibst $x_1$ und $x_2$ jeweils als $a+b\cdot t$, auch wenn $a=0$ oder $b$ negativ ist.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Eine Gleichung zu wenig'
    text: '<p>Manchmal liefert der Gauß-Algorithmus in der letzten Zeile nur Nullen:</p>$$\left(\begin{array}{ccc|c}1&1&1&6\\0&1&2&5\\0&0&0&0\end{array}\right)$$'
    schritte:
      - typ: aufdecken
        frage: 'Was bedeutet die letzte Zeile?'
        knopf: 'Übersetzen'
        text: '<p>$0\cdot x_3=0$ ist für <strong>jedes</strong> $x_3$ wahr. Die Zeile sagt nichts aus. Übrig bleiben zwei Gleichungen für drei Unbekannte:</p>$$\begin{align*}I:\quad x_1+x_2+x_3&=6\\ II:\quad x_2+2x_3&=5\end{align*}$$<p>Wähle $x_3$ einfach selbst:</p><ul><li>$x_3=0$: $x_2=5$, $x_1=1$</li><li>$x_3=1$: $x_2=3$, $x_1=2$</li></ul>'
      - typ: auswahl
        frage: 'Wie viele Lösungen hat das LGS also?'
        optionen:
          - 'genau eine'
          - 'keine'
          - 'unendlich viele'
        korrekt: 2
        mischen: false
        hinweis: 'Zu jedem Wert von $x_3$ findest du passende $x_1$ und $x_2$.'
        danach: '<p>$x_3$ ist <strong>frei wählbar</strong>. Dafür schreiben wir $x_3=t$ mit $t\in\mathbb{R}$. Dann lassen sich $x_2$ und $x_1$ in Abhängigkeit von $t$ angeben, hier $x_2=5-2t$ und $x_1=1+t$.</p><p><strong>Merke:</strong> Nullzeile → $x_3=t$ setzen → rückwärts einsetzen, wobei $t$ wie eine Zahl mitgeführt wird.</p>'

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Mit $t$ rückwärts einsetzen'
    text: '$$\begin{align*}x_1+x_2+2x_3&=5\\ 2x_1+x_2+3x_3&=8\\ 3x_1+2x_2+5x_3&=13\end{align*}$$<p>Das LGS hat unendlich viele Lösungen. Im Bild steht seine Matrixform.</p>'
    visual:
      typ: matrix
      trenn: 3
      zeilen:
        - [1, 1, 2, 5]
        - [2, 1, 3, 8]
        - [3, 2, 5, 13]
    schritte:
      - typ: aufdecken
        frage: '<strong>Gauß-Algorithmus</strong> wie gewohnt'
        knopf: 'Umformen'
        text: '<p>Mit $II-2\cdot I$ und $III-3\cdot I$:</p>$$\left(\begin{array}{ccc|c}1&1&2&5\\0&-1&-1&-2\\0&-1&-1&-2\end{array}\right)$$<p>Mit $III-II$:</p>$$\left(\begin{array}{ccc|c}1&1&2&5\\0&-1&-1&-2\\0&0&0&0\end{array}\right)$$<p>Nullzeile, also setzen wir $x_3=t$.</p>'
      - typ: auswahl
        frage: 'Zeile $II$ lautet nun $-x_2-t=-2$. Was folgt für $x_2$?'
        optionen:
          - '$x_2=2-t$'
          - '$x_2=2+t$'
          - '$x_2=-2-t$'
        korrekt: 0
        hinweis: 'Erst $+t$ auf beiden Seiten, dann mit $-1$ multiplizieren. Dabei ändern sich alle Vorzeichen.'
        danach: '$$\begin{align*}-x_2-t&=-2\quad|+t\\ -x_2&=-2+t\quad|\cdot(-1)\\ x_2&=2-t\end{align*}$$'
      - typ: aufdecken
        frage: 'Jetzt $x_2=2-t$ und $x_3=t$ in Zeile $I$ einsetzen.'
        knopf: 'Rechnung zeigen'
        text: '$$\begin{align*}x_1+(2-t)+2t&=5\\ x_1+2+t&=5\quad|-2-t\\ x_1&=3-t\end{align*}$$<p>Im Training trägst du die Lösung in der Form $a+b\cdot t$ ein:</p>$$\begin{align*}x_1&=3+(-1)\cdot t\\ x_2&=2+(-1)\cdot t\\ x_3&=t\end{align*}$$'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Auflösen in Abhängigkeit von $t$'
    text: '<p>Ordne zu: Jede Gleichung wurde nach $x_2$ aufgelöst.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Gleichung'
        titel_rechts: 'Lösung'
        paare:
          - { links: '$x_2-t=4$', rechts: '$x_2=4+1\cdot t$' }
          - { links: '$-x_2+2t=1$', rechts: '$x_2=-1+2\cdot t$' }
          - { links: '$x_2+3t=0$', rechts: '$x_2=0+(-3)\cdot t$' }
          - { links: '$2x_2-4t=6$', rechts: '$x_2=3+2\cdot t$' }
        hilfe: 'Bringe den $t$-Term auf die rechte Seite und teile durch den Vorfaktor von $x_2$.'
        danach: '<p>Fehlt die Zahl, ist $a=0$. Steht nur $t$, ist $b=1$.</p>'

  - phase: mitmachen
    titel: 'Jetzt du'
    text: '$$\begin{align*}x_1+2x_2-x_3&=4\\ 2x_1+5x_2-4x_3&=9\\ -x_1-4x_2+5x_3&=-6\end{align*}$$<p>Das Bild zeigt die Matrix nach $II-2\cdot I$ und $III+I$.</p>'
    visual:
      typ: matrix
      trenn: 3
      zeilen:
        - [1, 2, -1, 4]
        - [0, 1, -2, 1]
        - [0, -2, 4, -2]
    schritte:
      - typ: auswahl
        frage: '<strong>Spalte 2:</strong> Welche Umformung erzeugt unter der $1$ eine $0$?'
        optionen:
          - '$III+2\cdot II$'
          - '$III-2\cdot II$'
          - '$2\cdot III+II$'
        korrekt: 0
        hinweis: 'Es soll $-2+2\cdot 1=0$ herauskommen.'
        zeige: { spalten: [1] }
        danach: '<p>Zeile $III$ wird zur Nullzeile $(0\;\;0\;\;0\,|\,0)$. Also setzen wir $x_3=t$.</p>'
      - typ: eingabe
        frage: 'Löse Zeile $II$, also $x_2-2t=1$, nach $x_2$ auf.'
        layout: zeile
        felder:
          - { label: '$x_2=$', loesung: 1, einheit: '$+$', aria: 'a_2' }
          - { loesung: 2, einheit: '$\cdot t$', aria: 'b_2' }
        hinweis: 'Addiere $2t$ auf beiden Seiten.'
        zeige: { zeilen: [1] }
      - typ: eingabe
        frage: 'Setze $x_2=1+2t$ und $x_3=t$ in Zeile $I$ ein: $x_1+2x_2-x_3=4$.'
        layout: zeile
        felder:
          - { label: '$x_1=$', loesung: 2, einheit: '$+$', aria: 'a_1' }
          - { loesung: -3, einheit: '$\cdot t$', aria: 'b_1' }
        hinweis: 'Klammer setzen: $x_1+2(1+2t)-t=4$, also $x_1+2+3t=4$.'
        zeige: { zeilen: [0] }
        danach: '<p>Die Lösung ist $x_1=2-3t$, $x_2=1+2t$, $x_3=t$. Probe mit $t=1$, also $(-1\,|\,3\,|\,1)$, in Gleichung 2: $-2+15-4=9$. Stimmt.</p>'
