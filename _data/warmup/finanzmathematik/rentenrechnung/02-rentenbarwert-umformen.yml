# Warm-Up zu Check 02 „Rentenbarwertformel umformen“ (Rentenrechnung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: finanzmathematik__rentenrechnung__02
abschluss: '<p>Im Training bestimmst du pro Aufgabe einmal den Rentenbarwert ($R_0$ oder $\overline{R}_0$), einmal die Rate $r$ und einmal die Laufzeit $n$. Bei $n$ steht $q^n$ im Zähler und im Nenner: Multipliziere zuerst mit dem Nenner $q^n\cdot(q-1)$, löse rechts die Klammer auf und fasse die beiden $q^n$-Terme zusammen.</p><p>Runde erst am Ende auf 2 Nachkommastellen. Beträge trägst du ohne Tausenderpunkt ein.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Vom Endwert zum Barwert'
    text: '<p>Der <strong>Rentenbarwert</strong> ist der Wert aller Raten <strong>heute</strong>, zu Beginn der Laufzeit: der Betrag, den man heute einmal anlegen müsste, um am Ende dasselbe Guthaben zu haben.</p><p>Jonas zahlt $3$ Jahre lang jeweils am Jahresende $1\,200$ € zu $2{,}5\,\%$ ein. Sein Rentenendwert ist $R_3=3\,690{,}75$ €.</p>'
    visual:
      typ: liste
      titel: 'Vom Endwert zum Barwert'
      eintraege:
        - { id: ab, text: 'Endwert abzinsen', gleichung: '$R_0=\dfrac{R_n}{q^n}$' }
        - { id: bsp, text: 'Jonas', gleichung: '$R_0=\dfrac{3\,690{,}75}{1{,}025^3}\approx 3\,427{,}23$ €' }
        - { id: fn, text: 'nachschüssig', gleichung: '$R_0=\dfrac{r\cdot(q^n-1)}{q^n\cdot(q-1)}$' }
        - { id: fv, text: 'vorschüssig', gleichung: '$\overline{R}_0=\dfrac{r\cdot q\cdot(q^n-1)}{q^n\cdot(q-1)}$' }
    schritte:
      - typ: aufdecken
        frage: 'Wie kommt man vom Endwert zum Barwert?'
        knopf: 'Abzinsen'
        text: '<p>Wie bei einer Einmalzahlung in der Zinseszinsrechnung: Der Endwert wird durch $q^n$ geteilt, also $n$ Jahre <strong>abgezinst</strong>. Legt Jonas heute rund $3\,427{,}23$ € an, hat er nach $3$ Jahren ebenfalls $3\,690{,}75$ €.</p>'
        zeige: { eintraege: [ab, bsp] }
      - typ: aufdecken
        frage: 'Jetzt die Endwertformel für $R_n$ einsetzen.'
        knopf: 'Barwertformeln zeigen'
        text: '<p>Dadurch kommt im Nenner der Faktor $q^n$ dazu. Das sind die beiden <strong>Rentenbarwertformeln</strong> (rechts). Vorschüssig steht wie beim Endwert zusätzlich $q$ im Zähler.</p>'
        zeige: { eintraege: [fn, fv] }
      - typ: auswahl
        frage: 'Schau dir die Barwertformel an. Wo steckt die Laufzeit $n$?'
        optionen:
          - 'Zweimal: in $q^n$ im Zähler und in $q^n$ im Nenner'
          - 'Nur einmal, im Exponenten im Zähler'
          - 'Nur einmal, im Nenner'
        korrekt: 0
        hinweis: 'Such im Zähler und im Nenner nach $q^n$.'
        danach: '<p><strong>Merke:</strong></p><ul><li>Barwert = Endwert abgezinst: Im Nenner steht zusätzlich $q^n$.</li><li>Für $R_0$ und $r$ rechnest du wie beim Endwert.</li><li>Ist $n$ gesucht, steht $q^n$ zweimal da. Dann erst die beiden $q^n$-Terme auf eine Seite bringen und zusammenfassen, danach Logarithmus.</li></ul>'

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Barwert und Rate bestimmen'
    text: '<p>Für den Barwert selbst und für die Rate $r$ bleibt das Vorgehen aus Check 1 erhalten.</p>'
    visual:
      typ: liste
      titel: 'Gesucht – so geht es'
      eintraege:
        - { id: r0, text: '$R_0$ oder $\overline{R}_0$ gesucht', gleichung: 'einsetzen und Bruch ausrechnen' }
        - { id: r, text: '$r$ gesucht', gleichung: 'Bruch ohne $r$ ausrechnen, durch diesen Faktor teilen' }
        - { id: n, text: '$n$ gesucht', gleichung: 'mit Nenner malnehmen, Klammer auflösen, $q^n$ zusammenfassen, Logarithmus' }
    schritte:
      - typ: auswahl
        frage: '<strong>a) Barwert gesucht:</strong> nachschüssige Rente mit $r=6\,000$ €, $p=4\,\%$, $n=12$. Eingesetzt: $$R_0=\frac{6\,000\cdot(1{,}04^{12}-1)}{1{,}04^{12}\cdot 0{,}04}$$ Nach $6000\cdot$ folgt der Rest. Wie tippst du ihn in den Taschenrechner?'
        optionen:
          - '$(1{,}04^{12}-1):(1{,}04^{12}\cdot 0{,}04)$'
          - '$(1{,}04^{12}-1):1{,}04^{12}\cdot 0{,}04$'
          - '$1{,}04^{12}-1:(1{,}04^{12}\cdot 0{,}04)$'
        korrekt: 0
        hinweis: 'Zähler und Nenner brauchen beide Klammern. Ohne Klammer um den Nenner wird mit $0{,}04$ <em>multipliziert</em> statt geteilt, das ergäbe nur etwa $90$ €.'
        danach: '$$R_0\approx 56\,310{,}44\,\text{€}$$<p>Alternativ nutzt du die Bruchtaste und gibst Zähler und Nenner getrennt ein.</p>'
        zeige: { eintraege: [r0] }
      - typ: aufdecken
        frage: '<strong>b) Rate $r$ gesucht:</strong> vorschüssige Rente mit $\overline{R}_0=50\,000$ €, $p=3\,\%$, $n=10$.'
        knopf: 'Bruch ausrechnen und teilen'
        text: '<p>Den Bruch ohne $r$ als Faktor berechnen und dann durch diesen Faktor teilen:</p>$$\begin{align*}50\,000&=r\cdot\frac{1{,}03\cdot(1{,}03^{10}-1)}{1{,}03^{10}\cdot 0{,}03}\\ 50\,000&\approx r\cdot 8{,}7861\quad|:8{,}7861\\ r&\approx 5\,690{,}80\,\text{€}\end{align*}$$'
        zeige: { eintraege: [r] }

  - phase: vormachen
    titel: 'Nach n auflösen: beide Potenzen zusammenführen'
    text: '<p><strong>c) Laufzeit $n$ gesucht:</strong> nachschüssige Rente mit $r=5\,000$ €, $R_0=40\,000$ €, $p=2{,}5\,\%$.</p><p>Mit $q=1{,}025$ und $q-1=0{,}025$ lautet die Gleichung:</p>$$40\,000=\frac{5\,000\cdot(1{,}025^n-1)}{1{,}025^n\cdot 0{,}025}$$'
    visual:
      typ: liste
      titel: 'Gesucht – so geht es'
      eintraege:
        - { id: r0, text: '$R_0$ oder $\overline{R}_0$ gesucht', gleichung: 'einsetzen und Bruch ausrechnen', erledigt: true }
        - { id: r, text: '$r$ gesucht', gleichung: 'Bruch ohne $r$ ausrechnen, durch diesen Faktor teilen', erledigt: true }
        - { id: n, text: '$n$ gesucht', gleichung: 'mit Nenner malnehmen, Klammer auflösen, $q^n$ zusammenfassen, Logarithmus' }
    schritte:
      - typ: aufdecken
        frage: '<strong>Schritt 1:</strong> Mit dem gesamten Nenner $1{,}025^n\cdot 0{,}025$ multiplizieren und rechts die Klammer ausmultiplizieren.'
        knopf: 'Umformung zeigen'
        text: '<p>Links gibt $40\,000\cdot 0{,}025=1\,000$, rechts wird $5\,000$ mit beiden Gliedern in der Klammer multipliziert:</p>$$\begin{align*}40\,000\cdot 0{,}025\cdot 1{,}025^n&=5\,000\cdot(1{,}025^n-1)\\ 1\,000\cdot 1{,}025^n&=5\,000\cdot 1{,}025^n-5\,000\end{align*}$$'
      - typ: auswahl
        frage: '<strong>Schritt 2:</strong> Jetzt steht $1{,}025^n$ links und rechts. Wie fasst du beide Terme zusammen?'
        optionen:
          - 'Auf beiden Seiten $-5\,000\cdot 1{,}025^n$ rechnen: links entsteht $-4\,000\cdot 1{,}025^n$'
          - 'Durch $1{,}025^n$ teilen, damit es links wegfällt'
          - 'Auf beiden Seiten $+5\,000$ rechnen und durch $5\,000$ teilen'
        korrekt: 0
        hinweis: 'Denk dir $1{,}025^n$ wie ein $x$: Die Gleichung $1\,000x=5\,000x-5\,000$ löst du mit $-5\,000x$.'
        danach: '$$\begin{align*}-4\,000\cdot 1{,}025^n&=-5\,000\quad|:(-4\,000)\\ 1{,}025^n&=1{,}25\\ n&=\frac{\ln 1{,}25}{\ln 1{,}025}\approx 9{,}04\end{align*}$$<p>Sobald $1{,}025^n$ nur noch an einer Stelle steht, geht es wie beim Endwert mit dem Logarithmus weiter.</p><p>Bei einer <strong>vorschüssigen</strong> Rente rechnest du im Zähler vor der Klammer zuerst $r\cdot q$ zu einer Zahl zusammen, danach läuft alles genauso.</p>'
        zeige: { eintraege: [n] }

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Umformung nach n Schritt für Schritt'
    text: '<p>Gegeben ist die eingesetzte Barwertgleichung:</p>$$25\,000=\frac{3\,000\cdot(1{,}04^n-1)}{1{,}04^n\cdot 0{,}04}$$<p>Ordne jedem Schritt das passende Zwischenergebnis zu.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Umformungsschritt'
        titel_rechts: 'Ergebnis'
        paare:
          - { links: '1. Mit $0{,}04\cdot 1{,}04^n$ malnehmen &amp; Klammer auflösen', rechts: '$1\,000\cdot 1{,}04^n=$<br>$3\,000\cdot 1{,}04^n-3\,000$' }
          - { links: '2. Minus $3\,000\cdot 1{,}04^n$ rechnen', rechts: '$-2\,000\cdot 1{,}04^n=-3\,000$' }
          - { links: '3. Durch $-2\,000$ teilen', rechts: '$1{,}04^n=1{,}5$' }
          - { links: '4. Logarithmus anwenden', rechts: '$n=\dfrac{\ln 1{,}5}{\ln 1{,}04}\approx 10{,}34$' }
        danach: '<p>Immer derselbe Dreischritt vor dem Logarithmus: <strong>Nenner hochholen &amp; Klammer ausmultiplizieren → $q^n$-Terme zusammenfassen → durch den Vorfaktor teilen</strong>.</p>'

  - phase: mitmachen
    titel: 'Neue Zahlen: Barwert und Rate'
    text: '<p>Jetzt rechnest du selbst. Rechts steht noch dein Spickzettel.</p>'
    visual:
      typ: liste
      titel: 'Gesucht – so geht es'
      eintraege:
        - { id: r0, text: '$R_0$ oder $\overline{R}_0$ gesucht', gleichung: 'einsetzen und Bruch ausrechnen', erledigt: true }
        - { id: r, text: '$r$ gesucht', gleichung: 'Bruch ohne $r$ ausrechnen, durch diesen Faktor teilen', erledigt: true }
        - { id: n, text: '$n$ gesucht', gleichung: 'mit Nenner malnehmen, Klammer auflösen, $q^n$ zusammenfassen, Logarithmus', erledigt: true }
    schritte:
      - typ: eingabe
        frage: '<strong>1.</strong> Vorschüssige Rente mit $r=2\,000$ €, $p=5\,\%$, $n=8$. Gesucht: $\overline{R}_0$. Der Ansatz steht da: $$\overline{R}_0=\frac{2\,000\cdot 1{,}05\cdot(1{,}05^8-1)}{1{,}05^8\cdot 0{,}05}$$ (Betrag ohne Tausenderpunkt eintragen)'
        felder:
          - { label: '$\overline{R}_0=$', loesung: 13572.75, toleranz: 1, einheit: '€' }
        hinweis: 'Achte auf die Klammer um das Produkt $1{,}05^8\cdot 0{,}05$ im Nenner.'
      - typ: eingabe
        frage: '<strong>2.</strong> Nachschüssige Rente mit $R_0=20\,000$ €, $p=3\,\%$, $n=10$. Gesucht: $r$. Eingesetzt: $$20\,000=r\cdot\frac{1{,}03^{10}-1}{1{,}03^{10}\cdot 0{,}03}$$ Rechne den Bruch ohne $r$ aus und teile $20\,000$ durch diesen Faktor.'
        felder:
          - { label: '$r=$', loesung: 2344.61, toleranz: 1, einheit: '€' }
        hinweis: 'Der Bruch ergibt $\frac{1{,}03^{10}-1}{1{,}03^{10}\cdot 0{,}03}\approx 8{,}5302$ (Klammer um den Nenner!). Rechne $20\,000:8{,}5302$.'

  - phase: mitmachen
    titel: 'Neue Zahlen: nach n umformen (mit Hilfe)'
    text: '<p>Nachschüssige Rente mit $r=3\,000$ €, $R_0=20\,000$ €, $p=5\,\%$. Gesucht: $n$.</p><p>Eingesetzt mit $q=1{,}05$ und $q-1=0{,}05$:</p>$$20\,000=\frac{3\,000\cdot(1{,}05^n-1)}{1{,}05^n\cdot 0{,}05}$$'
    visual:
      typ: liste
      titel: 'Gesucht – so geht es'
      eintraege:
        - { id: r0, text: '$R_0$ oder $\overline{R}_0$ gesucht', gleichung: 'einsetzen und Bruch ausrechnen', erledigt: true }
        - { id: r, text: '$r$ gesucht', gleichung: 'Bruch ohne $r$ ausrechnen, durch diesen Faktor teilen', erledigt: true }
        - { id: n, text: '$n$ gesucht', gleichung: 'mit Nenner malnehmen, Klammer auflösen, $q^n$ zusammenfassen, Logarithmus', erledigt: true }
    schritte:
      - typ: eingabe
        frage: '<strong>Schritt 1:</strong> Multipliziere mit $0{,}05\cdot 1{,}05^n$ und löse rechts die Klammer auf. Welcher Term steht dann auf der linken Seite?'
        felder:
          - { label: 'Linke Seite:', einheit: '$\cdot\,1{,}05^n$', loesung: 1000, aria: 'Vorfaktor links' }
        hinweis: 'Rechne $20\,000\cdot 0{,}05$.'
        danach: '$$1\,000\cdot 1{,}05^n=3\,000\cdot 1{,}05^n-3\,000$$'
      - typ: eingabe
        frage: '<strong>Schritt 2:</strong> Zieh $3\,000\cdot 1{,}05^n$ ab, teile durch den Vorfaktor und wende den Logarithmus an ($n$ auf 2 Nachkommastellen).'
        felder:
          - { label: '$1{,}05^n=$', loesung: 1.5 }
          - { label: '$n\approx$', loesung: 8.31, toleranz: 0.05, einheit: 'Jahre' }
        hinweis: '$-2\,000\cdot 1{,}05^n=-3\,000$, also $1{,}05^n=(-3\,000):(-2\,000)=1{,}5$ und $n=\frac{\ln 1{,}5}{\ln 1{,}05}$.'
        danach: '$$\begin{align*}-2\,000\cdot 1{,}05^n&=-3\,000\\ 1{,}05^n&=1{,}5\\ n&=\frac{\ln 1{,}5}{\ln 1{,}05}\approx 8{,}31\end{align*}$$'

  - phase: mitmachen
    titel: 'Noch einmal n – vorschüssig und mit weniger Hilfe'
    text: '<p>Vorschüssige Rente mit $r=2\,500$ €, $\overline{R}_0=15\,000$ €, $p=4\,\%$. Gesucht: $n$. Diesmal ohne Spickzettel.</p><p>Im Zähler gibt $r\cdot q=2\,500\cdot 1{,}04=2\,600$:</p>$$15\,000=\frac{2\,600\cdot(1{,}04^n-1)}{1{,}04^n\cdot 0{,}04}$$'
    schritte:
      - typ: auswahl
        frage: 'Welche Gleichung entsteht, wenn du mit $0{,}04\cdot 1{,}04^n$ multiplizierst und rechts die Klammer auflöst?'
        optionen:
          - '$600=$<br>$2\,600\cdot 1{,}04^n-2\,600$'
          - '$600\cdot 1{,}04^n=$<br>$2\,600\cdot 1{,}04^n-1$'
          - '$600\cdot 1{,}04^n=$<br>$2\,600\cdot 1{,}04^n-2\,600$'
        korrekt: 2
        hinweis: 'Links gibt $15\,000\cdot 0{,}04=600$ mal $1{,}04^n$. Rechts wird auch die $-1$ mit $2\,600$ multipliziert.'
      - typ: eingabe
        frage: 'Fasse die $1{,}04^n$-Terme zusammen, stelle $1{,}04^n$ frei und berechne $n$ (auf 2 Nachkommastellen).'
        felder:
          - { label: '$1{,}04^n=$', loesung: 1.3 }
          - { label: '$n\approx$', loesung: 6.69, toleranz: 0.05, einheit: 'Jahre' }
        hinweis: '$600-2\,600=-2\,000$, also $-2\,000\cdot 1{,}04^n=-2\,600$, somit $1{,}04^n=1{,}3$ und $n=\frac{\ln 1{,}3}{\ln 1{,}04}$.'
        danach: '$$\begin{align*}600\cdot 1{,}04^n&=2\,600\cdot 1{,}04^n-2\,600\\ -2\,000\cdot 1{,}04^n&=-2\,600\quad|:(-2\,000)\\ 1{,}04^n&=1{,}3\\ n&=\frac{\ln 1{,}3}{\ln 1{,}04}\approx 6{,}69\end{align*}$$'
