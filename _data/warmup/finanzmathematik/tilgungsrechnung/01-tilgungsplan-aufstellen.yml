# Warm-Up zu Check 01 „Tilgungsplan aufstellen“ (Tilgungsrechnung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: finanzmathematik__tilgungsrechnung__01
abschluss: '<p>Jede Zeile gleich: Zinsen aus der Restschuld am Jahresanfang, Tilgung $=$ Annuität $-$ Zinsen, neue Restschuld $=$ alte Restschuld $-$ Tilgung. In der <strong>letzten Zeile</strong> wird genau die Restschuld getilgt; die Abweichung der letzten Annuität von $A$ ist die <strong>Rundungsdifferenz</strong>.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Zinsen zuerst, der Rest tilgt'
    text: '<p>Ben leiht sich $10\,000$ € zu $5\,\%$ Zinsen. Er zahlt jedes Jahr am Jahresende denselben Betrag zurück, die <strong>Annuität</strong>, hier $A=3\,000$ €.</p>'
    schritte:
      - typ: aufdecken
        frage: 'Was steckt im 1. Jahr in den $3\,000$ €?'
        knopf: 'Aufteilen'
        text: '<p>Zuerst werden die <strong>Zinsen</strong> bezahlt. Der Rest ist die <strong>Tilgung</strong>, um sie sinkt die Schuld:</p>$$\begin{align*}Z_1&=10\,000\cdot 0{,}05=500\\ T_1&=3\,000-500=2\,500\\ RK_1&=10\,000-2\,500=7\,500\end{align*}$$'
      - typ: auswahl
        frage: 'Im 2. Jahr zahlt Ben wieder $3\,000$ €. Er schuldet aber nur noch $7\,500$ €. Was ändert sich?'
        optionen:
          - 'weniger Zinsen, mehr Tilgung'
          - 'gleiche Zinsen, gleiche Tilgung'
          - 'mehr Zinsen, weniger Tilgung'
        korrekt: 0
        hinweis: 'Die Zinsen werden von der aktuellen Schuld berechnet, und $7\,500$ € sind weniger als $10\,000$ €.'
        danach: '$$\begin{align*}Z_2&=7\,500\cdot 0{,}05=375\\ T_2&=3\,000-375=2\,625\\ RK_2&=7\,500-2\,625=4\,875\end{align*}$$<p><strong>Merke:</strong> Ein <strong>Tilgungsplan</strong> rechnet Jahr für Jahr nach demselben Schema: Zinsen aus der Restschuld am Jahresanfang, Tilgung $=$ Annuität $-$ Zinsen, Restschuld minus Tilgung.</p>'

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Zeile für Zeile'
    text: '<p>Ein Fotostudio nimmt ein Darlehen über $18\,000$ € zu $3{,}5\,\%$ auf. Es wird in $3$ Jahren mit der Annuität $A=6\,424{,}82$ € getilgt. Jede Zelle wird auf Cent gerundet, mit den gerundeten Werten wird weitergerechnet.</p>'
    visual:
      typ: liste
      titel: 'Pro Zeile'
      eintraege:
        - { id: z, text: 'Zinsen', gleichung: '$Z_k=RK_{k-1}\cdot\frac{p}{100}$' }
        - { id: t, text: 'Tilgung', gleichung: '$T_k=A-Z_k$' }
        - { id: rk, text: 'Restschuld (Ende)', gleichung: '$RK_k=RK_{k-1}-T_k$' }
        - { id: last, text: 'letzte Zeile', gleichung: '$T_n=RK_{n-1}$, Annuität $=Z_n+T_n$' }
    schritte:
      - typ: aufdecken
        frage: '<strong>Zeile 1, Zinsen:</strong> Zu Beginn ist die Restschuld die Darlehenssumme.'
        knopf: 'Zinsen rechnen'
        text: '$$Z_1=18\,000\cdot 0{,}035=630{,}00$$'
        zeige: { eintraege: [z] }
      - typ: aufdecken
        frage: '<strong>Zeile 1, Tilgung:</strong> Was von der Annuität nach den Zinsen übrig bleibt.'
        knopf: 'Tilgung rechnen'
        text: '$$\begin{align*}T_1&=6\,424{,}82-630{,}00\\ &=5\,794{,}82\end{align*}$$'
        zeige: { eintraege: [t] }
      - typ: aufdecken
        frage: '<strong>Zeile 1, Restschuld am Jahresende:</strong> Die Schuld sinkt um die Tilgung.'
        knopf: 'Restschuld rechnen'
        text: '$$\begin{align*}RK_1&=18\,000-5\,794{,}82\\ &=12\,205{,}18\end{align*}$$<p>Diese Restschuld ist zugleich die Restschuld am Anfang von Jahr 2.</p>'
        zeige: { eintraege: [rk] }
      - typ: auswahl
        frage: '<strong>Zeile 2:</strong> Wie berechnest du die Zinsen $Z_2$?'
        optionen:
          - '$12\,205{,}18\cdot 0{,}035$'
          - '$18\,000\cdot 0{,}035$'
          - '$6\,424{,}82\cdot 0{,}035$'
        korrekt: 0
        hinweis: 'Zinsen gibt es nur auf die Schuld, die zu Beginn des 2. Jahres noch offen ist: $RK_1$.'
        danach: '<p>Der Rest der Zeile geht wie in Zeile 1:</p>$$\begin{align*}Z_2&=12\,205{,}18\cdot 0{,}035\\ &\approx 427{,}18\\ T_2&=6\,424{,}82-427{,}18\\ &=5\,997{,}64\\ RK_2&=12\,205{,}18-5\,997{,}64\\ &=6\,207{,}54\end{align*}$$'

  - phase: vormachen
    titel: 'Die letzte Zeile'
    text: '<p>Zu Beginn von Jahr 3 schuldet das Fotostudio noch $RK_2=6\,207{,}54$ €. Die Zinsen gehen wie immer: $Z_3=6\,207{,}54\cdot 0{,}035\approx 217{,}26$. Nach diesem Jahr muss die Schuld genau $0$ sein.</p>'
    visual:
      typ: liste
      titel: 'Pro Zeile'
      eintraege:
        - { id: z, text: 'Zinsen', gleichung: '$Z_k=RK_{k-1}\cdot\frac{p}{100}$', erledigt: true }
        - { id: t, text: 'Tilgung', gleichung: '$T_k=A-Z_k$', erledigt: true }
        - { id: rk, text: 'Restschuld (Ende)', gleichung: '$RK_k=RK_{k-1}-T_k$', erledigt: true }
        - { id: last, text: 'letzte Zeile', gleichung: '$T_n=RK_{n-1}$, Annuität $=Z_n+T_n$' }
    schritte:
      - typ: auswahl
        frage: 'Wie groß ist die Tilgung $T_3$?'
        optionen:
          - '$T_3=RK_2=6\,207{,}54$'
          - '$T_3=A-Z_3=6\,207{,}56$'
        korrekt: 0
        hinweis: 'Mit $6\,207{,}56$ € würde das Studio $2$ Cent mehr tilgen, als es noch schuldet.'
        danach: '<p>Im letzten Jahr wird genau die Restschuld getilgt.</p>'
      - typ: aufdecken
        frage: 'Dann passt die Annuität nicht mehr ganz.'
        knopf: 'Letzte Annuität rechnen'
        text: '$$\begin{align*}A_3&=Z_3+T_3\\ &=217{,}26+6\,207{,}54\\ &=6\,424{,}80\end{align*}$$<p>Das sind $0{,}02$ € weniger als $A=6\,424{,}82$ €. Diese <strong>Rundungsdifferenz</strong> entsteht durch das Runden auf Cent.</p>'
        zeige: { eintraege: [last] }

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Jetzt du: Zeile 1 und 2'
    text: '<p>Ein Darlehen über $24\,000$ € zu $4\,\%$ wird in $3$ Jahren mit der Annuität $A=8\,648{,}36$ € getilgt. Runde jede Zelle auf Cent und trage Beträge ohne Tausenderpunkt ein.</p>'
    schritte:
      - typ: eingabe
        frage: '<strong>Zeile 1</strong>'
        felder:
          - { label: '$Z_1=$', loesung: 960.00, toleranz: 0.01, einheit: '€' }
          - { label: '$T_1=$', loesung: 7688.36, toleranz: 0.01, einheit: '€' }
          - { label: '$RK_1=$', loesung: 16311.64, toleranz: 0.01, einheit: '€' }
        hinweis: '$Z_1=24\,000\cdot 0{,}04$, dann $T_1=A-Z_1$ und $RK_1=24\,000-T_1$.'
      - typ: eingabe
        frage: '<strong>Zeile 2:</strong> Wie hoch ist die Restschuld am Ende des 2. Jahres?'
        felder:
          - { label: '$RK_2=$', loesung: 8315.75, toleranz: 0.01, einheit: '€' }
        hinweis: 'Zuerst $Z_2=16\,311{,}64\cdot 0{,}04\approx 652{,}47$ €, dann $T_2=A-Z_2$ und $RK_2=RK_1-T_2$.'
        danach: '$$\begin{align*}Z_2&\approx 652{,}47\\ T_2&=7\,995{,}89\\ RK_2&=8\,315{,}75\end{align*}$$'

  - phase: mitmachen
    titel: 'Jetzt du: die letzte Zeile'
    text: '<p>Weiter mit dem Darlehen: $RK_2=8\,315{,}75$ €, $p=4\,\%$, $A=8\,648{,}36$ €.</p>'
    schritte:
      - typ: eingabe
        frage: '<strong>Zeile 3:</strong> Zinsen und Tilgung'
        felder:
          - { label: '$Z_3=$', loesung: 332.63, toleranz: 0.01, einheit: '€' }
          - { label: '$T_3=$', loesung: 8315.75, toleranz: 0.01, einheit: '€' }
        hinweis: 'Zinsen wie immer aus $RK_2$. Im letzten Jahr wird genau die Restschuld $RK_2$ getilgt.'
      - typ: eingabe
        frage: 'Wie hoch ist die letzte Annuität, und um wie viel weicht sie von $A$ ab (positiver Wert)?'
        felder:
          - { label: 'Annuität', loesung: 8648.38, toleranz: 0.01, einheit: '€' }
          - { label: 'Rundungsdifferenz', loesung: 0.02, toleranz: 0.001, einheit: '€' }
        hinweis: 'Letzte Annuität $=Z_3+T_3$. Dann den Abstand zu $8\,648{,}36$ € bilden.'
        danach: '<p>Diesmal liegt die letzte Annuität $0{,}02$ € <em>über</em> $A$. Je nach Rundung kann sie etwas höher oder niedriger ausfallen.</p>'
