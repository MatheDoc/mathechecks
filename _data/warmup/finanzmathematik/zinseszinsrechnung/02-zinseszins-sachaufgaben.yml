# Warm-Up zu Check 02 „Zinseszins im Sachkontext“ (Zinseszinsrechnung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md

check_id: finanzmathematik__zinseszinsrechnung__02
abschluss: '<p>Im Training bekommst du vier Fragen zu einer Situation. In gemischter Reihenfolge ist je einmal $K_n$, $K_0$, $p$ und $n$ gesucht. Geh immer gleich vor: gegebene Werte notieren, im Fragesatz die gesuchte Größe erkennen, dann in $K_n=K_0\cdot q^n$ einsetzen und auflösen.</p><p>Vorsicht bei „heute“, „verfügen“ und „benötigt“: Diese Wörter allein verraten die Größe nicht. Entscheidend ist, welcher Betrag früher ($K_0$) und welcher später ($K_n$) liegt. Eine Zahlung, die in einigen Jahren geleistet werden soll, ist $K_n$.</p><p>Runde erst am Ende auf 2 Nachkommastellen. Den Zinssatz gibst du in Prozent an, Beträge ohne Tausenderpunkt.</p>'
karten:

  # ── Phase A: Orientierung ──────────────────────────────────
  - phase: orientierung
    titel: 'Was war früher, was kommt später?'
    text: '<p>In Sachaufgaben stehen keine Formelzeichen. Bevor du in $K_n=K_0\cdot q^n$ einsetzt, musst du selbst herausfinden, welcher Betrag $K_0$ und welcher $K_n$ ist.</p><p><em>Herr Albers hat vor 9 Jahren $6\,000$ € angelegt. Heute beträgt sein Guthaben $7\,830$ €.</em></p>'
    visual:
      typ: liste
      titel: 'Früher oder später?'
      eintraege:
        - { id: k0, text: 'Albers, vor 9 Jahren: $6\,000$ € angelegt', gleichung: '$K_0=6\,000$ €' }
        - { id: n, text: '9 Jahre Verzinsung', gleichung: '$n=9$' }
        - { id: kn, text: 'Albers, heute: Guthaben $7\,830$ €', gleichung: '$K_n=7\,830$ €' }
        - { id: celik, text: 'Celik, heute: $6\,000$ € angelegt', gleichung: '$K_0=6\,000$ €' }
    schritte:
      - typ: aufdecken
        frage: 'Ordne die Beträge zeitlich.'
        knopf: 'Zeitlich ordnen'
        text: '<p>Angelegt wurde <strong>vor 9 Jahren</strong>. Die $6\,000$ € sind der frühere Betrag, also das Anfangskapital $K_0$.</p><p><strong>Heute</strong> ist hier das Ende der Anlage. Die $7\,830$ € sind der spätere Betrag, also das Endkapital $K_n$. Dazwischen liegen $n=9$ Jahre.</p>'
        zeige: { eintraege: [k0, n, kn] }
      - typ: auswahl
        frage: 'Anders: <em>Frau Celik legt heute $6\,000$ € an.</em> Welche Größe sind diesmal die $6\,000$ €?'
        optionen:
          - '$K_0$'
          - '$K_n$'
        korrekt: 0
        hinweis: 'Bei Frau Celik beginnt die Anlage heute. Die Zinsen kommen erst später dazu.'
        danach: '<p><strong>Merke:</strong></p><ul><li>Nicht das Wort „heute“ entscheidet, sondern die Reihenfolge: Der <strong>frühere</strong> Betrag ist $K_0$, der <strong>spätere</strong> ist $K_n$, und $n$ ist die Zeit dazwischen.</li><li>Welche Größe gesucht ist, verrät der <strong>Fragesatz</strong> am Ende.</li></ul>'
        zeige: { eintraege: [celik] }

  # ── Phase B: Vormachen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Gegeben, gesucht, rechnen'
    text: '<p><em>Ein Schulförderverein legt $12\,000$ € zu $2{,}5\,\%$ an. Über welchen Betrag kann er nach 7 Jahren verfügen?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0=12\,000$ €' }
        - { id: p, text: 'Zinssatz', gleichung: '$p=2{,}5\,\%$, also $q=1{,}025$' }
        - { id: n, text: 'Laufzeit', gleichung: '$n=7$' }
        - { id: kn, text: 'Endkapital', gleichung: '$K_7$ gesucht' }
    schritte:
      - typ: aufdecken
        frage: '<strong>Schritt 1:</strong> gegebene Werte notieren.'
        knopf: 'Werte zuordnen'
        text: '<p>„legt $12\,000$ € an“ → Geld am Anfang: $K_0=12\,000$ €. „zu $2{,}5\,\%$“ → $p=2{,}5$, also $q=1{,}025$. „nach 7 Jahren“ → $n=7$.</p>'
        zeige: { eintraege: [k0, p, n] }
      - typ: auswahl
        frage: '<strong>Schritt 2:</strong> gesuchte Größe erkennen. „Über welchen Betrag kann er nach 7 Jahren verfügen?“'
        optionen:
          - '$K_n$, das Kapital nach 7 Jahren'
          - '$K_0$, der angelegte Betrag'
          - '$p$, der Zinssatz'
        korrekt: 0
        hinweis: 'Gefragt ist ein Betrag nach 7 Jahren, also am Ende der Anlage.'
        danach: '<p><strong>Schritt 3:</strong> einsetzen und ausrechnen.</p>$$\begin{align*}K_7&=12\,000\cdot 1{,}025^7\\ &\approx 14\,264{,}23\,\text{€}\end{align*}$$<p>Nach 7 Jahren kann der Verein über rund $14\,264{,}23$ € verfügen.</p>'
        zeige: { eintraege: [kn] }

  - phase: vormachen
    titel: 'Wie lange dauert es?'
    text: '<p><em>Der Verein legt $3\,000$ € zu $3\,\%$ an. Nach wie vielen Jahren ist das Guthaben auf $4\,000$ € angewachsen?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0=3\,000$ €' }
        - { id: p, text: 'Zinssatz', gleichung: '$p=3\,\%$, also $q=1{,}03$' }
        - { id: kn, text: 'Endkapital', gleichung: '$K_n=4\,000$ €' }
        - { id: n, text: 'Laufzeit', gleichung: '$n$ gesucht' }
    schritte:
      - typ: auswahl
        frage: '<strong>Schritt 1:</strong> „legt $3\,000$ € an“ → $K_0=3\,000$ €, „zu $3\,\%$“ → $q=1{,}03$. Welche Rolle spielen die $4\,000$ €?'
        optionen:
          - '$K_n$'
          - '$K_0$'
          - 'Sie sind gesucht.'
        korrekt: 0
        hinweis: 'Auf $4\,000$ € ist das Guthaben <em>angewachsen</em>, das ist der spätere Betrag.'
        danach: '<p>Richtig: So viel ist am Ende auf dem Konto, also $K_n=4\,000$ €.</p>'
        zeige: { eintraege: [k0, p, kn] }
      - typ: aufdecken
        frage: '<strong>Schritt 2:</strong> „Nach wie vielen Jahren …?“ → $n$ gesucht. <strong>Schritt 3:</strong> einsetzen und nach $n$ auflösen.'
        knopf: 'Rechnung zeigen'
        text: '<p>Durch $3\,000$ teilen, dann den Logarithmus anwenden:</p>$$\begin{align*}4\,000&=3\,000\cdot 1{,}03^n\\ 1{,}03^n&\approx 1{,}3333\\ n&=\frac{\ln 1{,}3333}{\ln 1{,}03}\\ &\approx 9{,}73\end{align*}$$<p>Das Guthaben erreicht nach etwa $9{,}73$ Jahren die Marke von $4\,000$ €.</p>'
        zeige: { eintraege: [n] }

  - phase: vormachen
    titel: 'Gesucht: der Betrag von heute'
    text: '<p><em>Familie Hansen möchte in 6 Jahren über $10\,000$ € verfügen. Welchen Betrag muss sie heute zu $3\,\%$ anlegen?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: kn, text: 'Endkapital', gleichung: '$K_n=10\,000$ €' }
        - { id: p, text: 'Zinssatz', gleichung: '$p=3\,\%$, also $q=1{,}03$' }
        - { id: n, text: 'Laufzeit', gleichung: '$n=6$' }
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0$ gesucht' }
    schritte:
      - typ: auswahl
        frage: 'Hier steht auch „verfügen“. Sind die $10\,000$ € gesucht?'
        optionen:
          - 'Nein, sie stehen im Text: Das ist der Betrag in 6 Jahren, also $K_n$.'
          - 'Ja, bei „verfügen“ ist immer $K_n$ gesucht.'
        korrekt: 0
        hinweis: 'Der Betrag steht schon im Text. Lies die Frage am Ende: „Welchen Betrag muss sie heute anlegen?“'
        danach: '<p>Entscheidend ist der <strong>Fragesatz</strong>. Gesucht ist der Betrag, der heute angelegt wird, also $K_0$. Dazu „zu $3\,\%$“ → $q=1{,}03$ und „in 6 Jahren“ → $n=6$.</p>'
        zeige: { eintraege: [kn, k0, p, n] }
      - typ: aufdecken
        frage: 'Einsetzen und nach $K_0$ auflösen.'
        knopf: 'Rechnung zeigen'
        text: '<p>Durch $1{,}03^6$ teilen:</p>$$\begin{align*}10\,000&=K_0\cdot 1{,}03^6\\ K_0&=\frac{10\,000}{1{,}03^6}\\ &\approx 8\,374{,}84\,\text{€}\end{align*}$$<p>Familie Hansen muss heute rund $8\,374{,}84$ € anlegen.</p>'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Der Fragesatz verrät die Größe'
    text: '<p>Ordne jedem Fragesatz die gesuchte Größe zu.</p>'
    schritte:
      - typ: zuordnen
        titel_links: 'Fragesatz'
        titel_rechts: 'gesucht'
        paare:
          - { links: '„Wie hoch ist das Guthaben nach 15 Jahren?“', rechts: '$K_n$' }
          - { links: '„Welcher Betrag müsste dafür heute zurückgelegt werden?“', rechts: '$K_0$' }
          - { links: '„Mit welchem Zinssatz wurde das Kapital verzinst?“', rechts: '$p$' }
          - { links: '„Wie lange muss das Geld angelegt bleiben?“', rechts: '$n$' }
        danach: '<p>Weitere Formulierungen: „Über welchen Betrag kann er nach … Jahren verfügen?“ → $K_n$. „Welchen Betrag muss sie heute anlegen?“ → $K_0$. „Welcher jährliche Zinssatz liegt zugrunde?“ → $p$. „Nach wie vielen Jahren …?“ → $n$.</p>'

  - phase: mitmachen
    titel: 'Mitmachen: Zinssatz gesucht'
    text: '<p><em>Frau Brandes hat vor 12 Jahren $8\,000$ € angelegt. Heute beträgt ihr Guthaben $11\,600$ €. Mit welchem Zinssatz wurde das Kapital verzinst?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0=8\,000$ €' }
        - { id: kn, text: 'Endkapital', gleichung: '$K_n=11\,600$ €' }
        - { id: n, text: 'Laufzeit', gleichung: '$n=12$' }
        - { id: p, text: 'Zinssatz', gleichung: '$p$ gesucht' }
    schritte:
      - typ: auswahl
        frage: 'Gesucht ist der Zinssatz $p$. Welcher Betrag ist $K_0$?'
        optionen:
          - '$8\,000$ €'
          - '$11\,600$ €'
        korrekt: 0
        hinweis: 'Welcher Betrag liegt früher? „Heute“ ist hier das Ende der Anlage.'
        zeige: { eintraege: [k0, kn, n, p] }
      - typ: eingabe
        frage: 'Der Ansatz steht da: $$11\,600=8\,000\cdot q^{12}$$ Rechne den Zinssatz aus, auf 2 Nachkommastellen.'
        felder:
          - { label: '$p=$', loesung: 3.14, toleranz: 0.01, einheit: '%' }
        hinweis: 'Durch $8\,000$ teilen: $q^{12}=1{,}45$. Dann $q=\sqrt[12]{1{,}45}\approx 1{,}0314$ und $p=(q-1)\cdot 100$.'
        danach: '$$\begin{align*}q^{12}&=1{,}45\\ q&=\sqrt[12]{1{,}45}\approx 1{,}0314\\ p&\approx 3{,}14\end{align*}$$<p>Das Kapital wurde mit etwa $3{,}14\,\%$ verzinst.</p>'

  - phase: mitmachen
    titel: 'Mitmachen: Betrag von heute gesucht'
    text: '<p><em>Herr Klein soll in 5 Jahren eine Zahlung von $9\,000$ € leisten. Welcher Betrag müsste dafür heute bei einem Zinssatz von $2\,\%$ zurückgelegt werden?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0$ gesucht' }
        - { id: kn, text: 'Endkapital', gleichung: '$K_n=9\,000$ €' }
        - { id: p, text: 'Zinssatz', gleichung: '$p=2\,\%$, also $q=1{,}02$' }
        - { id: n, text: 'Laufzeit', gleichung: '$n=5$' }
    schritte:
      - typ: auswahl
        frage: 'Welcher Ansatz führt zum Ziel?'
        optionen:
          - '$K_0=\frac{9\,000}{1{,}02^5}$'
          - '$K_n=9\,000\cdot 1{,}02^5$'
          - '$K_0=\frac{9\,000}{1{,}2^5}$'
        korrekt: 0
        hinweis: 'Die Zahlung in 5 Jahren ist der spätere Betrag, also $K_n$. Gesucht ist der Betrag von heute. Und bei $2\,\%$ ist $q=1{,}02$.'
        danach: '<p>Die Zahlung in 5 Jahren ist $K_n=9\,000$ €, gesucht ist $K_0$:</p>$$9\,000=K_0\cdot 1{,}02^5$$'
        zeige: { eintraege: [k0, kn, p, n] }
      - typ: eingabe
        frage: 'Jetzt ausrechnen (Betrag ohne Tausenderpunkt eintragen).'
        felder:
          - { label: '$K_0=$', loesung: 8151.58, toleranz: 1, einheit: '€' }
        hinweis: 'Rechne $9000:1{,}02^5$. Probe: Das Ergebnis muss kleiner als $9\,000$ € sein.'
        danach: '<p>Herr Klein müsste heute rund $8\,151{,}58$ € zurücklegen.</p>'

  - phase: mitmachen
    titel: 'Mitmachen: Laufzeit gesucht'
    text: '<p><em>Ein Handwerksbetrieb zahlt $20\,000$ € auf ein mit $4\,\%$ verzinstes Konto ein und benötigt $26\,000$ € für eine neue Maschine. Wie lange muss das Geld angelegt bleiben?</em></p>'
    visual:
      typ: liste
      titel: 'Gegeben und gesucht'
      eintraege:
        - { id: k0, text: 'Anfangskapital', gleichung: '$K_0=20\,000$ €' }
        - { id: kn, text: 'Endkapital', gleichung: '$K_n=26\,000$ €' }
        - { id: p, text: 'Zinssatz', gleichung: '$p=4\,\%$, also $q=1{,}04$' }
        - { id: n, text: 'Laufzeit', gleichung: '$n$ gesucht' }
    schritte:
      - typ: auswahl
        frage: 'Was ist gegeben, was ist gesucht?'
        optionen:
          - '$K_0=20\,000$ €, $K_n=26\,000$ €, $p=4\,\%$; gesucht: $n$'
          - '$K_0=26\,000$ €, $K_n=20\,000$ €, $p=4\,\%$; gesucht: $n$'
          - '$K_0=20\,000$ €, $n=4$; gesucht: $K_n$'
        korrekt: 0
        hinweis: 'Eingezahlt wird am Anfang, benötigt wird am Ende. Die $4$ ist der Zinssatz.'
        zeige: { eintraege: [k0, kn, p, n] }
      - typ: eingabe
        frage: 'Stell die Gleichung selbst auf und rechne $n$ aus, auf 2 Nachkommastellen.'
        felder:
          - { label: '$n\approx$', loesung: 6.69, toleranz: 0.05, einheit: 'Jahre' }
        hinweis: '$26\,000=20\,000\cdot 1{,}04^n$. Durch $20\,000$ teilen, dann Logarithmus.'
        danach: '<p>Durch $20\,000$ teilen, dann den Logarithmus anwenden:</p>$$\begin{align*}26\,000&=20\,000\cdot 1{,}04^n\\ 1{,}04^n&=1{,}3\\ n&=\frac{\ln 1{,}3}{\ln 1{,}04}\approx 6{,}69\end{align*}$$<p>Nach etwa $6{,}69$ Jahren ist der benötigte Betrag erreicht.</p>'
