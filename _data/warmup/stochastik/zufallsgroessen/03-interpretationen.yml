# Warm-Up zu Check 3 „E(X) und σ im Sachzusammenhang interpretieren“ (Zufallsgrößen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Kern: E(X) = Durchschnitt auf lange Sicht, σ(X) = Maß für die Streuung. Einordnen eines Werts über den
# Abstand |x − E(X)|: höchstens σ gewöhnlich, zwischen σ und 2σ erhöht, aber noch üblich, mehr als 2σ ungewöhnlich.
# Ob „größer“ oder „kleiner“ besser ist, hängt vom Sachzusammenhang ab.
# Alle Zahlen per Python-Skript nachgerechnet.

check_id: stochastik__zufallsgroessen__03
abschluss: '<p>Im Training vergleichst du zwei Situationen A und B mit gegebenen $E(X)$ und $\sigma(X)$. Es gibt vier Fragen.</p><ul><li><strong>Mittelwert:</strong> Wer hat im Mittel mehr bzw. weniger? Achte auf die Formulierung („schneller“ heißt kleinere Zeit). Sind die Erwartungswerte gleich, wähle „beide gleich“.</li><li><strong>Schwankung:</strong> Die kleinere Standardabweichung bedeutet die geringere Schwankung, also die „stabilere“ oder „gleichmäßigere“ Situation.</li><li><strong>Einordnen:</strong> Bilde den Abstand $|x-E(X)|$ und vergleiche ihn mit $\sigma$ und $2\sigma$. Verwende dazu immer $E(X)$ und $\sigma$ <strong>der genannten</strong> Situation.</li></ul><p>Die drei Stufen sind im Training unterschiedlich formuliert, z. B. „normaler Bereich“ oder „keine deutliche Abweichung“, „leicht erhöhte“ oder „moderate Abweichung“, „ungewöhnlicher Wert“ oder „starke Abweichung“. Entscheidend ist immer, wie viele Standardabweichungen der Wert entfernt liegt.</p>'
karten:

  # ── Phase A: Idee ──────────────────────────────────────────
  - phase: orientierung
    titel: 'Was E(X) und σ im Sachzusammenhang bedeuten'
    text: '<p>Zwei Biathleten schießen je fünfmal. $X$ ist die Anzahl der Fehlschüsse in einem Durchgang.</p><ul><li>Biathlet A: $E(X_A)=1{,}5$ und $\sigma(X_A)=0{,}5$</li><li>Biathlet B: $E(X_B)=2{,}5$ und $\sigma(X_B)=2$</li></ul><p>Beide Kennzahlen lassen sich in Worte fassen.</p>'
    visual:
      typ: liste
      titel: 'Biathlet A und B'
      eintraege:
        - { id: mittel, text: 'Fehlschüsse im Mittel', gleichung: '$E(X_A)=1{,}5\;&lt;\;E(X_B)=2{,}5$' }
        - { id: streu, text: 'Schwankung', gleichung: '$\sigma(X_A)=0{,}5\;&lt;\;\sigma(X_B)=2$' }
    schritte:
      - typ: aufdecken
        frage: 'Der <strong>Erwartungswert</strong> ist der Durchschnitt auf lange Sicht.'
        knopf: 'Deutung zeigen'
        text: '<p>A verfehlt im Mittel $1{,}5$-mal pro Durchgang, B $2{,}5$-mal. A schießt also im Durchschnitt besser. Hier ist der kleinere Wert der bessere, weil Fehlschüsse gezählt werden. Ob „mehr“ oder „weniger“ besser ist, hängt immer vom Sachzusammenhang ab.</p>'
        zeige: { eintraege: [mittel] }
      - typ: aufdecken
        frage: 'Die <strong>Standardabweichung</strong> misst, wie stark die Werte schwanken.'
        knopf: 'Deutung zeigen'
        text: '<p>Bei A ist $\sigma$ kleiner: Seine Fehlschüsse liegen meist nahe bei $1{,}5$, er ist <strong>konstanter</strong>. Bei B schwankt die Anzahl stärker, mal trifft er fast alles, mal verfehlt er oft.</p>'
        zeige: { eintraege: [streu] }

  - phase: orientierung
    titel: 'Abstand zum Erwartungswert in σ messen'
    text: '<p>Ein Pizzadienst liefert im Mittel nach $E(X)=30$ Minuten, die Standardabweichung beträgt $\sigma(X)=5$ Minuten. Ob eine Lieferzeit auffällig ist, entscheidet ihr <strong>Abstand zum Erwartungswert</strong>, gemessen in Standardabweichungen.</p>'
    visual:
      typ: liste
      titel: 'Lieferzeiten einordnen'
      eintraege:
        - { id: g, text: 'höchstens $\sigma$ entfernt: gewöhnlich', gleichung: '$25$ bis $35$ min' }
        - { id: e, text: 'zwischen $\sigma$ und $2\sigma$ entfernt: erhöhte, aber noch übliche Abweichung', gleichung: '$20$ bis $25$ min<br>oder $35$ bis $40$ min' }
        - { id: u, text: 'mehr als $2\sigma$ entfernt: ungewöhnlich', gleichung: 'unter $20$ min<br>oder über $40$ min' }
    schritte:
      - typ: aufdecken
        frage: 'Die Faustregel hat drei Stufen.'
        knopf: 'Bereiche zeigen'
        text: '<p>Mit $\sigma=5$ ist $2\sigma=10$. Vom Erwartungswert $30$ aus geht man also $5$ und $10$ Minuten in beide Richtungen:</p><ul><li>höchstens $\sigma$ entfernt: <strong>gewöhnlich</strong></li><li>zwischen $\sigma$ und $2\sigma$ entfernt: <strong>erhöhte</strong>, aber noch übliche Abweichung</li><li>mehr als $2\sigma$ entfernt: <strong>ungewöhnlich</strong></li></ul>'
        zeige: { eintraege: [g, e, u] }
      - typ: auswahl
        frage: 'Eine Lieferung dauert $38$ Minuten. Wie ist das einzuordnen?'
        optionen:
          - 'Gewöhnlich: Der Abstand beträgt höchstens $\sigma$.'
          - 'Erhöhte, aber noch übliche Abweichung: Der Abstand liegt zwischen $\sigma$ und $2\sigma$.'
          - 'Ungewöhnlich: Der Abstand beträgt mehr als $2\sigma$.'
        korrekt: 1
        mischen: false
        hinweis: 'Suche $38$ Minuten in den Bereichen der Liste.'
        danach: '<p>$|38-30|=8$, und $8$ liegt zwischen $\sigma=5$ und $2\sigma=10$.</p><p><strong>Merke:</strong></p><ul><li>$E(X)$: Durchschnitt auf lange Sicht.</li><li>$\sigma(X)$: Maß für die Schwankung. Kleineres $\sigma$ heißt gleichmäßiger, stabiler.</li><li>Einordnen: Abstand $|x-E(X)|$ mit $\sigma$ und $2\sigma$ vergleichen.</li></ul>'

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Zwei Buslinien vergleichen'
    text: '<p>$X$ ist die Wartezeit an der Haltestelle in Minuten. Für Linie A ist $E(X_A)=12$ und $\sigma(X_A)=2$, für Linie B ist $E(X_B)=10$ und $\sigma(X_B)=5$.</p>'
    visual:
      typ: liste
      titel: 'Linie A und B'
      eintraege:
        - { id: mittel, text: 'Mittlere Wartezeit', gleichung: '$E(X_B)=10\;&lt;\;E(X_A)=12$' }
        - { id: streu, text: 'Schwankung', gleichung: '$\sigma(X_A)=2\;&lt;\;\sigma(X_B)=5$' }
        - { id: wa, text: 'Linie A: 17 Minuten', gleichung: '$|17-12|=5\;&gt;\;2\sigma=4$<br>ungewöhnlich' }
        - { id: wb, text: 'Linie B: 17 Minuten', gleichung: '$\sigma=5\;&lt;\;|17-10|=7\;&lt;\;2\sigma=10$<br>erhöht' }
    schritte:
      - typ: auswahl
        frage: 'Bei welcher Linie wartet man im Mittel <strong>kürzer</strong>?'
        optionen:
          - 'Linie A'
          - 'Linie B'
          - 'Beide gleich lang'
        korrekt: 1
        mischen: false
        hinweis: 'Vergleiche die Erwartungswerte. Kürzer bedeutet kleiner.'
        zeige: { eintraege: [mittel] }
      - typ: auswahl
        frage: 'Bei welcher Linie schwankt die Wartezeit <strong>weniger</strong>?'
        optionen:
          - 'Linie A'
          - 'Linie B'
          - 'Beide gleich stark'
        korrekt: 0
        mischen: false
        hinweis: 'Vergleiche die Standardabweichungen. Weniger Schwankung bedeutet kleineres $\sigma$.'
        zeige: { eintraege: [streu] }
        danach: '<p>Linie B ist im Mittel schneller, Linie A ist dafür verlässlicher.</p>'
      - typ: aufdecken
        frage: 'An einem Tag wartet man bei Linie A $17$ Minuten.'
        knopf: 'Einordnung zeigen'
        text: '<p>Abstand zum Erwartungswert: $|17-12|=5$ Minuten. Für Linie A ist $\sigma=2$, also $2\sigma=4$. Der Abstand $5$ ist größer als $2\sigma$, die Wartezeit ist also <strong>ungewöhnlich</strong> lang.</p>'
        zeige: { eintraege: [wa] }
      - typ: auswahl
        frage: 'Bei Linie B wartet man ebenfalls $17$ Minuten. Wie ist das einzuordnen?'
        optionen:
          - 'Gewöhnlich: Der Abstand beträgt höchstens $\sigma$.'
          - 'Erhöhte, aber noch übliche Abweichung: Der Abstand liegt zwischen $\sigma$ und $2\sigma$.'
          - 'Ungewöhnlich: Der Abstand beträgt mehr als $2\sigma$.'
        korrekt: 1
        mischen: false
        hinweis: 'Rechne mit den Werten von Linie B: $E(X_B)=10$ und $\sigma(X_B)=5$.'
        zeige: { eintraege: [wb] }
        danach: '<p>$|17-10|=7$ liegt zwischen $\sigma=5$ und $2\sigma=10$. Gleiche Wartezeit, andere Einordnung: Es zählen immer $E(X)$ und $\sigma$ der genannten Linie.</p>'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: Abstand in σ'
    text: '<p>Zwei Maschinen füllen Flaschen ab. $X$ ist die Füllmenge in ml. Für Maschine A ist $E(X_A)=500$ und $\sigma(X_A)=4$, für Maschine B ist $E(X_B)=500$ und $\sigma(X_B)=10$. Eine Flasche von Maschine A enthält $505$ ml.</p>'
    schritte:
      - typ: auswahl
        frage: 'Welche Maschine füllt im Mittel mehr ab?'
        optionen:
          - 'Maschine A'
          - 'Maschine B'
          - 'Beide gleich viel'
        korrekt: 2
        mischen: false
        hinweis: 'Vergleiche die Erwartungswerte.'
      - typ: eingabe
        frage: 'Wie weit liegt die Flasche von $E(X_A)$ entfernt, und wie viele $\sigma$ sind das?'
        layout: zeile
        felder:
          - { label: '$|505-500|=$', einheit: 'ml', loesung: 5, aria: 'Abstand' }
          - { label: 'Das sind', einheit: '$\sigma$', loesung: 1.25, aria: 'Abstand in Standardabweichungen' }
        hinweis: 'Teile den Abstand durch $\sigma(X_A)=4$.'
      - typ: auswahl
        frage: 'Wie ist die Füllmenge $505$ ml einzuordnen?'
        optionen:
          - 'Gewöhnlich: Der Abstand beträgt höchstens $\sigma$.'
          - 'Erhöhte, aber noch übliche Abweichung: Der Abstand liegt zwischen $\sigma$ und $2\sigma$.'
          - 'Ungewöhnlich: Der Abstand beträgt mehr als $2\sigma$.'
        korrekt: 1
        hinweis: 'Der Abstand ist das $1{,}25$-fache von $\sigma$.'

  - phase: mitmachen
    titel: 'Fast allein: Handy-Akkus'
    text: '<p>$X$ ist die Akkulaufzeit in Stunden (länger ist besser). Für Handy A ist $E(X_A)=10$ und $\sigma(X_A)=1$, für Handy B ist $E(X_B)=8$ und $\sigma(X_B)=2$.</p>'
    schritte:
      - typ: auswahl
        frage: 'Welches Handy hält im Mittel <strong>länger</strong> durch?'
        optionen:
          - 'Handy A'
          - 'Handy B'
          - 'Beide gleich lang'
        korrekt: 0
        mischen: false
        hinweis: 'Länger bedeutet hier größerer Erwartungswert.'
      - typ: zuordnen
        frage: 'Ordne drei Laufzeiten von Handy B ein.'
        titel_links: 'Laufzeit von B'
        titel_rechts: 'Einordnung'
        paare:
          - { links: '$9$ h', rechts: 'gewöhnlich' }
          - { links: '$11$ h', rechts: 'erhöht, aber noch üblich' }
          - { links: '$13$ h', rechts: 'ungewöhnlich' }
        hilfe: 'Für B ist $E=8$ und $\sigma=2$. Bestimme den Abstand zu $8$ und vergleiche ihn mit $2$ und $4$.'
      - typ: auswahl
        frage: 'Handy A hält bei einem Test $9{,}2$ Stunden durch. Wie ist das einzuordnen?'
        optionen:
          - 'Gewöhnlich: Der Abstand beträgt höchstens $\sigma$.'
          - 'Erhöhte, aber noch übliche Abweichung: Der Abstand liegt zwischen $\sigma$ und $2\sigma$.'
          - 'Ungewöhnlich: Der Abstand beträgt mehr als $2\sigma$.'
        korrekt: 0
        hinweis: 'Für Handy A gilt $E=10$ und $\sigma=1$. Wie weit sind $9{,}2$ von $10$ entfernt?'
