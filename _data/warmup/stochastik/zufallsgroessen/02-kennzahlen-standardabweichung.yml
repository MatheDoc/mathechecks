# Warm-Up zu Check 2 „Standardabweichung einer allgemeinen Zufallsgröße berechnen“ (Zufallsgrößen)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Kern: σ(X) = √(Σ (x_i − E(X))² · P(X = x_i)): Abweichung vom Erwartungswert, quadrieren,
# mit P gewichten und addieren (Varianz), Wurzel ziehen. Im Training ist E(X) gegeben, σ auf 4 NKS.
# Alle Zahlen per Python-Skript nachgerechnet.

check_id: stochastik__zufallsgroessen__02
abschluss: '<p>Im Training bekommst du eine Verteilung mit fünf Werten und den Erwartungswert $E(X)$ (auf 4 Nachkommastellen angegeben). Gesucht ist $\sigma(X)$, auf <strong>4 Nachkommastellen</strong> gerundet.</p><p><strong>Drei Dinge für die Eingabe:</strong></p><ul><li>Bei negativem $E(X)$ wird aus $x_i-E(X)$ ein „Minus minus“, z. B. $-3-(-0{,}4)=-2{,}6$. Setze $E(X)$ in Klammern.</li><li>Tippe den ganzen Term mit Wurzel in einem Zug in den Taschenrechner und runde erst am Ende.</li><li>Vergiss weder das Quadrat noch die Wurzel.</li></ul>'
karten:

  # ── Phase A: Idee ──────────────────────────────────────────
  - phase: orientierung
    titel: 'Gleicher Erwartungswert, andere Streuung'
    text: '<p>Zwei Münzspiele: Du wirfst eine Münze, bei Kopf gewinnst du, bei Zahl verlierst du. $X$ ist dein Gewinn in Euro.</p><ul><li>Spiel A: Gewinn $-1$ € oder $1$ €</li><li>Spiel B: Gewinn $-10$ € oder $10$ €</li></ul><p>Beide Ausgänge haben die Wahrscheinlichkeit $0{,}5$, und bei beiden Spielen ist $E(X)=0$. Im Mittel gewinnst du also bei keinem Spiel etwas. Trotzdem sind die Spiele sehr verschieden: Bei Spiel B geht es um viel mehr Geld.</p>'
    visual:
      typ: liste
      titel: 'Spiel A und Spiel B'
      eintraege:
        - { id: a, text: 'Spiel A: Gewinn $\pm 1$ €', gleichung: '$E(X)=0$', erledigt: true }
        - { id: b, text: 'Spiel B: Gewinn $\pm 10$ €', gleichung: '$E(X)=0$', erledigt: true }
        - { id: sa, text: 'Streuung von A', gleichung: '$\sigma(X)=1$' }
        - { id: sb, text: 'Streuung von B', gleichung: '$\sigma(X)=10$' }
    schritte:
      - typ: aufdecken
        frage: 'Der Erwartungswert verrät nicht, wie stark die Werte schwanken. Dafür gibt es eine zweite Kennzahl.'
        knopf: 'Standardabweichung zeigen'
        text: '<p>Bei Spiel A liegen die Gewinne $1$ € von $E(X)=0$ entfernt, bei Spiel B $10$ €. Diese Streuung misst die <strong>Standardabweichung</strong> $\sigma(X)$ (lies: Sigma von $X$): Sie gibt an, wie weit die Werte typischerweise vom Erwartungswert entfernt liegen.</p><p>Hier ist $\sigma(X)=1$ bei A und $\sigma(X)=10$ bei B. Je größer $\sigma$, desto stärker streuen die Werte.</p>'
        zeige: { eintraege: [sa, sb] }

  - phase: orientierung
    titel: 'Die Formel in vier Schritten'
    text: '<p>Meist liegen die Werte nicht so symmetrisch wie bei den Münzspielen. Dann berechnest du $\sigma$ mit einer Formel. Bei einem anderen Spiel ist $X$ wieder dein Gewinn in Euro, mit $E(X)=1$:</p>$$\begin{array}{c|cc}x_i&0&5\\\hline P(X=x_i)&0{,}8&0{,}2\end{array}$$'
    visual:
      typ: liste
      titel: 'Von der Abweichung zu σ'
      eintraege:
        - { id: abw, text: '1. Abweichung $x_i-E(X)$', gleichung: '$0-1=-1$<br>$5-1=4$' }
        - { id: qua, text: '2. Quadrieren', gleichung: '$(-1)^2=1$<br>$4^2=16$' }
        - { id: gew, text: '3. Gewichten und addieren (Varianz)', gleichung: '$1\cdot 0{,}8+16\cdot 0{,}2=4$' }
        - { id: wur, text: '4. Wurzel ziehen', gleichung: '$\sigma=\sqrt{4}=2$' }
    schritte:
      - typ: aufdecken
        frage: 'Erst die Abweichung vom Erwartungswert bilden, dann quadrieren.'
        knopf: 'Zeigen'
        text: '<p>Die <strong>Abweichungen</strong> $x_i-E(X)$ sind $0-1=-1$ und $5-1=4$.</p><p>Ohne Quadrat würden sie sich gegenseitig aufheben: $(-1)\cdot 0{,}8+4\cdot 0{,}2=0$. Das passiert bei jeder Verteilung, denn $E(X)$ ist genau der Ausgleichspunkt. Deshalb wird <strong>quadriert</strong>: $1$ und $16$. Alle Abweichungen zählen jetzt positiv, große sogar besonders stark.</p>'
        zeige: { eintraege: [abw, qua] }
      - typ: auswahl
        frage: 'Dann werden die Quadrate gewichtet und addiert, genau wie beim Erwartungswert. Welche Summe ist richtig?'
        optionen:
          - '$1+16$'
          - '$1\cdot 0{,}8+16\cdot 0{,}2$'
          - '$1\cdot 0+16\cdot 5$'
        korrekt: 1
        hinweis: 'Wie beim Erwartungswert zählt jeder Wert so stark, wie wahrscheinlich er ist: Gewichtet wird mit $P(X=x_i)$.'
        zeige: { eintraege: [gew] }
        danach: '$$1\cdot 0{,}8+16\cdot 0{,}2=0{,}8+3{,}2=4$$<p>Diese Summe heißt <strong>Varianz</strong> $\sigma^2$.</p>'
      - typ: aufdecken
        frage: 'Zum Schluss die Wurzel ziehen.'
        knopf: 'Zeigen'
        text: '$$\sigma(X)=\sqrt{4}=2$$<p>Die Wurzel macht das Quadrieren rückgängig: Die Varianz hat die Einheit €², erst $\sigma$ hat wieder die Einheit €.</p><p><strong>Merke:</strong></p><ul><li>$\sigma(X)=\sqrt{\sum (x_i-E(X))^2\cdot P(X=x_i)}$</li><li>Abweichung, quadrieren, mit $P$ gewichten, addieren, Wurzel.</li></ul>'
        zeige: { eintraege: [wur] }

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Schritt für Schritt'
    text: '<p>Die Verteilung von $X$ mit $E(X)=0{,}7$:</p>$$\begin{array}{c|ccc}x_i&-2&1&4\\\hline P(X=x_i)&0{,}3&0{,}5&0{,}2\end{array}$$'
    visual:
      typ: liste
      titel: 'Summanden unter der Wurzel'
      eintraege:
        - { id: t1, text: 'Wert $-2$', gleichung: '$(-2-0{,}7)^2\cdot 0{,}3=2{,}187$' }
        - { id: t2, text: 'Wert $1$', gleichung: '$(1-0{,}7)^2\cdot 0{,}5=0{,}045$' }
        - { id: t3, text: 'Wert $4$', gleichung: '$(4-0{,}7)^2\cdot 0{,}2=2{,}178$' }
        - { id: var, text: 'Varianz', gleichung: '$2{,}187+0{,}045+2{,}178=4{,}41$' }
        - { id: sd, text: 'Standardabweichung', gleichung: '$\sigma=\sqrt{4{,}41}=2{,}1$' }
    schritte:
      - typ: auswahl
        frage: 'Welcher Summand gehört zum Wert $-2$?'
        optionen:
          - '$(-2-0{,}7)^2\cdot 0{,}3$'
          - '$(-2)^2\cdot 0{,}3$'
          - '$(-2+0{,}7)^2\cdot 0{,}3$'
        korrekt: 0
        hinweis: 'Die Abweichung ist Wert minus Erwartungswert, also $-2-0{,}7$. Danach wird quadriert und mit $0{,}3$ gewichtet.'
        zeige: { eintraege: [t1] }
        danach: '$$(-2-0{,}7)^2\cdot 0{,}3=(-2{,}7)^2\cdot 0{,}3=2{,}187$$'
      - typ: aufdecken
        frage: 'Die anderen beiden Summanden:'
        knopf: 'Zeigen'
        text: '$$\begin{align*}(1-0{,}7)^2\cdot 0{,}5&=0{,}045\\(4-0{,}7)^2\cdot 0{,}2&=2{,}178\end{align*}$$'
        zeige: { eintraege: [t2, t3] }
      - typ: aufdecken
        frage: '<strong>Addieren und Wurzel ziehen:</strong>'
        knopf: 'Zeigen'
        text: '$$\begin{align*}\sigma&=\sqrt{2{,}187+0{,}045+2{,}178}\\&=\sqrt{4{,}41}\\&=2{,}1\end{align*}$$<p>Im Training tippst du den ganzen Term auf einmal in den Taschenrechner und rundest erst am Ende.</p>'
        zeige: { eintraege: [var, sd] }

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: negativer Erwartungswert'
    text: '<p>Die Verteilung von $X$ mit $E(X)=-0{,}4$:</p>$$\begin{array}{c|ccc}x_i&-3&0&2\\\hline P(X=x_i)&0{,}4&0{,}2&0{,}4\end{array}$$<p>Der Ansatz:</p>$$\sigma(X)=\sqrt{\begin{aligned}&(-3-(-0{,}4))^2\cdot 0{,}4\\+&(0-(-0{,}4))^2\cdot 0{,}2\\+&(2-(-0{,}4))^2\cdot 0{,}4\end{aligned}}$$'
    schritte:
      - typ: eingabe
        frage: 'Berechne zuerst die drei Abweichungen $x_i-E(X)$.'
        layout: zeile
        felder:
          - { label: '$-3-(-0{,}4)=$', loesung: -2.6, aria: 'erste Abweichung' }
          - { label: '$0-(-0{,}4)=$', loesung: 0.4, aria: 'zweite Abweichung' }
          - { label: '$2-(-0{,}4)=$', loesung: 2.4, aria: 'dritte Abweichung' }
        hinweis: 'Minus minus gibt plus: $-3-(-0{,}4)=-3+0{,}4$.'
      - typ: eingabe
        frage: 'Berechne $\sigma(X)$ auf 4 Nachkommastellen.'
        felder:
          - { label: '$\sigma(X)\approx$', loesung: 2.2450, toleranz: 0.0001, aria: 'Standardabweichung' }
        hinweis: 'Quadriere die Abweichungen, gewichte sie mit $0{,}4$, $0{,}2$ und $0{,}4$ und addiere: Unter der Wurzel steht $5{,}04$.'

  - phase: mitmachen
    titel: 'Fast allein: Ansatz wählen'
    text: '<p>Die Verteilung von $X$ mit $E(X)=3{,}3$:</p>$$\begin{array}{c|cccc}x_i&1&2&4&6\\\hline P(X=x_i)&0{,}1&0{,}4&0{,}3&0{,}2\end{array}$$<p>Die Pünktchen stehen für die beiden mittleren Summanden.</p>'
    schritte:
      - typ: auswahl
        frage: 'Welcher Ansatz liefert $\sigma(X)$?'
        optionen:
          - '$\sqrt{(1-3{,}3)^2\cdot 0{,}1+\ldots+(6-3{,}3)^2\cdot 0{,}2}$'
          - '$(1-3{,}3)^2\cdot 0{,}1+\ldots+(6-3{,}3)^2\cdot 0{,}2$'
          - '$\sqrt{1^2\cdot 0{,}1+\ldots+6^2\cdot 0{,}2}$'
          - '$\sqrt{(1-3{,}3)\cdot 0{,}1+\ldots+(6-3{,}3)\cdot 0{,}2}$'
        korrekt: 0
        hinweis: 'In der Formel stehen die Abweichung vom Erwartungswert, das Quadrat, die Wahrscheinlichkeit und die Wurzel über alles.'
        danach: '<p>Ohne Wurzel erhältst du nur die Varianz, ohne $E(X)$ keine Abweichung, ohne Quadrat heben sich Plus und Minus auf.</p>'
      - typ: eingabe
        frage: 'Berechne die Varianz $\sigma^2$ und die Standardabweichung $\sigma$. Runde $\sigma$ auf 4 Nachkommastellen.'
        layout: zeile
        felder:
          - { label: '$\sigma^2=$', loesung: 2.81, aria: 'Varianz' }
          - { label: '$\sigma\approx$', loesung: 1.6763, toleranz: 0.0001, aria: 'Standardabweichung' }
        hinweis: 'Die Abweichungen sind $-2{,}3$, $-1{,}3$, $0{,}7$ und $2{,}7$. Quadriere, gewichte mit $P$ und addiere; aus dem Ergebnis ziehst du die Wurzel.'
