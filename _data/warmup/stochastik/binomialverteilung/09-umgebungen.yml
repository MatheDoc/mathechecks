# Warm-Up zu Check 09 „Umgebungen des Erwartungswerts“ (Binomialverteilung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Kern: Abweichung bestimmen (d, r·μ oder c·σ), Grenzen μ ± Abweichung, auf ganze Anzahlen runden.
# „höchstens“ → innerhalb, nach innen runden; „mindestens“ → außerhalb, Grenzen gehören dazu,
# links abrunden, rechts aufrunden, beide Seiten addieren.
# Training: 20 Aufgaben mit je drei Teilfragen (absolut, relativ, Sigma), jeweils höchstens oder mindestens.
# Nachgerechnet (exakte Bernoulli-Formel, 4 NKS):
#   n=20, p=0,5: P(8≤X≤12) ≈ 0,7368; P(X≤7)+P(X≥13) ≈ 0,2632
#   n=25, p=0,3 (Beispiel): 0,6171; 0,6637; σ ≈ 2,2913, 2σ ≈ 4,58 → P(3≤X≤12) ≈ 0,9736
#   n=50, p=0,4: μ=20, σ ≈ 3,4641; 1,5σ ≈ 5,20 → P(15≤X≤25) ≈ 0,8887; 12 % → 2,4 → P(X≤17)+P(X≥23) ≈ 0,4709

check_id: stochastik__binomialverteilung__09
abschluss: '<p>Im Training kommen in jeder Aufgabe alle drei Abweichungen vor: ein fester Wert, ein Prozentsatz von $\mu$ und ein Vielfaches von $\sigma$. Rechne $\mu$ und $\sigma$ zuerst aus, bestimme dann die Grenzen und runde je nach „höchstens“ oder „mindestens“.</p>'
karten:

  # ── Phase A: Idee ──────────────────────────────────────────
  - phase: orientierung
    titel: 'Nah am Erwartungswert'
    text: '<p>Eine Münze wird $20$-mal geworfen, $X$ zählt „Kopf“. Im Mittel sind $\mu=20\cdot 0{,}5=10$ Treffer zu erwarten. Wie wahrscheinlich ist ein Ergebnis <strong>nah</strong> bei $10$?</p>'
    visual:
      typ: zahlenstrahl
      n: 20
      p: 0.5
      marke: 10
    schritte:
      - typ: aufdecken
        frage: 'Was heißt: $X$ weicht um <strong>höchstens 2</strong> vom Erwartungswert ab?'
        knopf: 'Zeigen'
        text: '<p>$X$ liegt <strong>innerhalb</strong> der Grenzen $10-2=8$ und $10+2=12$:</p>$$\begin{align*}&P(8\leq X\leq 12)\\&=Bcd(8;12;20;0{,}5)\\&\approx 0{,}7368\end{align*}$$'
        zeige: { bereiche: [[8, 12]] }
      - typ: auswahl
        frage: 'Und: $X$ weicht um <strong>mindestens 3</strong> vom Erwartungswert ab. Welche Anzahlen gehören dazu?'
        optionen:
          - '$0$ bis $7$ und $13$ bis $20$'
          - '$7$ bis $13$'
          - '$0$ bis $6$ und $14$ bis $20$'
        korrekt: 0
        hinweis: 'Die $7$ ist genau $3$ von $10$ entfernt. Ist das „mindestens 3“?'
        zeige: { bereiche: [[0, 7], [13, 20]] }
        danach: '<p>Jetzt liegt $X$ <strong>außerhalb</strong>, die Grenzen $7$ und $13$ gehören dazu. Beide Seiten werden addiert:</p>$$\begin{align*}&P(X\leq 7)+P(X\geq 13)\\&\approx 0{,}2632\end{align*}$$<p><strong>Merke:</strong></p><ul><li>Die Abweichung ist ein fester Wert $d$, ein Anteil $r\cdot\mu$ oder ein Vielfaches $c\cdot\sigma$.</li><li>„höchstens“: $X$ liegt zwischen $\mu-$Abweichung und $\mu+$Abweichung.</li><li>„mindestens“: $X$ liegt außerhalb, beide Seiten addieren.</li></ul>'

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Drei Abweichungen'
    text: '<p>Es seien $n=25$ und $p=0{,}3$. Dann sind $\mu=25\cdot 0{,}3=7{,}5$ und</p>$$\sigma=\sqrt{25\cdot 0{,}3\cdot 0{,}7}\approx 2{,}29$$<p>Jetzt liegen die Grenzen nicht mehr auf ganzen Zahlen.</p>'
    visual:
      typ: zahlenstrahl
      n: 25
      p: 0.3
      marke: 7.5
    schritte:
      - typ: aufdecken
        frage: '<strong>Höchstens 2</strong> vom Erwartungswert entfernt.'
        knopf: 'Rechnung zeigen'
        text: '<p>Grenzen $7{,}5-2=5{,}5$ und $7{,}5+2=9{,}5$. Innerhalb liegen nur die ganzen Anzahlen $6$ bis $9$, es wird nach innen gerundet:</p>$$\begin{align*}&P(5{,}5\leq X\leq 9{,}5)\\&=P(6\leq X\leq 9)\\&\approx 0{,}6171\end{align*}$$'
        zeige: { bereiche: [[6, 9]] }
      - typ: auswahl
        frage: '<strong>Mindestens 10&nbsp;%</strong> vom Erwartungswert entfernt. Wie groß ist die Abweichung?'
        optionen:
          - '$0{,}1\cdot 7{,}5=0{,}75$'
          - '$0{,}1\cdot 25=2{,}5$'
          - '$10$'
        korrekt: 0
        hinweis: 'Gemeint sind $10\,\%$ <strong>vom Erwartungswert</strong>.'
        danach: '<p>Die Grenzen sind $7{,}5-0{,}75=6{,}75$ und $7{,}5+0{,}75=8{,}25$.</p>'
      - typ: auswahl
        frage: 'Welche Anzahlen sind mindestens $0{,}75$ von $7{,}5$ entfernt?'
        optionen:
          - '$0$ bis $6$ und $9$ bis $25$'
          - '$7$ bis $8$'
          - '$0$ bis $7$ und $8$ bis $25$'
        korrekt: 0
        hinweis: '$7$ ist nur $0{,}5$ von $7{,}5$ entfernt, das ist zu nah.'
        zeige: { bereiche: [[0, 6], [9, 25]] }
        danach: '<p>Links wird abgerundet, rechts aufgerundet, beide Seiten werden addiert:</p>$$\begin{align*}&P(X\leq 6)+P(X\geq 9)\\&=1-P(7\leq X\leq 8)\\&\approx 0{,}6637\end{align*}$$'
      - typ: aufdecken
        frage: '<strong>Höchstens die doppelte Standardabweichung</strong> vom Erwartungswert entfernt.'
        knopf: 'Rechnung zeigen'
        text: '<p>Die Abweichung ist $2\sigma\approx 4{,}58$, die Grenzen sind $2{,}92$ und $12{,}08$. Nach innen gerundet:</p>$$\begin{align*}&P(2{,}92\leq X\leq 12{,}08)\\&=P(3\leq X\leq 12)\\&\approx 0{,}9736\end{align*}$$'
        zeige: { bereiche: [[3, 12]] }

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: Abweichung bestimmen'
    text: '<p>$40\,\%$ der Pendler fahren mit dem Rad. Es werden $50$ Pendler befragt, $X$ zählt die Radfahrer. Dann sind $\mu=20$ und $\sigma=\sqrt{50\cdot 0{,}4\cdot 0{,}6}\approx 3{,}46$.</p>'
    schritte:
      - typ: zuordnen
        frage: 'Wie groß ist jeweils die Abweichung vom Erwartungswert?'
        titel_links: 'X weicht ab um …'
        titel_rechts: 'Abweichung'
        paare:
          - { links: 'höchstens 4', rechts: '$4$' }
          - { links: 'mindestens 12&nbsp;%', rechts: '$0{,}12\cdot 20=2{,}4$' }
          - { links: 'höchstens die 1,5-fache Standardabweichung', rechts: '$1{,}5\cdot\sigma\approx 5{,}20$' }
          - { links: 'mindestens eine Standardabweichung', rechts: '$\sigma\approx 3{,}46$' }
        hilfe: 'Tippe erst links, dann rechts.'

  - phase: mitmachen
    titel: 'Grenzen runden'
    text: '<p>Weiter mit $n=50$, $p=0{,}4$, $\mu=20$ und $\sigma\approx 3{,}46$.</p>'
    visual:
      typ: zahlenstrahl
      n: 50
      p: 0.4
      marke: 20
    schritte:
      - typ: eingabe
        frage: '<strong>Höchstens die 1,5-fache Standardabweichung</strong>: Die Grenzen sind $14{,}80$ und $25{,}20$. Trage die Anzahlen ein und berechne die Wahrscheinlichkeit.'
        layout: zeile
        felder:
          - { label: '$Bcd($', einheit: '$;$', loesung: 15, toleranz: 0, aria: 'untere Grenze a' }
          - { einheit: '$;50;0{,}4)\approx$', loesung: 25, toleranz: 0, aria: 'obere Grenze b', zeige: { bereiche: [[15, 25]] } }
          - { loesung: 0.8887, aria: 'Wahrscheinlichkeit' }
        hinweis: 'Innerhalb bleiben: $14{,}80$ wird zu $15$, $25{,}20$ wird zu $25$.'
      - typ: eingabe
        frage: '<strong>Mindestens 12&nbsp;%</strong> vom Erwartungswert entfernt. Tipp: Die Grenzen sind $17{,}6$ und $22{,}4$.'
        felder:
          - { label: '$P\approx$', loesung: 0.4709, aria: 'Wahrscheinlichkeit', zeige: { bereiche: [[0, 17], [23, 50]] } }
        hinweis: 'Außerhalb: $X\leq 17$ oder $X\geq 23$. Also $Bcd(0;17;50;0{,}4)+Bcd(23;50;50;0{,}4)$, erst am Ende runden.'
