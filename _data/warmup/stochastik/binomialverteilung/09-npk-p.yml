# Warm-Up zu Check 09 „p mit Intervall-Wkt bestimmen“ (Binomialverteilung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Aufbau wie Check 08 (n bestimmen), nur mit p: p lässt sich nur ausprobieren, P(X≥k) steigt, P(X≤k) fällt mit p,
# Nachbarn-Paar im Raster 0,01 (Ergebnis auf 2 Nachkommastellen).
# „kleinster Wert“ = kleinstes p, für das die Bedingung gilt; „größter Wert“ = größtes p, für das sie gilt.
# Das Probieren läuft über Bcd(a;b;n;p); anders als bei Check 08 bleiben a, b und n gleich, nur p wechselt.
# Alle vier Kombinationen des Trainings kommen vor: Zuschauen (kleinster/≥/≥, größter/≤/≥), Mitmachen (größter/≥/≤, kleinster/≤/≤).
# Zahlen nachgerechnet mit math.comb (exakte Bernoulli-Formel), gerundet auf 4 Nachkommastellen.

check_id: stochastik__binomialverteilung__09
abschluss: '<p>Im Training stehen $n$, $k$ und eine Bedingung wie $P(X\leq 142)\leq 0{,}31$, und du suchst $p$ auf 2 Nachkommastellen. Die Zahlen sind größer, der Plan bleibt gleich: Starte bei $p\approx k/n$, prüfe, ob $P$ zu groß oder zu klein ist, und taste dich mit dem Taschenrechner in Schritten von $0{,}01$ an die Schwelle heran. Die Antwort sind <strong>zwei Nachbarn</strong>, bei denen die Bedingung kippt. Bei „kleinster Wert von $p$“ gibst du das kleinste $p$ an, bei dem sie gilt, bei „größter Wert“ das größte. Gib $p$ im Taschenrechner als Dezimalzahl ein, nicht in Prozent.</p>'
karten:

  # ── Phase A: Idee ─────────────────────────────────────────
  - phase: orientierung
    titel: 'p lässt sich nur ausprobieren'
    text: '<p>Eine Basketballspielerin wirft $20$-mal. Wie hoch muss ihre Trefferwahrscheinlichkeit <strong>mindestens</strong> sein, damit die Wahrscheinlichkeit für <strong>mindestens 12 Treffer</strong> mindestens $60\,\%$ beträgt? Als Bedingung:</p>$$P(X\geq 12)\geq 0{,}6$$<p>Jetzt ist $p$ gesucht. In der Bernoulli-Formel steckt $p$ aber in den Potenzen $p^k$ und $(1-p)^{n-k}$, und die Wahrscheinlichkeit ist eine Summe vieler solcher Terme. Es gibt <strong>keine Formel</strong>, die man nach $p$ auflösen könnte.</p>'
    visual:
      typ: liste
      titel: 'P(X ≥ 12) bei n = 20'
      eintraege:
        - { id: p45, text: 'p = 0,45', gleichung: '$P(X\geq 12)\approx 0{,}1308$' }
        - { id: p55, text: 'p = 0,55', gleichung: '$P(X\geq 12)\approx 0{,}4143$' }
        - { id: p65, text: 'p = 0,65', gleichung: '$P(X\geq 12)\approx 0{,}7624$' }
        - { id: p75, text: 'p = 0,75', gleichung: '$P(X\geq 12)\approx 0{,}9591$' }
    schritte:
      - typ: aufdecken
        frage: 'Was bleibt, ist <strong>Ausprobieren</strong>.'
        knopf: 'Werte zeigen'
        text: '<p>Man setzt verschiedene $p$ ein und lässt den Taschenrechner $P(X\geq 12)$ berechnen. Rechts siehst du das für $p=0{,}45$ bis $p=0{,}75$.</p>'
        zeige: { eintraege: [p45, p55, p65, p75] }
      - typ: auswahl
        frage: 'Schau dir die Werte an. Was passiert mit $P(X\geq 12)$, wenn $p$ größer wird?'
        optionen:
          - 'Sie wird größer.'
          - 'Sie wird kleiner.'
          - 'Sie steigt erst und fällt dann.'
        korrekt: 0
        hinweis: 'Lies die Werte rechts von oben nach unten.'
        danach: '<p>Genau: Mit besserer Trefferquote gibt es eher viele Treffer. Bei $P(X\leq 12)$ ist es umgekehrt: Je größer $p$, desto mehr Treffer erwartet man, „höchstens 12“ wird <strong>unwahrscheinlicher</strong>.</p>'
      - typ: aufdecken
        frage: 'Wo liegt die Antwort?'
        knopf: 'Zeigen'
        text: '<p>Bei $p=0{,}55$ ist $P(X\geq 12)$ noch kleiner als $0{,}6$, bei $p=0{,}65$ schon größer. Dazwischen <strong>kippt</strong> die Bedingung. Weil $p$ auf 2 Nachkommastellen gesucht ist, probiert man dort in Schritten von $0{,}01$ weiter, bis man zwei Nachbarn findet: einen, bei dem die Bedingung gilt, und einen, bei dem sie nicht gilt.</p><p><strong>Merke:</strong></p><ul><li>$p$ lässt sich nicht ausrechnen, nur in Schritten von $0{,}01$ ausprobieren.</li><li>$P(X\geq k)$ wächst mit $p$, $P(X\leq k)$ fällt mit $p$.</li><li>Die Antwort liegt bei zwei Nachbarn, zwischen denen die Bedingung kippt.</li></ul>'

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Kleinster Wert: ab wann reicht es?'
    text: '<p>Weiter mit den $20$ Würfen: Gesucht ist das kleinste $p$ mit $P(X\geq 12)\geq 0{,}6$.</p><p>Im Training brauchst du einen guten <strong>Startwert</strong>: $12$ Treffer bei $20$ Würfen erwartet man bei $p=k/n=12/20=0{,}6$.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 20)'
      eintraege:
        - { id: p60, text: 'p = 0,60', gleichung: '$P(X\geq 12)\approx 0{,}5956$<br>$0{,}5956&lt;0{,}6$: reicht nicht' }
        - { id: p61, text: 'p = 0,61', gleichung: '$P(X\geq 12)\approx 0{,}6312$<br>$0{,}6312\geq 0{,}6$: reicht' }
    schritte:
      - typ: aufdecken
        frage: 'Zuerst den Startwert testen.'
        knopf: 'p = 0,6 testen'
        text: '$$\begin{align*}&Bcd(12;20;20;0{,}6)\\&\approx 0{,}5956\end{align*}$$<p>Das ist knapp kleiner als $0{,}6$. Weil $P(X\geq 12)$ mit $p$ wächst, geht es mit größerem $p$ weiter, Schritt $0{,}01$.</p>'
        zeige: { eintraege: [p60] }
      - typ: auswahl
        frage: 'Wie lautet die Eingabe für $p=0{,}61$? Nur $p$ ändert sich.'
        optionen:
          - '$Bcd(12;20;20;0{,}61)$'
          - '$Bcd(12;20;20;61)$'
          - '$Bcd(0;12;20;0{,}61)$'
        korrekt: 0
        hinweis: '$p$ gehört als Dezimalzahl an die vierte Stelle, und „mindestens 12“ reicht bis $20$.'
        zeige: { eintraege: [p61] }
        danach: '$$\begin{align*}&Bcd(12;20;20;0{,}61)\\&\approx 0{,}6312\end{align*}$$<p>Das ist größer als $0{,}6$: Es reicht.</p>'
      - typ: auswahl
        frage: 'Welches $p$ ist die Antwort?'
        optionen:
          - '$p=0{,}61$'
          - '$p=0{,}60$'
          - '$p=0{,}62$'
        korrekt: 0
        hinweis: 'Gesucht ist das <strong>kleinste</strong> $p$, bei dem $P(X\geq 12)\geq 0{,}6$ gilt.'
        danach: '<p>Die Trefferwahrscheinlichkeit muss mindestens $0{,}61$ sein. Beim „kleinsten Wert“ zählt der <strong>rechte</strong> Nachbar: das kleinste $p$, für das die Bedingung gilt.</p>'

  - phase: vormachen
    titel: 'Größter Wert: bis wann reicht es?'
    text: '<p>Dieselben $20$ Würfe. Jetzt die andere Richtung: Wie hoch darf die Trefferwahrscheinlichkeit <strong>höchstens</strong> sein, damit die Wahrscheinlichkeit für <strong>höchstens 7 Treffer</strong> mindestens $50\,\%$ beträgt?</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 20)'
      eintraege:
        - { id: p37, text: 'p = 0,37', gleichung: '$P(X\leq 7)\approx 0{,}5265$<br>$0{,}5265\geq 0{,}5$: reicht' }
        - { id: p38, text: 'p = 0,38', gleichung: '$P(X\leq 7)\approx 0{,}4892$<br>$0{,}4892&lt;0{,}5$: reicht nicht' }
    schritte:
      - typ: auswahl
        frage: 'Welche Bedingung steckt im Text?'
        optionen:
          - '$P(X\leq 7)\geq 0{,}5$'
          - '$P(X\geq 7)\leq 0{,}5$'
          - '$P(X\leq 7)\leq 0{,}5$'
        korrekt: 0
        hinweis: '„Höchstens 7 Treffer“ gehört zu $X$, „mindestens $50\,\%$“ zur Wahrscheinlichkeit. Das „höchstens“ vor der Trefferwahrscheinlichkeit betrifft nur $p$.'
        zeige: { eintraege: [p37, p38] }
        danach: '<p>Richtig. Bei „höchstens 7“ bleiben die Grenzen fest, nur $p$ wechselt: $Bcd(0;7;20;p)$. Rechts stehen die Nachbarn, bei denen die Bedingung kippt.</p>'
      - typ: auswahl
        frage: 'Welches $p$ ist die Antwort?'
        optionen:
          - '$p=0{,}37$'
          - '$p=0{,}38$'
          - '$p=0{,}36$'
        korrekt: 0
        hinweis: 'Gesucht ist das <strong>größte</strong> $p$, bei dem $P(X\leq 7)\geq 0{,}5$ noch gilt. Bei $p=0{,}38$ gilt es nicht mehr.'
        danach: '<p>Die Trefferwahrscheinlichkeit darf höchstens $0{,}37$ sein. Beim „größten Wert“ zählt der <strong>linke</strong> Nachbar: das größte $p$, für das die Bedingung noch gilt.</p>'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: Quiz'
    text: '<p>Ein Quiz hat $25$ Fragen, jede Antwort wird geraten. Wie groß darf die Wahrscheinlichkeit für eine richtige Antwort <strong>höchstens</strong> sein, damit die Wahrscheinlichkeit für <strong>mindestens 10</strong> richtige Antworten <strong>höchstens $50\,\%$</strong> beträgt?</p><p>Gegeben: $n=25$ und $k=10$. Die Tabelle ist schon fertig.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 25)'
      eintraege:
        - { id: p37, text: 'p = 0,37', erledigt: true, gleichung: '$P(X\geq 10)\approx 0{,}4517$<br>$0{,}4517\leq 0{,}5$: gilt' }
        - { id: p38, text: 'p = 0,38', erledigt: true, gleichung: '$P(X\geq 10)\approx 0{,}4933$<br>$0{,}4933\leq 0{,}5$: gilt' }
        - { id: p39, text: 'p = 0,39', erledigt: true, gleichung: '$P(X\geq 10)\approx 0{,}5347$<br>$0{,}5347&gt;0{,}5$: gilt nicht' }
    schritte:
      - typ: zuordnen
        frage: 'Bevor du selbst rechnest: Was passt zusammen?'
        titel_links: 'Situation'
        titel_rechts: 'Folge'
        paare:
          - { links: 'wenn $p$ größer wird, dann wird $P(X\geq k)$', rechts: 'größer' }
          - { links: 'wenn $p$ größer wird, dann wird $P(X\leq k)$', rechts: 'kleiner' }
          - { links: 'gesucht: <strong>kleinster</strong> Wert von $p$', rechts: 'kleinstes $p$, für das die Bedingung gilt' }
          - { links: 'gesucht: <strong>größter</strong> Wert von $p$', rechts: 'größtes $p$, für das die Bedingung gilt' }
        danach: '<p>Die Bedingung prüfst du immer genau so, wie sie in der Aufgabe steht, auch wenn dort $\leq$ steht. Rechts ist das schon geschehen.</p>'
      - typ: eingabe
        frage: 'Lies aus der Tabelle das gesuchte $p$ ab.'
        felder:
          - { label: '$p=$', loesung: 0.38, aria: 'gesuchtes p' }
        hinweis: 'Gesucht ist der größte Wert von $p$, für den die Bedingung gilt. Bei $p=0{,}39$ gilt sie nicht mehr.'
        danach: '<p>Die Wahrscheinlichkeit für eine richtige Antwort darf höchstens $0{,}38$ sein.</p>'

  - phase: mitmachen
    titel: 'Neue Zahlen: Bauteile'
    text: '<p>Von $30$ Bauteilen ist jedes mit der Wahrscheinlichkeit $p$ defekt. Wie hoch muss $p$ <strong>mindestens</strong> sein, damit die Wahrscheinlichkeit für <strong>höchstens 12</strong> defekte Bauteile <strong>höchstens $45\,\%$</strong> beträgt (auf 2 Nachkommastellen gerundet)?</p><p>Gegeben: $n=30$ und $k=12$.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 30)'
      eintraege:
        - { id: p42, text: 'p = 0,42', gleichung: '$P(X\leq 12)\approx 0{,}4893$<br>$0{,}4893&gt;0{,}45$: gilt nicht' }
        - { id: p43, text: 'p = 0,43', gleichung: '$P(X\leq 12)\approx 0{,}4449$<br>$0{,}4449\leq 0{,}45$: gilt' }
    schritte:
      - typ: eingabe
        frage: 'Die Nachbarn sind $p=0{,}42$ und $p=0{,}43$. Rechne mit $Bcd(0;12;30;p)$, auf 4 Nachkommastellen gerundet.'
        layout: zeile
        felder:
          - { label: '$p=0{,}42$:', loesung: 0.4893, aria: 'P für p gleich 0,42', zeige: { eintraege: [p42] } }
          - { label: '$p=0{,}43$:', loesung: 0.4449, aria: 'P für p gleich 0,43', zeige: { eintraege: [p43] } }
        hinweis: 'Gib $Bcd(0;12;30;0{,}42)$ und $Bcd(0;12;30;0{,}43)$ ein. Nur das $p$ ändert sich.'
      - typ: eingabe
        frage: 'Welches $p$ ist die Antwort?'
        felder:
          - { label: '$p=$', loesung: 0.43, aria: 'gesuchtes p' }
        hinweis: 'Die Bedingung lautet $P(X\leq 12)\leq 0{,}45$. Bei $p=0{,}42$ gilt sie noch nicht, bei $p=0{,}43$ gilt sie. Gesucht ist der kleinste Wert.'
        danach: '<p>Die Defektwahrscheinlichkeit muss mindestens $0{,}43$ sein.</p>'

  - phase: mitmachen
    titel: 'Selbst herantasten'
    text: '<p>Von $50$ Bestellungen eines Online-Shops wird jede mit der Wahrscheinlichkeit $p$ zurückgeschickt. Wie groß darf $p$ <strong>höchstens</strong> sein, damit die Wahrscheinlichkeit für <strong>höchstens 15</strong> Rücksendungen <strong>mindestens $25\,\%$</strong> beträgt (auf 2 Nachkommastellen gerundet)?</p><p>Gegeben: $n=50$ und $k=15$. Hier tastest du dich selbst an das $p$ heran.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 50)'
      eintraege:
        - { id: p30, text: 'p = 0,30', gleichung: '$P(X\leq 15)\approx 0{,}5692$<br>$0{,}5692\geq 0{,}25$: gilt' }
        - { id: p33, text: 'p = 0,33', gleichung: '$P(X\leq 15)\approx 0{,}3880$<br>$0{,}3880\geq 0{,}25$: gilt' }
        - { id: p35, text: 'p = 0,35', gleichung: '$P(X\leq 15)\approx 0{,}2801$<br>$0{,}2801\geq 0{,}25$: gilt' }
        - { id: p36, text: 'p = 0,36', gleichung: '$P(X\leq 15)\approx 0{,}2328$<br>$0{,}2328&lt;0{,}25$: gilt nicht' }
    schritte:
      - typ: eingabe
        frage: '<strong>Startwert:</strong> Berechne $p=k/n$ und teste ihn.'
        layout: zeile
        felder:
          - { label: '$p=$', loesung: 0.3, aria: 'Startwert p' }
          - { label: '$P(X\leq 15)\approx$', loesung: 0.5692, aria: 'P für den Startwert', zeige: { eintraege: [p30] } }
        hinweis: '$p=15/50$. Dann $Bcd(0;15;50;p)$ mit diesem $p$ an vierter Stelle.'
      - typ: auswahl
        frage: 'Die Bedingung gilt noch ($0{,}5692\geq 0{,}25$). Wie geht es weiter?'
        optionen:
          - 'Mit größerem $p$ weiterprobieren, bis sie nicht mehr gilt.'
          - 'Mit kleinerem $p$ weiterprobieren.'
          - '$p=0{,}3$ als Antwort nehmen.'
        korrekt: 0
        hinweis: 'Gesucht ist das <strong>größte</strong> $p$, für das $P(X\leq 15)\geq 0{,}25$ noch gilt. $P(X\leq k)$ fällt mit $p$.'
      - typ: eingabe
        frage: 'Taste dich heran. Welches $p$ ist die Antwort?'
        felder:
          - { label: '$p=$', loesung: 0.35, aria: 'gesuchtes p' }
        hinweis: 'Probiere $p=0{,}31$, $0{,}32$, … (oder erst einen größeren Sprung, z. B. $p=0{,}33$). Gesucht ist das größte $p$ mit $P(X\leq 15)\geq 0{,}25$.'
        zeige: { eintraege: [p33, p35, p36] }
        danach: '<p>Bei $p=0{,}33$ ist $P\approx 0{,}3880$ und bei $p=0{,}35$ ist $P\approx 0{,}2801$, die Bedingung gilt noch. Bei $p=0{,}36$ ist $P\approx 0{,}2328$, jetzt nicht mehr. Die Rücksendewahrscheinlichkeit darf höchstens $0{,}35$ sein.</p>'
