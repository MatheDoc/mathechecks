# Warm-Up zu Check 06 „Histogramm Einzel-Wkt“ (Binomialverteilung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Wie im Training: Werte auf 2 Nachkommastellen ablesen, Toleranz 0,01. Alle Ergebnisse so gewählt, dass die
# Summe der abgelesenen (gerundeten) Balkenhöhen mit dem exakt gerundeten Wert übereinstimmt (per Skript geprüft).

check_id: stochastik__binomialverteilung__06
abschluss: '<p>Im Training gibt es zu jedem Histogramm vier Ereignisse: „genau“, „mehr als“, „höchstens“ und „mindestens … und weniger als …“. Bestimme zuerst die Balken, dann ablesen und addieren. Sind es viele Balken, nimm das Gegenereignis: $1$ minus die übrigen Balken. Vergiss dabei den Balken von $0$ nicht. Ergebnisse auf 2 Nachkommastellen.</p>'
karten:

  # ── Phase A: Idee ──────────────────────────────────────────
  - phase: orientierung
    titel: 'Was ein Balken zeigt'
    text: '<p>Ein Bogenschütze schießt $10$-mal, jeder Schuss trifft mit $p=0{,}4$. Das Histogramm zeigt die Verteilung von $X$, der Anzahl der Treffer. Fährst du über einen Balken oder tippst ihn an, erscheint sein Wert.</p>'
    visual:
      typ: histogramm
      n: 10
      p: 0.4
    schritte:
      - typ: aufdecken
        frage: 'Wie liest man das Histogramm?'
        knopf: 'Erklären'
        text: '<p>Auf der waagerechten Achse steht die Anzahl $k$ der Treffer, von $0$ bis $10$. Jeder Balken gehört zu genau einer Anzahl. Seine <strong>Höhe</strong> ist die Wahrscheinlichkeit für <strong>genau</strong> $k$ Treffer, also $P(X=k)$.</p>'
        zeige: { bereiche: [[2, 2]] }
      - typ: eingabe
        frage: 'Wie wahrscheinlich sind genau $2$ Treffer? Lies am markierten Balken ab, auf 2 Nachkommastellen.'
        felder:
          - { label: '$P(X=2)\approx$', loesung: 0.12, toleranz: 0.01, aria: 'P(X gleich 2)', zeige: { werte: [2] } }
        hinweis: 'Höhe des markierten Balkens an der senkrechten Achse ablesen, sie liegt etwas über $0{,}1$.'
      - typ: aufdecken
        frage: 'Und für mehrere Anzahlen?'
        knopf: 'Zeigen'
        text: '<p><strong>Mindestens 7</strong> Treffer heißt $7$, $8$, $9$ oder $10$ Treffer. Die vier Balken werden abgelesen und addiert:</p>$$\begin{align*}&P(X\geq 7)\\&\approx 0{,}04+0{,}01\\&\quad+0{,}00+0{,}00\\&=0{,}05\end{align*}$$<p><strong>Merke:</strong></p><ul><li>Die Höhe des Balkens von $k$ ist $P(X=k)$.</li><li>Für einen Bereich die Balken addieren.</li></ul>'
        zeige: { bereiche: [[7, 10]], werte: [7, 8, 9, 10] }

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Welche Balken?'
    text: '<p>Gleicher Bogenschütze. Gesucht ist die Wahrscheinlichkeit für <strong>mindestens 5 und weniger als 7</strong> Treffer.</p>'
    visual:
      typ: histogramm
      n: 10
      p: 0.4
    schritte:
      - typ: auswahl
        frage: 'Welche Balken gehören dazu?'
        optionen:
          - '$5$ und $6$'
          - '$5$, $6$ und $7$'
          - '$6$ und $7$'
        korrekt: 0
        hinweis: '„Weniger als 7“: Die $7$ gehört nicht dazu.'
        zeige: { bereiche: [[5, 6]], werte: [5, 6] }
        danach: '$$\begin{align*}&P(5\leq X&lt;7)\\&\approx 0{,}20+0{,}11\\&=0{,}31\end{align*}$$'

  - phase: vormachen
    titel: 'Gegenereignis spart Arbeit'
    text: '<p>Gesucht ist die Wahrscheinlichkeit für <strong>höchstens 7 Treffer</strong>. Das sind acht Balken, von $0$ bis $7$.</p>'
    visual:
      typ: histogramm
      n: 10
      p: 0.4
      bereiche: [[0, 7]]
    schritte:
      - typ: auswahl
        frage: 'Alle Balken zusammen ergeben $1$. Wie geht es schneller als acht Balken zu addieren?'
        optionen:
          - '$1$ minus die Balken von $8$, $9$ und $10$'
          - '$1$ minus den Balken von $7$'
          - 'nur den Balken von $7$ ablesen'
        korrekt: 0
        hinweis: 'Welche Balken gehören <strong>nicht</strong> zu „höchstens 7“?'
        zeige: { gegen: [[8, 10]], werte: [8, 9, 10] }
        danach: '$$\begin{align*}&P(X\leq 7)\\&=1-P(X\geq 8)\\&\approx 1-(0{,}01+0{,}00+0{,}00)\\&=0{,}99\end{align*}$$<p>Weniger Balken heißt auch weniger Rundungsfehler. Die acht gerundeten Balken direkt addiert ergeben nur $0{,}98$.</p>'
      - typ: auswahl
        frage: '<strong>Mehr als 1 Treffer</strong>: Welche Balken ziehst du von $1$ ab?'
        optionen:
          - 'die Balken von $0$ und $1$'
          - 'nur den Balken von $1$'
          - 'die Balken von $0$, $1$ und $2$'
        korrekt: 0
        hinweis: '„Mehr als 1“ heißt $2$ bis $10$. Was bleibt übrig?'
        zeige: { bereiche: [[2, 10]], gegen: [[0, 1]], werte: [0, 1] }
        danach: '$$\begin{align*}&P(X&gt;1)\\&\approx 1-(0{,}01+0{,}04)\\&=0{,}95\end{align*}$$'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neues Histogramm: Busfahrten'
    text: '<p>Ein Bus ist mit einer Wahrscheinlichkeit von $70\,\%$ pünktlich. Es werden $12$ Fahrten beobachtet, $X$ zählt die pünktlichen Fahrten.</p>'
    visual:
      typ: histogramm
      n: 12
      p: 0.7
    schritte:
      - typ: zuordnen
        frage: 'Wie bestimmst du die Wahrscheinlichkeit für diese Anzahlen pünktlicher Fahrten?'
        titel_links: 'Ereignis'
        titel_rechts: 'Rechnung'
        paare:
          - { links: 'genau 8', rechts: 'Balken von $8$ ablesen' }
          - { links: 'mindestens 6 und weniger als 9', rechts: 'Balken von $6$, $7$, $8$ addieren' }
          - { links: 'mehr als 9', rechts: 'Balken von $10$, $11$, $12$ addieren' }
          - { links: 'höchstens 9', rechts: '$1$ minus Balken von $10$, $11$, $12$' }
        hilfe: 'Tippe erst links, dann rechts.'
      - typ: eingabe
        frage: 'Berechne die Wahrscheinlichkeiten für <strong>mehr als 9</strong> und für <strong>höchstens 9</strong> pünktliche Fahrten.'
        layout: zeile
        felder:
          - { label: '$P(X&gt;9)\approx$', loesung: 0.25, toleranz: 0.01, aria: 'P(X größer 9)', zeige: { bereiche: [[10, 12]], werte: [10, 11, 12] } }
          - { label: '$P(X\leq 9)\approx$', loesung: 0.75, toleranz: 0.01, aria: 'P(X kleiner gleich 9)', zeige: { bereiche: [[0, 9]], gegen: [[10, 12]] } }
        hinweis: 'Mehr als 9: $0{,}17+0{,}07+0{,}01$. Höchstens 9: dieses Ergebnis von $1$ abziehen.'

  - phase: mitmachen
    titel: 'Fast allein'
    text: '<p>Weiter mit den $12$ Busfahrten. Zu jeder Frage gibt es noch einen kleinen Tipp.</p>'
    visual:
      typ: histogramm
      n: 12
      p: 0.7
    schritte:
      - typ: eingabe
        frage: '<strong>Mindestens 7 und weniger als 10</strong> pünktliche Fahrten. Tipp: Gehört die $10$ dazu?'
        felder:
          - { label: '$P\approx$', loesung: 0.63, toleranz: 0.01, aria: 'Wahrscheinlichkeit', zeige: { bereiche: [[7, 9]], werte: [7, 8, 9] } }
        hinweis: 'Die Balken von $7$, $8$ und $9$ addieren.'
      - typ: eingabe
        frage: '<strong>Mehr als 4</strong> pünktliche Fahrten. Tipp: Welche Balken sind es <em>nicht</em>?'
        felder:
          - { label: '$P\approx$', loesung: 0.99, toleranz: 0.01, aria: 'Wahrscheinlichkeit', zeige: { bereiche: [[5, 12]], gegen: [[0, 4]], werte: [4] } }
        hinweis: 'Von $1$ die Balken von $0$ bis $4$ abziehen. Nur der von $4$ ist überhaupt zu sehen.'
