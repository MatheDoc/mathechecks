# Warm-Up zu Check 11 „μ,σ  aus n,p berechnen“ (Binomialverteilung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Kern: μ = n·p (Erwartungswert, auch bei Formulierungen „im Durchschnitt / im Mittel zu erwarten“,
# exakt mit Nachkommastellen angeben) und σ = √(n·p·(1−p)) (Standardabweichung, auf 2 NKS).
# Alle Zahlen per Python-Skript nachgerechnet.

check_id: stochastik__binomialverteilung__11
abschluss: '<p>Im Training bekommst du $n$ und eine Prozentangabe für $p$. Gefragt ist nach dem Erwartungswert $\mu$ (oft formuliert als „wie viele … im Durchschnitt / im Mittel zu erwarten sind“) und der Standardabweichung $\sigma$. Die Reihenfolge der beiden Fragen wechselt zufällig.</p><p><strong>Drei Dinge für die Eingabe:</strong> Schreibe $p$ als Dezimalzahl, gib $\mu=n\cdot p$ <strong>exakt mit Nachkommastellen</strong> an (nicht auf ganze Anzahlen runden) und runde $\sigma=\sqrt{n\cdot p\cdot (1-p)}$ auf <strong>2 Nachkommastellen</strong>.</p><p>Abkürzung: Weil $\mu=n\cdot p$ ist, gilt auch $\sigma=\sqrt{\mu\cdot (1-p)}$.</p>'
karten:

  # ── Phase A: Idee ──────────────────────────────────────────
  - phase: orientierung
    titel: 'Erwartungswert und Streuung'
    text: '<p>Eine Basketballspielerin wirft $10$-mal auf den Korb ($n=10$). Jeder Wurf trifft mit der Wahrscheinlichkeit $p=0{,}4$. Das Histogramm zeigt die Verteilung der Anzahl $X$ der Treffer.</p>'
    visual:
      typ: histogramm
      n: 10
      p: 0.4
    schritte:
      - typ: aufdecken
        frage: 'Wie viele Treffer sind <strong>im Mittel</strong> zu erwarten?'
        knopf: 'Zeigen'
        text: '<p>$40\,\%$ der $10$ Würfe treffen im Mittel, also $4$. Das ist der <strong>Erwartungswert</strong>:</p>$$\mu=n\cdot p=10\cdot 0{,}4=4$$'
        zeige: { bereiche: [[4, 4]] }
      - typ: auswahl
        frage: 'Trifft sie deshalb in jeder Serie genau $4$-mal? Schau dir die Balken an.'
        optionen:
          - 'Nein, auch $3$, $5$ oder $6$ Treffer sind recht wahrscheinlich.'
          - 'Ja, andere Anzahlen kommen praktisch nicht vor.'
          - 'Nein, alle Anzahlen von $0$ bis $10$ sind gleich wahrscheinlich.'
        korrekt: 0
        hinweis: 'Vergleiche die Höhe des Balkens von $4$ mit seinen Nachbarn.'
        zeige: { bereiche: [[3, 5]] }
      - typ: aufdecken
        frage: 'Wie stark streut die Trefferanzahl um $\mu$?'
        knopf: 'Zeigen'
        text: '<p>Das misst die <strong>Standardabweichung</strong> $\sigma$. Bei der Binomialverteilung gilt:</p>$$\begin{align*}\sigma&=\sqrt{n\cdot p\cdot (1-p)}\\&=\sqrt{10\cdot 0{,}4\cdot 0{,}6}\\&\approx 1{,}55\end{align*}$$<p><strong>Merke:</strong></p><ul><li>$\mu=n\cdot p$ gibt an, wie viele Treffer im Mittel (im Durchschnitt) zu erwarten sind.</li><li>$\sigma=\sqrt{n\cdot p\cdot (1-p)}$ ist ein Maß für die Streuung um $\mu$.</li></ul>'

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Im Sachkontext'
    text: '<p><em>Eine Gärtnerei überprüft Pflanzen auf Trockenstress. Es werden $120$ Pflanzen betrachtet. Die Wahrscheinlichkeit für eine zu trockene Pflanze beträgt $36\,\%$.</em></p><p>Im Training stehen statt der Symbole oft Formulierungen im Satz, und $p$ ist in Prozent angegeben.</p>'
    visual:
      typ: liste
      titel: 'Gärtnerei (n = 120)'
      eintraege:
        - { id: np, text: 'Parameter', gleichung: '$n=120$, $p=0{,}36$<br>$1-p=0{,}64$' }
        - { id: mu, text: 'Erwartungswert μ', gleichung: '$\mu=120\cdot 0{,}36=43{,}2$' }
        - { id: sigma, text: 'Standardabweichung σ', gleichung: '$\sigma=\sqrt{120\cdot 0{,}36\cdot 0{,}64}$<br>$\sigma\approx 5{,}26$' }
    schritte:
      - typ: auswahl
        frage: '<em>„Bestimmen Sie, wie viele zu trockene Pflanzen <strong>im Durchschnitt</strong> zu erwarten sind.“</em> Was ist gesucht, und welches $p$ setzt du ein?'
        optionen:
          - 'der Erwartungswert $\mu$, mit $p=0{,}36$'
          - 'der Erwartungswert $\mu$, mit $p=36$'
          - 'die Standardabweichung $\sigma$, mit $p=0{,}36$'
        korrekt: 0
        hinweis: '„Im Durchschnitt“ (oder „im Mittel“) zu erwarten meint $\mu$. Prozent bedeutet Hundertstel: $36\,\%=0{,}36$.'
        zeige: { eintraege: [np, mu] }
        danach: '$$\begin{align*}\mu&=n\cdot p\\&=120\cdot 0{,}36\\&=43{,}2\end{align*}$$'
      - typ: auswahl
        frage: 'Es gibt nur ganze Pflanzen. Muss man $\mu=43{,}2$ deshalb auf $43$ runden?'
        optionen:
          - 'Nein, der Erwartungswert ist ein Mittelwert und wird exakt als $43{,}2$ angegeben.'
          - 'Ja, für $\mu$ darf man nur ganze Zahlen eintragen.'
        korrekt: 0
        hinweis: 'Auch ein Notendurchschnitt von $2{,}3$ ist eine Kommazahl, obwohl es nur ganze Noten gibt.'
        danach: '<p><strong>Wichtig fürs Training:</strong> Runde $\mu$ nicht auf eine ganze Zahl, sondern trage den genauen Wert mit Nachkommastellen ein.</p>'
      - typ: aufdecken
        frage: '<strong>Standardabweichung berechnen</strong> mit $1-p=1-0{,}36=0{,}64$:'
        knopf: 'Rechnung zeigen'
        text: '$$\begin{align*}\sigma&=\sqrt{120\cdot 0{,}36\cdot 0{,}64}\\&=\sqrt{27{,}648}\\&\approx 5{,}26\end{align*}$$<p>Hier wird auf 2 Nachkommastellen gerundet.</p>'
        zeige: { eintraege: [sigma] }

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: Eisstand'
    text: '<p><em>Ein Eisstand untersucht Bestellungen mit und ohne Streusel. Es werden $150$ Bestellungen betrachtet. Die Wahrscheinlichkeit für eine Bestellung mit Streuseln beträgt $75\,\%$.</em></p>'
    visual:
      typ: liste
      titel: 'Eisstand (n = 150, p = 0,75)'
      eintraege:
        - { id: mu, text: 'Erwartungswert μ', gleichung: '$\mu=112{,}5$' }
        - { id: sigma, text: 'Standardabweichung σ', gleichung: '$\sigma\approx 5{,}30$' }
    schritte:
      - typ: eingabe
        frage: 'Wie viele Bestellungen mit Streuseln sind <strong>im Durchschnitt</strong> zu erwarten? $$\mu=150\cdot 0{,}75$$'
        felder:
          - { label: '$\mu=$', loesung: 112.5, aria: 'Erwartungswert', zeige: { eintraege: [mu] } }
        hinweis: 'Rechne $150\cdot 0{,}75$ und lass die Nachkommastelle stehen.'
      - typ: eingabe
        frage: 'Berechne die Standardabweichung auf 2 Nachkommastellen: $$\sigma=\sqrt{150\cdot 0{,}75\cdot 0{,}25}$$'
        felder:
          - { label: '$\sigma\approx$', loesung: 5.30, toleranz: 0.01, aria: 'Standardabweichung', zeige: { eintraege: [sigma] } }
        hinweis: 'Unter der Wurzel steht $28{,}125$. Ziehe daraus die Wurzel.'

  - phase: mitmachen
    titel: 'Fast allein: Rücksendungen'
    text: '<p><em>Ein Online-Shop betrachtet $130$ Bestellungen. Die Wahrscheinlichkeit, dass eine Bestellung zurückgeschickt wird, beträgt $15\,\%$.</em></p>'
    visual:
      typ: liste
      titel: 'Online-Shop (n = 130)'
      eintraege:
        - { id: ansatz, text: 'Ansatz σ', gleichung: '$\sigma=\sqrt{130\cdot 0{,}15\cdot 0{,}85}$' }
        - { id: mu, text: 'Erwartungswert μ', gleichung: '$\mu=19{,}5$' }
        - { id: sigma, text: 'Standardabweichung σ', gleichung: '$\sigma\approx 4{,}07$' }
    schritte:
      - typ: auswahl
        frage: 'Welcher Ansatz liefert die Standardabweichung?'
        optionen:
          - '$\sqrt{130\cdot 0{,}15\cdot 0{,}85}$'
          - '$\sqrt{130\cdot 0{,}15}$'
          - '$130\cdot 0{,}15\cdot 0{,}85$'
        korrekt: 0
        hinweis: 'In die Formel gehören $n$, $p$ und $1-p$, und am Ende kommt die Wurzel.'
        zeige: { eintraege: [ansatz] }
      - typ: eingabe
        frage: 'Wie viele Rücksendungen sind <strong>im Mittel</strong> zu erwarten, und wie groß ist $\sigma$? Tipp: Wird $\mu$ gerundet?'
        layout: zeile
        felder:
          - { label: '$\mu=$', loesung: 19.5, aria: 'Erwartungswert', zeige: { eintraege: [mu] } }
          - { label: '$\sigma\approx$', loesung: 4.07, toleranz: 0.01, aria: 'Standardabweichung', zeige: { eintraege: [sigma] } }
        hinweis: '$\mu=130\cdot 0{,}15$ exakt mit Nachkommastelle. Für $\sigma$ den Ansatz von oben eintippen und auf 2 Nachkommastellen runden.'
