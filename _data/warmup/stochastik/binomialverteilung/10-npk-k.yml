# Warm-Up zu Check 10 „Intervallgrenzen mit Intervall-Wkt bestimmen“ (Binomialverteilung)
# titel, kompetenz, nummer und training_url kommen aus _data/checks.json (über check_id).
# Format und Leitlinien: _data/warmup/README.md
# Aufbau wie Check 08/09, nur mit k: k lässt sich nur ausprobieren, P(X≥k) fällt, P(X≤k) steigt mit k,
# Nachbarn-Paar bei ganzzahligem k, Startwert k≈n·p (Erwartungswert).
# „größtes k“ = größtes k, für das die Bedingung gilt; „kleinstes k“ = kleinstes k, für das sie gilt.
# Das Probieren läuft über Bcd(a;b;n;p); anders als bei Check 08/09 ändert sich je nach Ungleichung
# die untere Grenze (Bcd(k;n;n;p) für „mindestens k“) oder die obere Grenze (Bcd(0;k;n;p) für „höchstens k“).
# Kombinationen: Zuschauen (größtes/≥/≥, kleinstes/≤/≥), Mitmachen (kleinstes/≥/≤, größtes/≤/≤, kleinstes/≤/≥).
# Zahlen nachgerechnet mit math.comb (exakte Bernoulli-Formel), gerundet auf 4 Nachkommastellen.

check_id: stochastik__binomialverteilung__10
abschluss: '<p>Im Training stehen $n$, $p$ und eine Bedingung wie $P(X\geq k)\geq 0{,}87$, und du suchst $k$. Die Zahlen sind größer, der Plan bleibt gleich: Starte bei $k\approx n\cdot p$, prüfe, ob die Bedingung gilt, und taste dich mit dem Taschenrechner Schritt für Schritt (bei großen Zahlen auch in größeren Sprüngen) an die Schwelle heran. Die Antwort sind <strong>zwei Nachbarn</strong>, bei denen die Bedingung kippt. Beim „größten $k$“ gibst du das größte $k$ an, bei dem sie gilt, beim „kleinsten $k$“ das kleinste. Achte bei $Bcd$ darauf, dass $k$ je nach Ungleichung an einer anderen Stelle steht: $Bcd(k;n;n;p)$ für „mindestens $k$“, $Bcd(0;k;n;p)$ für „höchstens $k$“.</p>'
karten:

  # ── Phase A: Idee ─────────────────────────────────────────
  - phase: orientierung
    titel: 'k lässt sich nur ausprobieren'
    text: '<p>Ein Basketballspieler wirft $20$-mal, jeder Wurf ist mit $p=0{,}35$ ein Treffer. Wie viele Treffer $k$ kann man <strong>höchstens</strong> verlangen, damit die Wahrscheinlichkeit für <strong>mindestens $k$ Treffer</strong> mindestens $60\,\%$ beträgt? Als Bedingung:</p>$$P(X\geq k)\geq 0{,}6$$<p>Bisher war $k$ immer gegeben, jetzt ist $k$ gesucht. Es steckt aber in den Grenzen einer Summe, und die Wahrscheinlichkeit ändert sich in Sprüngen. Es gibt <strong>keine Formel</strong>, die man nach $k$ auflösen könnte.</p>'
    visual:
      typ: liste
      titel: 'P(X ≥ k) bei n = 20, p = 0,35'
      eintraege:
        - { id: k2, text: 'k = 2', gleichung: '$P(X\geq 2)\approx 0{,}9979$' }
        - { id: k5, text: 'k = 5', gleichung: '$P(X\geq 5)\approx 0{,}8818$' }
        - { id: k8, text: 'k = 8', gleichung: '$P(X\geq 8)\approx 0{,}3990$' }
        - { id: k11, text: 'k = 11', gleichung: '$P(X\geq 11)\approx 0{,}0532$' }
    schritte:
      - typ: aufdecken
        frage: 'Was bleibt, ist <strong>Ausprobieren</strong>.'
        knopf: 'Werte zeigen'
        text: '<p>Man setzt verschiedene $k$ ein und lässt den Taschenrechner $P(X\geq k)$ berechnen. Rechts siehst du das für $k=2,5,8,11$.</p>'
        zeige: { eintraege: [k2, k5, k8, k11] }
      - typ: auswahl
        frage: 'Schau dir die Werte an. Was passiert mit $P(X\geq k)$, wenn $k$ größer wird?'
        optionen:
          - 'Sie wird kleiner.'
          - 'Sie wird größer.'
          - 'Sie steigt erst und fällt dann.'
        korrekt: 0
        hinweis: 'Lies die Werte rechts von oben nach unten.'
        danach: '<p>Genau: Je größer $k$, desto weniger Ausgänge gehören zu „mindestens $k$“. Bei $P(X\leq k)$ ist es umgekehrt: Je größer $k$, desto mehr Ausgänge gehören dazu, die Wahrscheinlichkeit <strong>wächst</strong>.</p>'
      - typ: aufdecken
        frage: 'Wo liegt die Antwort?'
        knopf: 'Zeigen'
        text: '<p>Bei $k=5$ ist $P(X\geq k)$ noch größer als $0{,}6$, bei $k=8$ schon kleiner. Dazwischen <strong>kippt</strong> die Bedingung. Dort probiert man in Einerschritten weiter, bis man zwei Nachbarn findet: einen, bei dem die Bedingung gilt, und einen, bei dem sie nicht gilt.</p><p><strong>Merke:</strong></p><ul><li>$k$ lässt sich nicht ausrechnen, nur ausprobieren.</li><li>$P(X\geq k)$ fällt mit $k$, $P(X\leq k)$ wächst mit $k$.</li><li>Die Antwort liegt bei zwei Nachbarn, zwischen denen die Bedingung kippt.</li></ul>'

  # ── Phase B: Zuschauen ─────────────────────────────────────
  - phase: vormachen
    titel: 'Größtes k: bis wann reicht es?'
    text: '<p>Weiter mit den $20$ Würfen, $p=0{,}35$: Gesucht ist das größte $k$ mit $P(X\geq k)\geq 0{,}6$.</p><p>Im Training brauchst du einen guten <strong>Startwert</strong>: den Erwartungswert $\mu=n\cdot p=20\cdot 0{,}35=7$.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 20, p = 0,35)'
      eintraege:
        - { id: k7, text: 'k = 7', gleichung: '$P(X\geq 7)\approx 0{,}5834$<br>$0{,}5834&lt;0{,}6$: reicht nicht' }
        - { id: k6, text: 'k = 6', gleichung: '$P(X\geq 6)\approx 0{,}7546$<br>$0{,}7546\geq 0{,}6$: reicht' }
    schritte:
      - typ: aufdecken
        frage: 'Zuerst den Startwert testen.'
        knopf: 'k = 7 testen'
        text: '$$\begin{align*}&Bcd(7;20;20;0{,}35)\\&\approx 0{,}5834\end{align*}$$<p>Das ist kleiner als $0{,}6$. Weil $P(X\geq k)$ mit $k$ fällt, geht es mit kleinerem $k$ weiter.</p>'
        zeige: { eintraege: [k7] }
      - typ: auswahl
        frage: 'Wie lautet die Eingabe für $k=6$? Jetzt ändert sich die <strong>untere</strong> Grenze.'
        optionen:
          - '$Bcd(6;20;20;0{,}35)$'
          - '$Bcd(0;6;20;0{,}35)$'
          - '$Bcd(6;6;20;0{,}35)$'
        korrekt: 0
        hinweis: '„Mindestens 6“ reicht von $6$ bis zur größten Anzahl $n=20$.'
        zeige: { eintraege: [k6] }
        danach: '$$\begin{align*}&Bcd(6;20;20;0{,}35)\\&\approx 0{,}7546\end{align*}$$<p>Das ist größer als $0{,}6$: Es reicht.</p>'
      - typ: auswahl
        frage: 'Welches $k$ ist die Antwort?'
        optionen:
          - '$k=6$'
          - '$k=7$'
          - '$k=5$'
        korrekt: 0
        hinweis: 'Gesucht ist das <strong>größte</strong> $k$, bei dem $P(X\geq k)\geq 0{,}6$ gilt. Bei $k=7$ gilt es nicht mehr.'
        danach: '<p>Man kann höchstens $6$ Treffer verlangen. Beim „größten $k$“ zählt der Nachbar, bei dem die Bedingung gerade noch gilt.</p>'

  - phase: vormachen
    titel: 'Kleinstes k: ab wann reicht es?'
    text: '<p>Dieselben $20$ Würfe, $p=0{,}35$. Jetzt die andere Richtung: Wie viele Treffer $k$ muss man <strong>mindestens</strong> zulassen, damit die Wahrscheinlichkeit für <strong>höchstens $k$ Treffer</strong> mindestens $80\,\%$ beträgt?</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 20, p = 0,35)'
      eintraege:
        - { id: k7, text: 'k = 7', gleichung: '$P(X\leq 7)\approx 0{,}6010$<br>$0{,}6010&lt;0{,}8$: reicht nicht' }
        - { id: k8, text: 'k = 8', gleichung: '$P(X\leq 8)\approx 0{,}7624$<br>$0{,}7624&lt;0{,}8$: reicht nicht' }
        - { id: k9, text: 'k = 9', gleichung: '$P(X\leq 9)\approx 0{,}8782$<br>$0{,}8782\geq 0{,}8$: reicht' }
    schritte:
      - typ: auswahl
        frage: 'Welche Bedingung steckt im Text?'
        optionen:
          - '$P(X\leq k)\geq 0{,}8$'
          - '$P(X\geq k)\leq 0{,}8$'
          - '$P(X\leq k)\leq 0{,}8$'
        korrekt: 0
        hinweis: '„Höchstens $k$ Treffer“ gehört zu $X$, „mindestens $80\,\%$“ zur Wahrscheinlichkeit. Das „mindestens“ vor dem Zulassen betrifft nur $k$.'
        zeige: { eintraege: [k7, k8, k9] }
        danach: '<p>Richtig. Bei „höchstens $k$“ ändert sich die <strong>obere</strong> Grenze: $Bcd(0;k;20;0{,}35)$. Rechts ist ab dem Startwert $\mu=7$ probiert, bis die Bedingung kippt.</p>'
      - typ: auswahl
        frage: 'Welches $k$ ist die Antwort?'
        optionen:
          - '$k=9$'
          - '$k=8$'
          - '$k=10$'
        korrekt: 0
        hinweis: 'Gesucht ist das <strong>kleinste</strong> $k$, bei dem $P(X\leq k)\geq 0{,}8$ gilt. Bei $k=8$ gilt es noch nicht.'
        danach: '<p>Man muss mindestens $9$ Treffer zulassen. Beim „kleinsten $k$“ zählt der Nachbar, bei dem die Bedingung zum ersten Mal gilt.</p>'

  # ── Phase C: Mitmachen ─────────────────────────────────────
  - phase: mitmachen
    titel: 'Neue Zahlen: Quiz'
    text: '<p>Ein Quiz hat $25$ Fragen, jede Antwort wird geraten, mit $p=0{,}2$ ist sie richtig. Gesucht ist der <strong>kleinste</strong> Wert von $k$, für den die Wahrscheinlichkeit für <strong>mindestens $k$</strong> richtige Antworten <strong>höchstens $25\,\%$</strong> beträgt.</p><p>Gegeben: $n=25$ und $p=0{,}2$. Die Tabelle ist schon fertig.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 25, p = 0,2)'
      eintraege:
        - { id: k5, text: 'k = 5', erledigt: true, gleichung: '$P(X\geq 5)\approx 0{,}5793$<br>$0{,}5793&gt;0{,}25$: gilt nicht' }
        - { id: k6, text: 'k = 6', erledigt: true, gleichung: '$P(X\geq 6)\approx 0{,}3833$<br>$0{,}3833&gt;0{,}25$: gilt nicht' }
        - { id: k7, text: 'k = 7', erledigt: true, gleichung: '$P(X\geq 7)\approx 0{,}2200$<br>$0{,}2200\leq 0{,}25$: gilt' }
    schritte:
      - typ: zuordnen
        frage: 'Bevor du selbst rechnest: Was passt zusammen?'
        titel_links: 'Situation'
        titel_rechts: 'Folge'
        paare:
          - { links: '$P(X\geq k)$ bei größerem $k$', rechts: 'wird kleiner' }
          - { links: '$P(X\leq k)$ bei größerem $k$', rechts: 'wird größer' }
          - { links: 'gesucht: <strong>größtes</strong> $k$', rechts: 'größtes $k$, für das die Bedingung gilt' }
          - { links: 'gesucht: <strong>kleinstes</strong> $k$', rechts: 'kleinstes $k$, für das die Bedingung gilt' }
        danach: '<p>Die Bedingung prüfst du immer genau so, wie sie in der Aufgabe steht, auch wenn dort $\leq$ steht. Rechts ist das schon geschehen.</p>'
      - typ: eingabe
        frage: 'Lies aus der Tabelle das gesuchte $k$ ab.'
        felder:
          - { label: '$k=$', loesung: 7, aria: 'gesuchtes k' }
        hinweis: 'Gesucht ist das kleinste $k$, für das die Bedingung gilt. Bei $k=6$ gilt sie noch nicht.'
        danach: '<p>Der kleinste Wert ist $k=7$.</p>'

  - phase: mitmachen
    titel: 'Neue Zahlen: Umfrage'
    text: '<p>$30$ Personen werden befragt, jede ist mit $p=0{,}5$ Vereinsmitglied. Gesucht ist der <strong>größte</strong> Wert von $k$, für den die Wahrscheinlichkeit für <strong>höchstens $k$</strong> Mitglieder <strong>höchstens $30\,\%$</strong> beträgt.</p><p>Gegeben: $n=30$ und $p=0{,}5$.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 30, p = 0,5)'
      eintraege:
        - { id: k13, text: 'k = 13', gleichung: '$P(X\leq 13)\approx 0{,}2923$<br>$0{,}2923\leq 0{,}3$: gilt' }
        - { id: k14, text: 'k = 14', gleichung: '$P(X\leq 14)\approx 0{,}4278$<br>$0{,}4278&gt;0{,}3$: gilt nicht' }
    schritte:
      - typ: eingabe
        frage: 'Die Nachbarn sind $k=13$ und $k=14$. Rechne mit $Bcd(0;k;30;0{,}5)$, auf 4 Nachkommastellen gerundet.'
        layout: zeile
        felder:
          - { label: '$k=13$:', loesung: 0.2923, aria: 'P für k gleich 13', zeige: { eintraege: [k13] } }
          - { label: '$k=14$:', loesung: 0.4278, aria: 'P für k gleich 14', zeige: { eintraege: [k14] } }
        hinweis: 'Gib $Bcd(0;13;30;0{,}5)$ und $Bcd(0;14;30;0{,}5)$ ein. Die obere Grenze ist das gesuchte $k$.'
      - typ: eingabe
        frage: 'Welches $k$ ist die Antwort?'
        felder:
          - { label: '$k=$', loesung: 13, aria: 'gesuchtes k' }
        hinweis: 'Die Bedingung lautet $P(X\leq k)\leq 0{,}3$. Bei $k=13$ gilt sie noch, bei $k=14$ nicht mehr. Gesucht ist das größte $k$.'
        danach: '<p>Der größte Wert ist $k=13$.</p>'

  - phase: mitmachen
    titel: 'Selbst herantasten'
    text: '<p>In $40$ Paketen liegt jeweils mit $p=0{,}25$ ein Gutschein. Wie viele Gutscheine $k$ muss man <strong>mindestens</strong> zulassen, damit die Wahrscheinlichkeit für <strong>höchstens $k$</strong> Gutscheine <strong>mindestens $90\,\%$</strong> beträgt?</p><p>Gegeben: $n=40$ und $p=0{,}25$. Hier tastest du dich selbst an das $k$ heran.</p>'
    visual:
      typ: liste
      titel: 'Probieren (n = 40, p = 0,25)'
      eintraege:
        - { id: k10, text: 'k = 10', gleichung: '$P(X\leq 10)\approx 0{,}5839$<br>$0{,}5839&lt;0{,}9$: reicht nicht' }
        - { id: k12, text: 'k = 12', gleichung: '$P(X\leq 12)\approx 0{,}8209$<br>$0{,}8209&lt;0{,}9$: reicht nicht' }
        - { id: k13, text: 'k = 13', gleichung: '$P(X\leq 13)\approx 0{,}8968$<br>$0{,}8968&lt;0{,}9$: reicht nicht' }
        - { id: k14, text: 'k = 14', gleichung: '$P(X\leq 14)\approx 0{,}9456$<br>$0{,}9456\geq 0{,}9$: reicht' }
    schritte:
      - typ: eingabe
        frage: '<strong>Startwert:</strong> Berechne $k=n\cdot p$ und teste ihn.'
        layout: zeile
        felder:
          - { label: '$k=$', loesung: 10, aria: 'Startwert k' }
          - { label: '$P(X\leq k)\approx$', loesung: 0.5839, aria: 'P für den Startwert', zeige: { eintraege: [k10] } }
        hinweis: '$k=40\cdot 0{,}25$. Dann $Bcd(0;k;40;0{,}25)$: Bei „höchstens $k$“ steht $k$ an zweiter Stelle.'
      - typ: auswahl
        frage: 'Die Wahrscheinlichkeit ist noch zu klein ($0{,}5839&lt;0{,}9$). Wie geht es weiter?'
        optionen:
          - 'Mit größerem $k$ weiterprobieren.'
          - 'Mit kleinerem $k$ weiterprobieren.'
          - '$k=10$ als Antwort nehmen.'
        korrekt: 0
        hinweis: '$P(X\leq k)$ wächst mit $k$. Sie soll noch größer werden.'
      - typ: eingabe
        frage: 'Taste dich heran. Welches $k$ ist die Antwort?'
        felder:
          - { label: '$k=$', loesung: 14, aria: 'gesuchtes k' }
        hinweis: 'Probiere $k=11$, $12$, … Gesucht ist das kleinste $k$ mit $P(X\leq k)\geq 0{,}9$.'
        zeige: { eintraege: [k12, k13, k14] }
        danach: '<p>Bei $k=12$ ist $P\approx 0{,}8209$ und bei $k=13$ ist $P\approx 0{,}8968$, beides noch zu klein. Bei $k=14$ ist $P\approx 0{,}9456$. Man muss mindestens $14$ Gutscheine zulassen.</p>'
