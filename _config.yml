# Der service role key wird hier bewusst nicht hinterlegt.
supabase_url: "https://ysqpmtreljfdwtlvjzis.supabase.co"
supabase_anon_key: "sb_publishable_BIs3hzfB55PaH9sydQ35bw_ipGzUGIX"
