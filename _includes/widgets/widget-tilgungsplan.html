<div class="skript-widget tp-widget">
    <div class="widget-controls">
        <div class="widget-row">
            <label>Darlehenssumme $ K_0 $ = <span class="tp-k0Wert">60.000</span> €</label>
            <input type="range" class="tp-k0Slider" min="10000" max="500000" step="10000" value="60000">
        </div>
        <div class="widget-row">
            <label>Zinssatz $ p $ = <span class="tp-pWert">5</span> %</label>
            <input type="range" class="tp-pSlider" min="1" max="8" step="0.25" value="5">
        </div>
        <div class="widget-row">
            <label>Laufzeit $ n $ = <span class="tp-nWert">10</span> Jahre</label>
            <input type="range" class="tp-nSlider" min="2" max="15" step="1" value="10">
        </div>
        <div class="widget-row widget-row--center">
            <span class="tp-annuitaet"></span>
        </div>
        <div class="widget-info tp-hinweis"></div>
    </div>

    <div class="widget-outputs">
        <div class="tp-plot diagramm"></div>
        <div class="tp-tableWrap">
            <table class="tp-table">
                <thead>
                    <tr>
                        <th>Jahr</th>
                        <th>Restschuld (Anfang)</th>
                        <th>Zinsen</th>
                        <th>Tilgung</th>
                        <th>Annuität</th>
                        <th>Restschuld (Ende)</th>
                    </tr>
                </thead>
                <tbody class="tp-tableBody"></tbody>
            </table>
        </div>
    </div>
</div>
