<div class="skript-widget zzh-widget">
    <div class="widget-controls">
        <div class="widget-row">
            <label>Anfangskapital $ K_0 $ = <span class="zzh-k0Wert">3.000</span> €</label>
            <input type="range" class="zzh-k0Slider" min="500" max="10000" step="500" value="3000">
        </div>
        <div class="widget-row">
            <label>Zinssatz $ p $ = <span class="zzh-pWert">3</span> %</label>
            <input type="range" class="zzh-pSlider" min="0.5" max="10" step="0.5" value="3">
        </div>
        <div class="widget-row">
            <label>Laufzeit $ n $ = <span class="zzh-nWert">6</span> Jahre</label>
            <input type="range" class="zzh-nSlider" min="2" max="6" step="1" value="6">
        </div>
        <div class="widget-row">
            <label>
                <input type="checkbox" class="zzh-zinsen" checked>
                Zinsen mit Rechenweg anzeigen
            </label>
        </div>
        <div class="widget-row widget-row--center">
            <span class="zzh-q"></span>
        </div>
    </div>

    <div class="widget-outputs">
        <div class="zzh-zeitstrahl"></div>
        <div class="zzh-herleitung"></div>
    </div>
</div>
