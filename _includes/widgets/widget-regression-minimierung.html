<!-- Widget: Regression – Minimierung der Quadratsumme (m, b der Geraden) -->
<div class="skript-widget skript-widget--aside rm-widget">
    <div class="widget-controls">
        <div class="widget-row">
            <label>$ m $ = <span class="rm-mWert">0,25</span></label>
            <input type="range" class="rm-mSlider" min="-0.5" max="2" step="0.05" value="0.25" aria-label="Steigung m">
        </div>
        <div class="widget-row">
            <label>$ b $ = <span class="rm-bWert">4</span></label>
            <input type="range" class="rm-bSlider" min="-2" max="5" step="0.25" value="4" aria-label="y-Abschnitt b">
        </div>
        <div class="widget-row widget-row--center">
            <span class="rm-eqDisplay"></span>
        </div>
        <div class="rm-sse">
            <div class="rm-sse__label">Summe der quadratischen Abweichungen</div>
            <div class="rm-sse__bar" aria-hidden="true">
                <div class="rm-sse__fill"></div>
            </div>
            <div class="rm-sse__value" aria-live="polite"></div>
        </div>
        <div class="widget-actions">
            <button type="button" class="widget-button rm-bestButton">Beste Gerade anzeigen</button>
            <button type="button" class="widget-button rm-resetButton">Zurücksetzen</button>
        </div>
        <div class="widget-info">Verschiebe die Regler so, dass die orangen Quadrate zusammen möglichst klein werden.</div>
    </div>

    <div class="widget-outputs">
        <div class="rm-plot diagramm"></div>
    </div>
</div>
