# Muster-Config für eine Klausur – nach klausuren/<slug>/config.yml kopieren und anpassen.
# Schema und Erläuterungen: klausuren/README.md

fach: 3. Klausur Mathematik           # Überschrift/Fach
klasse: WG3X                          # Klasse/Kurs
datum: 01.02.2027                     # Klausurdatum
thema: Abivorklausur              # erscheint im Klausurkopf
bearbeitungszeit: 300                 # Minuten (numerisch)
geplante_punkte: 120                  # grobe Zielgröße, keine exakte Summe

# --- Inhaltliche Orientierung ---------------------------------------------------------

# Beispiel: themen: [mehrstufige-produktionsprozesse, stochastische-matrizen]
themen: [ganzrationale-oekonomische-funktionen, produktlebenszyklus, ertragsgesetzliche-kostenfunktionen, regression, marktgleichgewicht-vertiefung, bedingte-wahrscheinlichkeiten, binomialverteilung, mehrstufige-produktionsprozesse, stochastische-matrizen, lineare-optimierung]

# Beispiel:
#   checks:
#     - lernbereich: lineare-algebra/mehrstufige-produktionsprozesse
#       checks: [1, 2, 3, 4]
checks: []

# Beispiel:
#   hinweise: |
#     Eine Aufgabe ohne Hilfsmittel.
#     Aufbau einer Aufgabe ähnlich wie nw-bgym-wuv-2025-haupt-erhoeht-a3, Teil 3.2.
hinweise: |
  Formales:
  In Aufgabenteil A sind keine Hilfsmittel erlaubt.
  In Teil A gibt 4 Pflichtteilaufgaben (1.1, 1.2, 1.3, 1.4 mit 2x Analysis, 1x Stochastik, 1x Lineare Algebra).
  Weiter gibt es in Teil A 4 Wahlaufgaben (1.5, 1.6, 1.7, 1.8 mit2x Analysis, 1x Stochastik, 1x Lineare Algebra), von denen 2 beliebige gewählt werden müssen.
  Jede der 8 Teilaufgaben von Teil muss 5 Punkte haben.

  In Aufgabenteil B sind Hilfsmittel erlaubt.
  In Teil B gibt 3 Aufgaben (1x Analysis, 1x Stochastik, 1x Lineare Algebra), mit jeweils 30 Punkten.

  Insgesamt ergibt sich damit zwingend eine Gesamtpunktzahl von 120 Punkten (30 aus Teil A (beachte, dass es hier Wahlaufgaben gibt), 90 aus Teil B)
